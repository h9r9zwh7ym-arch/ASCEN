"],"pull",!1,{sets:3,repsMin:10,repsMax:15,restSec:60},["Debout, barre tenue bras tendus devant les cuisses.","Monte les \xE9paules vers les oreilles sans plier les coudes.","Tiens une seconde en haut puis redescends lentement."],"Ne fais pas rouler les \xE9paules : un mouvement vertical suffit et \xE9pargne l'articulation."],["good_morning_barre","Good morning barre",["ischios","fessiers","dos"],["barbell","rack"],"hinge",!1,{sets:3,repsMin:8,repsMax:12,restSec:90},["Barre sur le haut du dos, genoux l\xE9g\xE8rement fl\xE9chis.","Pousse les hanches en arri\xE8re en inclinant le buste, dos neutre.","Remonte en contractant fessiers et ischios."],"Exercice technique : commence avec la barre \xE0 vide et arr\xEAte la descente d\xE8s que le dos s'arrondit."],["halo_kb","Halo kettlebell",["epaules","abdos"],["kettlebell"],"push",!1,{sets:3,repsMin:6,repsMax:10,restSec:45},["Kettlebell tenue par les cornes, \xE0 l'envers, devant la poitrine.","Fais-la tourner autour de la t\xEAte, au plus pr\xE8s, en gardant les abdos serr\xE9s.","Alterne le sens \xE0 chaque r\xE9p\xE9tition."],"Prends une charge l\xE9g\xE8re : c'est un exercice de mobilit\xE9 et de stabilit\xE9 d'\xE9paule."],["fente_goblet_kb","Fente arri\xE8re goblet kettlebell",["quadriceps","fessiers"],["kettlebell"],"lunge",!0,{sets:3,repsMin:8,repsMax:12,restSec:75},["Kettlebell tenue contre la poitrine, coudes serr\xE9s.","Recule d'un grand pas et descends genoux proches de 90\xB0.","Reviens en poussant sur le talon avant."],"Garde le buste droit et la kettlebell pr\xE8s du corps."],["swing_kb_uni","Swing kettlebell \xE0 une main",["fessiers","ischios","abdos"],["kettlebell"],"hinge",!0,{sets:3,repsMin:10,repsMax:15,restSec:75},["Kettlebell dans une main, pieds un peu plus larges que les hanches.","Bascule les hanches en arri\xE8re, puis projette-les vers l'avant pour propulser la kettlebell.","Garde les \xE9paules de face malgr\xE9 la charge d'un seul c\xF4t\xE9."],"Le mouvement vient des hanches, pas du bras ; m  menton au-dessus.","Descends le plus lentement possible (3 \xE0 5 s) jusqu'\xE0 bras tendus.","Reprends appui sur le support pour remonter."],"Id\xE9al pour progresser vers la traction ; arr\xEAte quand la descente n'est plus contr\xF4l\xE9e."],["releve_jambes_suspendu","Relev\xE9 de jambes tendues suspendu",["abdos"],["bodyweight","pullup_bar"],"core",!1,{sets:3,repsMin:6,repsMax:12,restSec:75},["Suspendu \xE0 la barre, \xE9paules engag\xE9es, corps immobile.","Monte les jambes tendues jusqu'\xE0 l'horizontale ou plus haut.","Redescends lentement sans te balancer."],"Si tu te balances, reviens au relev\xE9 de genoux suspendu."],["roue_abdo_genoux","Roue abdominale \xE0 genoux",["abdos","dos"],["ab_roller"],"core",!1,{sets:3,repsMin:6,repsMax:12,restSec:60},["\xC0 genoux sur un tapis, mains sur la roue sous les \xE9paules, bassin l\xE9g\xE8rement rentr\xE9.","Roule vers l'avant en gardant le dos plat, aussi loin que tu restes gain\xE9.","Reviens en tirant avec les abdos, sans creuser le bas du dos."],"Commence par une amplitude courte (15 \xE0 20 cm) et allonge progressivement : le bas du dos ne doit jamais se cambrer."],["roue_abdo_debout","Roue abdominale debout",["abdos","dos","epaules"],["ab_roller"],"core",!1,{sets:3,repsMin:3,repsMax:8,restSec:90},["Debout, jambes tendues, pose la roue au sol devant tes pieds.","Roule vers l'avant jusqu'\xE0 la limite o\xF9 tu restes parfaitement gain\xE9.","Reviens sans plier les hanches en premier."],"Variante tr\xE8s avanc\xE9e : ma\xEEtrise d'abord 12 roul\xE9s complets \xE0 genoux."],["dips_barres","Dips aux barres parall\xE8les",["triceps","pect","epaules"],["dip_bars"],"push",!1,{sets:3,repsMin:5,repsMax:12,restSec:90},["En appui bras tendus, \xE9paules basses, buste l\xE9g\xE8rement pench\xE9.","Descends jusqu'\xE0 ce que les bras soient proches de l'horizontale.","Pousse pour revenir bras tendus, sans balancer."],"Ne descends pas plus bas qu'un angle confortable pour l'\xE9paule ; commence par des descentes lentes si besoin."],["releve_genoux_barres","Relev\xE9 de genoux aux barres parall\xE8les",["abdos"],["dip_bars"],"core",!1,{sets:3,repsMin:8,repsMax:15,restSec:60},["En appui sur les avant-bras ou bras tendus, dos contre le dossier si ta station en a un.","Monte les genoux vers la poitrine en enroulant le bassin.","Redescends lentement sans te balancer."],"Garde les \xE9paules basses et actives pendant tout l'exercice."],["l_sit","L-sit aux barres parall\xE8les",["abdos","triceps"],["dip_bars"],"core",!1,{sets:3,repsMin:10,repsMax:30,restSec:75},["En appui bras tendus, \xE9paules basses.","Monte les jambes tendues \xE0 l'horizontale (ou genoux fl\xE9chis pour d\xE9buter).","Tiens la position en respirant (dur\xE9e en secondes)."],"Exercice avanc\xE9 : commence genoux fl\xE9chis (tuck) et allonge les jambes avec le temps."],["rowing_sangles","Rowing aux sangles",["dos","biceps"],["suspension"],"pull",!1,{sets:3,repsMin:8,repsMax:15,restSec:60},["Poign\xE9es en main, corps droit et inclin\xE9 vers l'arri\xE8re, pieds devant.","Tire la poitrine vers les mains en serrant les omoplates.","Redescends contr\xF4l\xE9 jusqu'aux bras tendus."],"Plus tu avances les pieds, plus c'est difficile : r\xE8gle l'inclinaison pour rester dans la fourchette de r\xE9p\xE9titions."],["pompes_sangles","Pompes aux sangles",["pect","triceps","epaules"],["suspension"],"push",!1,{sets:3,repsMin:8,repsMax:15,restSec:75},["Mains dans les poign\xE9es, corps inclin\xE9 et align\xE9.","Descends en ouvrant les bras jusqu'\xE0 ce que les mains arrivent \xE0 hauteur de poitrine.","Pousse en gardant les sangles pr\xE8s du corps."],"L'instabilit\xE9 rend l'exercice exigeant pour les \xE9paules : commence debout, peu inclin\xE9."],["squat_sangles","Squat unilat\xE9ral assist\xE9 aux sangles",["quadriceps","fessiers"],["suspension"],"squat",!0,{sets:3,repsMin:6,repsMax:12,restSec:75},["Poign\xE9es en main, en appui sur une jambe, l'autre tendue devant.","Descends en arri\xE8re, les sangles t'aidant \xE0 garder l'\xE9quilibre.","Remonte en poussant sur le talon."],"Utilise les bras seulement pour l'\xE9quilibre, pas pour te tirer vers le haut."],["curl_sangles","Curl biceps aux sangles",["biceps"],["suspension"],"pull",!1,{sets:3,repsMin:10,repsMax:15,restSec:60},["Face au point d'ancrage, paumes vers le haut, bras tendus devant.","Plie les coudes pour amener les mains vers le front, coudes fixes.","Redescends lentement."],"Garde le corps gain\xE9 comme une planche pendant tout le mouvement."],["fallout_sangles","Roll-out aux sangles",["abdos","epaules"],["suspension"],"core",!1,{sets:3,repsMin:6,repsMax:12,restSec:60},["Debout, poign\xE9es en main, bras tendus devant, corps inclin\xE9.","Monte les bras au-dessus de la t\xEAte en laissant le corps descendre vers l'avant.","Reviens en tirant avec les abdos, sans creuser le dos."],"R\xE9duis l'amplitude si le bas du dos se creuse."],["rowing_inverse_barre","Rowing invers\xE9 \xE0 la barre",["dos","biceps"],["barbell","rack"],"pull",!1,{sets:3,repsMin:6,repsMax:15,restSec:75},["Barre pos\xE9e sur les supports \xE0 hauteur de hanche, allong\xE9 dessous.","Corps droit, tire la poitrine vers la barre.","Redescends contr\xF4l\xE9 bras tendus."],"V\xE9rifie que la barre est bien cal\xE9e sur les supports avant de t'y suspendre."],["tractions_scapulaires","Tractions scapulaires",["dos"],["bodyweight","pullup_bar"],"pull",!1,{sets:3,repsMin:8,repsMax:12,restSec:60},["Suspendu bras tendus.","Sans plier les coudes, abaisse et rapproche les omoplates pour monter de quelques centim\xE8tres.","Rel\xE2che lentement."],"Excellent point de d\xE9part avant les tractions compl\xE8tes, et bon \xE9chauffement des \xE9paules."],["corde_a_sauter","Corde \xE0 sauter",["cardio","mollets"],["jump_rope"],"core",!1,{sets:3,repsMin:30,repsMax:60,restSec:45},["Coudes pr\xE8s du corps, la rotation vient des poignets.","Petits sauts sur l'avant des pieds.","Garde un rythme r\xE9gulier pendant la dur\xE9e (en secondes)."],"Sur un sol souple de pr\xE9f\xE9rence ; r\xE9duis la dur\xE9e si les mollets ou les tibias sont sensibles."],["dips_chaise","Dips sur chaise (pompes invers\xE9es)",["triceps","epaules","pect"],["bodyweight"],"push",!1,{sets:3,repsMin:8,repsMax:15,restSec:60},["Mains sur le rebord d'une chaise stable (ou d'un canap\xE9, d'une marche), doigts vers l'avant, jambes devant toi.","Descends en pliant les coudes vers l'arri\xE8re jusqu'\xE0 ~90\xB0, dos proche du rebord.","Remonte en poussant sur les paumes jusqu'\xE0 tendre les bras, sans verrouiller brutalement."],"Chaise cal\xE9e contre un mur. Ne descends pas plus bas que 90\xB0 au coude si l'avant de l'\xE9paule tire ; genoux pli\xE9s = plus facile, jambes tendues = plus dur."],["extension_triceps_sol","Extension triceps au sol (sphinx)",["triceps"],["bodyweight"],"push",!1,{sets:3,repsMin:8,repsMax:12,restSec:60},["En appui sur les avant-bras, comme en planche, mains sous les \xE9paules.","Pousse dans les paumes pour d\xE9coller les coudes du sol jusqu'\xE0 tendre les bras.","Redescends lentement sur les avant-bras en gardant le corps gain\xE9."],"Commence sur les genoux si le mouvement est trop dur ; garde les coudes serr\xE9s et le bassin align\xE9."],["pompes_hindoues","Pompes hindoues",["pect","epaules","triceps"],["bodyweight"],"push",!1,{sets:3,repsMin:6,repsMax:12,restSec:75},["D\xE9part en V invers\xE9, bassin haut, bras tendus.","Plonge vers l'avant en fr\xF4lant le sol avec la poitrine, comme pour passer sous une barri\xE8re.","Termine buste relev\xE9, bras tendus, bassin bas, puis reviens en V invers\xE9."],"Mouvement fluide et contr\xF4l\xE9 ; en cas de g\xEAne dans le bas du dos, limite l'extension en fin de mouvement."],["rowing_table","Rowing invers\xE9 sous une table",["dos","biceps"],["bodyweight"],"pull",!1,{sets:3,repsMin:6,repsMax:12,restSec:75},["Allong\xE9 sous une table solide, mains au bord, bras tendus.","Corps gain\xE9, tire la poitrine vers le bord en serrant les omoplates.","Redescends lentement jusqu'\xE0 bras tendus."],"V\xE9rifie que la table ne bascule pas (lourde, pieds stables) avant la premi\xE8re r\xE9p\xE9tition. Genoux pli\xE9s = plus facile."],["montees_chaise","Mont\xE9es sur chaise (step-up)",["quadriceps","fessiers"],["bodyweight"],"lunge",!0,{sets:3,repsMin:8,repsMax:12,restSec:60},["Pied entier sur une chaise stable ou une marche.","Monte en poussant sur le talon de la jambe du dessus, sans t'\xE9lancer avec l'autre.","Redescends contr\xF4l\xE9, puis encha\xEEne du m\xEAme c\xF4t\xE9 avant de changer."],"Chaise cal\xE9e contre un mur, jamais sur roulettes. Une marche d'escalier est plus s\xFBre pour commencer."],["nordic_curl","Nordic curl assist\xE9",["ischios","fessiers"],["bodyweight"],"hinge",!1,{sets:3,repsMin:4,repsMax:8,restSec:90},["\xC0 genoux sur un coussin, chevilles bloqu\xE9es sous un canap\xE9 ou tenues.","Corps droit des genoux \xE0 la t\xEAte, bascule lentement vers l'avant en freinant avec les ischios.","Amortis avec les mains au sol, puis repousse pour revenir."],"Exercice exigeant : descends seulement jusqu'o\xF9 tu contr\xF4les, et augmente l'amplitude progressivement."],["etir_ischios","\xC9tirement des ischio-jambiers",["ischios","mollets"],["bodyweight"],"stretch",!1,{sets:1,repsMin:30,repsMax:45,restSec:10},["Debout, pieds \xE0 largeur de hanches, genoux souples.","Bascule le buste vers l'avant dos long, mains qui glissent vers les tibias.","Rel\xE2che la nuque et respire lentement pendant le maintien (dur\xE9e en secondes)."],"Tu dois sentir un \xE9tirement sous la cuisse, jamais une douleur dans le bas du dos : plie les genoux au besoin."],["etir_quadriceps","\xC9tirement des quadriceps (debout)",["quadriceps"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Debout, une main contre un mur pour l'\xE9quilibre.","Attrape la cheville et rapproche le talon des fessiers, genoux c\xF4te \xE0 c\xF4te.","Bassin l\xE9g\xE8rement rentr\xE9, maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Ne tire pas sur le genou : s'il g\xEAne, attrape plut\xF4t le bas du pantalon ou utilise une serviette."],["etir_fessiers","\xC9tirement des fessiers (en 4)",["fessiers"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Allong\xE9 sur le dos, pose une cheville sur le genou oppos\xE9.","Attrape l'arri\xE8re de la cuisse d'appui et ram\xE8ne les jambes vers toi.","Garde la t\xEAte et les \xE9paules au sol, puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"\xC0 \xE9viter en cas de douleur de hanche ou de genou : r\xE9duis l'amplitude plut\xF4t que de forcer."],["etir_mollets","\xC9tirement des mollets (au mur)",["mollets"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Face \xE0 un mur, mains en appui, un pied recul\xE9.","Talon arri\xE8re au sol, jambe arri\xE8re tendue, avance le bassin vers le mur.","Maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Le talon arri\xE8re reste au sol et le pied pointe vers le mur ; tu ne dois ressentir aucune douleur au tendon d'Achille."],["etir_pectoraux","\xC9tirement des pectoraux (encadrement de porte)",["pect","epaules"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Avant-bras contre le montant d'une porte, coude \xE0 hauteur d'\xE9paule.","Avance doucement le buste jusqu'\xE0 sentir l'\xE9tirement devant l'\xE9paule.","Garde les \xE9paules basses, puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Amplitude mod\xE9r\xE9e si l'\xE9paule est sensible ; arr\xEAte \xE0 la moindre sensation de pincement."],["etir_enfant","Posture de l'enfant (dos)",["dos"],["bodyweight"],"stretch",!1,{sets:1,repsMin:30,repsMax:60,restSec:10},["\xC0 genoux, fessiers vers les talons.","Allonge les bras loin devant, front vers le sol.","Respire dans le dos et rel\xE2che les \xE9paules (dur\xE9e en secondes)."],"Glisse un coussin entre fessiers et talons si les genoux tirent."],["etir_epaules","\xC9tirement des \xE9paules (bras crois\xE9)",["epaules"],["bodyweight"],"stretch",!0,{sets:2,rep
