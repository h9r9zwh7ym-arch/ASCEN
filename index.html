function loadKind(def){ if(NO_LOAD.has(def.id)) return null; const t = typeof loadableTypeOf==="function" ? loadableTypeOf(def) : null; return t==="dumbbells" || t==="barbell" || t==="kettlebell" || t==="bands" ? t : null; }
// main (W, W2) ou milieu des deux mains (M)
const handAt = (f, k)=> k==="M" ? [(f.W[0]+f.W2[0])/2, (f.W[1]+f.W2[1])/2] : f[k];
const loadHands = (def, two)=> ONE_LOAD.has(def.id) ? ["M"] : two ? ["W","W2"] : ["W"];
const DB_SHAPE = "M-1.45 -1.25V1.25M1.45 -1.25V1.25M-1.45 0H1.45", KB_SHAPE = "M-.95 .85C-.95 -.75 .95 -.75 .95 .85";
// angle de l'haltère : perpendiculaire à l'avant-bras (prise marteau : dans son axe)
function dbAngle(f, w, e, grip){ if(w==="M"){ w = "W"; e = "E"; } const a = Math.atan2(f[w][1]-f[e][1], f[w][0]-f[e][0])/RAD; return grip==="v" ? a : a+90; }
function bandAnchor(def, f, A, k){
  const m = BAND_ANCHOR[def.id] || "feet";
  if(m==="none") return null;
  if(m==="hands") return k==="W" ? f.W2 : null;
  if(m==="top") return [A[k][0], .8];
  if(m==="front"){ const d = [A[k][0]-A.N[0], A[k][1]-A.N[1]], l = Math.hypot(d[0], d[1]) || 1; return [Math.max(1, Math.min(23, A[k][0]+d[0]/l*3)), Math.max(1, Math.min(22, A[k][1]+d[1]/l*3))]; }
  return k==="W" ? f.F : f.F2;
}
// barre vue de face (mains écartées) : la barre dépasse des mains, un disque à chaque bout
function barPath(f){
  const dx = f.W2[0]-f.W[0], dy = f.W2[1]-f.W[1], l = Math.hypot(dx, dy) || 1, ux = dx/l, uy = dy/l, r = v=>v.toFixed(2);
  const a = [f.W[0]-ux*2.6, f.W[1]-uy*2.6], b = [f.W2[0]+ux*2.6, f.W2[1]+uy*2.6], pl = (p, k)=>{ const c = [p[0]+ux*k, p[1]+uy*k]; return `M${r(c[0]-uy*1.7)} ${r(c[1]+ux*1.7)}L${r(c[0]+uy*1.7)} ${r(c[1]-ux*1.7)}`; };
  return `M${r(a[0])} ${r(a[1])}L${r(b[0])} ${r(b[1])}${pl(a, .5)}${pl(b, -.5)}`;
}
// pose figée (pictogramme) : traits à la couleur du texte, détourés de la couleur de la tuile (--rc)
// pour rester lisibles quand la charge passe devant le corps (kettlebell le long des jambes…)
function loadStatic(def, rig, f, two, sw){
  const kind = loadKind(def), out = { back:"", front:"" }; if(!kind) return out;
  const r = v=>v.toFixed(2), hands = loadHands(def, two);
  if(kind==="bands"){ out.back = hands.map(k=>{ const a = bandAnchor(def, f, rig.A, k); return a ? `<path d="M${r(f[k][0])} ${r(f[k][1])}L${r(a[0])} ${r(a[1])}" stroke="currentColor" stroke-width="${sw*.42}" stroke-linecap="round" opacity=".7"/>` : ""; }).join(""); return out; }
  if(kind==="barbell"){
    if(two && !ONE_LOAD.has(def.id)){ const d = barPath(f); out.front = `<path class="pk" d="${d}" stroke-width="${sw*.9+1.4}"/><path d="${d}" stroke="currentColor" stroke-width="${sw*.6}" stroke-linecap="round"/>`; }
    else {
      // barre sur le dos (squat) : le disque se décale vers l'arrière pour ne pas disparaître sous la tête
      const dh = Math.hypot(f.W[0]-f.H[0], f.W[1]-f.H[1]), k = dh<3.6 ? (3.6-dh)/(dh||1) : 0, c = [f.W[0]+(f.W[0]-f.H[0])*k, f.W[1]+(f.W[1]-f.H[1])*k];
      out.back = `<circle cx="${r(c[0])}" cy="${r(c[1])}" r="2.1" fill="none" stroke="currentColor" stroke-width="${sw*.5}"/><circle cx="${r(c[0])}" cy="${r(c[1])}" r=".6" fill="currentColor"/>`;
    }
    return out;
  }
  out.front = hands.map(k=>{ const e = k==="W2" ? "E2" : "E", p = handAt(f, k), x = r(p[0]), y = r(p[1]);
    if(kind==="kettlebell") return `<g transform="translate(${x} ${y})"><circle class="pkf" cy="1.9" r="2.15"/><path d="${KB_SHAPE}" fill="none" stroke="currentColor" stroke-width="${sw*.4}"/><circle cy="1.9" r="1.4" fill="currentColor"/></g>`;
    const t = `translate(${x} ${y}) rotate(${dbAngle(f, k, e, rig.grip).toFixed(1)})`;
    return `<path class="pk" transform="${t}" d="${DB_SHAPE}" stroke-width="${sw*.58+1.4}"/><path transform="${t}" d="${DB_SHAPE}" stroke="currentColor" stroke-width="${sw*.58}" stroke-linecap="round"/>`;
  }).join("");
  return out;
}
const PICTO_CACHE = new Map();
function exoPicto(def){
  if(!def) return pictoSVG("squat");
  if(PICTO_CACHE.has(def.id)) return PICTO_CACHE.get(def.id);
  let svg;
  try{
    if(typeof RIGS==="undefined" || !RIGS[def.id]) throw 0;
    const rig = animRig(def), rd = RIGS[def.id], f = rd.icon==="A" ? rig.A : rd.icon==="mid" ? rig.frames[rig.frames.length>>1] : rig.B;
    const ld = loadStatic(def, rig, f, Math.hypot(f.W[0]-f.W2[0], f.W[1]-f.W2[1])>.6, 2.3);
    svg = `<svg class="picto" viewBox="0 0 24 24" aria-hidden="true"><path d="${rig.env||FLOOR}" fill="none" stroke="currentColor" stroke-width="1.3" stroke-linecap="round" opacity=".38"/>${ld.back}<path d="${animPath(f)}" fill="none" stroke="currentColor" stroke-width="2.3" stroke-linecap="round" stroke-linejoin="round"/><circle cx="${f.H[0].toFixed(2)}" cy="${f.H[1].toFixed(2)}" r="2.3" fill="currentColor"/>${ld.front}</svg>`;
  }catch(e){ svg = pictoSVG(pictoKey(def)); }
  PICTO_CACHE.set(def.id, svg);
  return svg;
}
function pictoSVG(key){
  const p = PICTO_PATHS[key] || PICTO_PATHS.squat;
  return `<svg class="picto" viewBox="0 0 24 24" aria-hidden="true"><circle cx="${p.h[0]}" cy="${p.h[1]}" r="2.1" fill="currentColor"/><path d="${p.d}" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"/></svg>`;
}

};
const REGION_OF_MUSCLE = {};
Object.keys(REGIONS).forEach(r=>REGIONS[r].muscles.forEach(m=>REGION_OF_MUSCLE[m]=r));
function regionOf(def){ return def._region || (def._region = REGION_OF_MUSCLE[def.muscles[0]] || "core"); }

// tuile d'exercice : pictogramme sur fond de la couleur de zone
function exoIcon(def, size){
  const k = size||""; def._ico = def._ico || {};
  return def._ico[k] || (def._ico[k] = `<span class="xico r-${regionOf(def)} ${k}" title="${esc(REGIONS[regionOf(def)].n)}">${exoPicto(def)}</span>`);
}

// Les poses A et B décrivent des positions d'articulations ; les animer en faisant glisser ces
// positions en ligne droite étirait ou raccourcissait les membres (103 exercices sur 155 avaient
// un bras, une cuisse ou le tronc qui changeait de longueur). Désormais chaque pose est lue comme
// des ANGLES d'os, le corps est reconstruit avec des longueurs fixes (cinématique directe), et
// l'animation fait tourner les articulations. Les points d'appui (pieds au sol, mains sur la
// barre ou au sol, bassin sur le banc) restent en place : le membre en appui est résolu en
// cinématique inverse (deux segments), du côté où il était plié dans le dessin d'origine.

  LIMBS.forEach(([r,m,e])=>{ const u = bAng(jp(P,r), jp(P,m), r==="N" ? t+Math.PI : Math.PI/2); o[m] = u; o[e] = bAng(jp(P,m), jp(P,e), u); });

// ---------- stockage compact (v2.5) ----------
// L'historique représente l'essentiel des données. Il est enregistré sous une forme
// condensée (tableaux, dates en millisecondes) : environ trois fois moins de place,
// soit plusieurs décennies d'entraînement dans les ~5 Mo de localStorage. En mémoire et
// dans les sauvegardes .json, les séances gardent leur forme lisible.
function packSession(s){
  const o = { i:s.id, d:s.date };
  if(s.source) o.o = SRC_CODE[s.source] || s.source;
  if(s.type) o.t = s.type; if(s.resolvedType && s.resolvedType!==s.type) o.r = s.resolvedType;
  if(s.name) o.n = s.name; if(s.tplId) o.p = s.tplId; if(s.planned) o.l = 1; if(s.note) o.m = s.note;
  const a = s.startedAt ? Date.parse(s.startedAt) : NaN; if(!isNaN(a)) o.a = a;
  const c = s.completedAt ? Date.parse(s.completedAt) : NaN; if(!isNaN(c)) o.c = c;
  if(s.durationSec) o.u = s.durationSec;
  o.x = (s.exos||[]).map(ex=>{
    const sets = ex.sets.filter(st=>st.done).map(st=>{
      const f = (st.pr?1:0) | ((st.effort||0)<<1);
      return f ? [st.reps||0, st.weight==null?null:st.weight, f] : st.weight!=null ? [st.reps||0, st.weight] : [st.reps||0];
    });
    return ex.targetReps ? [ex.exoId, sets, ex.targetReps] : [ex.exoId, sets];
  });
  if(s.stretches && s.stretches.length) o.s = s.stretches.map(x=>[x.exoId, x.sec||0]);

function unpackSession(o){
  const s = { id:o.i, date:o.d };
  if(o.o) s.source = SRC_NAME[o.o] || o.o;
  if(o.t) s.type = o.t; if(o.r || o.t) s.resolvedType = o.r || o.t;
  if(o.n) s.name = o.n; if(o.p) s.tplId = o.p; if(o.l) s.planned = true; if(o.m) s.note = o.m;
  if(o.a) s.startedAt = new Date(o.a).toISOString(); if(o.c) s.completedAt = new Date(o.c).toISOString();
  if(o.u) s.durationSec = o.u;
  s.exos = (o.x||[]).map(([exoId, sets, targetReps])=>{
    const ex = { exoId, sets: sets.map(([reps, weight, f])=>{ const st = { reps:+reps||0, done:true }; if(weight!=null && isFinite(weight)) st.weight = +weight; if(f&1) st.pr = true; if(f>>1) st.effort = f>>1; return st; }) };
    if(targetReps) ex.targetReps = targetReps;

// Chaque enregistrement est aussi copié dans IndexedDB (quota bien plus large). Si

const IDB_NAME = "forge", IDB_STORE = "state";
function idbOpen(){

    const r = indexedDB.open(IDB_NAME, 1);

    if(persistBlocked){ db.close(); return ok(); }
    const tx = db.transaction(IDB_STORE, "readwrite");
    tx.objectStore(IDB_STORE).put({ data, savedAt }, "main");
    tx.oncomplete = ()=>{ db.close(); ok(); }; tx.onerror = ()=>{ db.close(); ko(tx.error); };

function cleanupStorage(){

// fusion avec l'état par défaut (nouveaux champs entre versions, restauration d'une sauvegarde)

    const merged = Object.assign({}, d, parsed);
    merged.equipment = Object.assign({}, d.equipment, parsed.equipment||{});
    merged.equipment.owned = Object.assign({}, d.equipment.owned, (parsed.equipment||{}).owned||{});
    merged.equipment.weights = Object.assign({}, d.equipment.weights, (parsed.equipment||{}).weights||{});
    merged.prefs = Object.assign({}, d.prefs, parsed.prefs||{});
    merged.goals = Object.assign({}, d.goals, parsed.goals||{});
    merged.settings = Object.assign({}, d.settings, parsed.settings||{});
    merged.meta = Object.assign({}, d.meta, parsed.meta||{});
    merged.custom = Object.assign({}, d.custom, parsed.custom||{});

    // format compact : chaque séance est décodée à part ; une entrée abîmée est écartée (et comptée)
    // au lieu de faire échouer tout le chargement, ce qui démarrait l'app sur un historique vide

    }

    // doit jamais empêcher l'app de démarrer. Les entrées illisibles sont écartées ; l'historique
    // garde ses exercices même inconnus (renommés depuis), il n'est jamais supprimé.
    const okSet = st=>st && typeof st==="object";
    const okExo = ex=>ex && typeof ex==="object" && typeof ex.exoId==="string" && Array.isArray(ex.sets);
    const okSession = ss=>ss && typeof ss.date==="string" && /^\d{4}-\d{2}-\d{2}/.test(ss.date) && Array.isArray(ss.exos);
    const before = Array.isArray(parsed.sessions) ? parsed.sessions.length : 0;
    if(fromZs){
      // notre propre format, déjà compact : pas de recopie (le démarrage lit tout l'historique)

      parsed.sessions.forEach(ss=>{ if(ss.exos.some(ex=>!okExo(ex) || !ex.sets.length)) ss.exos = ss.exos.filter(ex=>okExo(ex) && ex.sets.length); });
    } else {

    }

      .map(t=>Object.assign({}, t, { n:String(t.n||"Séance"), days:Array.isArray(t.days)?t.days.filter(x=>x>=0 && x<=6):[], exos:plan(t.exos) }));

    merged.challenges = (Array.isArray(parsed.challenges)?parsed.challenges:[]).filter(c=>c && typeof c.id==="string" && /^\d{4}-\d{2}-\d{2}$/.test(c.start));

    merged.goals.exoCount = Math.min(12, Math.max(0, Math.round(merged.goals.exoCount)||0));
    merged.settings.name = String(merged.settings.name||"").slice(0,40);
    merged.settings.why = String(merged.settings.why||"").slice(0,120);
    merged.templates.forEach(t=>{ if(!safeId(t.id)) t.id = uid(); });
    merged.targets.forEach(t=>{ if(!safeId(t.id)) t.id = uid(); });
    merged.challenges = merged.challenges.filter(c=>safeId(c.id));
    merged.equipment.custom = (Array.isArray(merged.equipment.custom)?merged.equipment.custom:[]).filter(c=>c && typeof c==="object")
      .map(c=>Object.assign({}, c, { id:safeId(c.id) ? c.id : uid(), n:String(c.n||"Équipement").slice(0,60) }));
    if(merged.custom.tplId!=null && !safeId(merged.custom.tplId)) delete merged.custom.tplId;
    if(merged.draft){ if(!safeId(merged.draft.id)) merged.draft.id = uid(); if(merged.draft.tplId!=null && !safeId(merged.draft.tplId)) delete merged.draft.tplId; }
    delete merged.settings.todayMode; // v1.2 : remplacé par todayTab (« Ma séance » en premier)
    // v2.2 : nouveaux équipements. On garde le comportement précédent : un banc servait aussi
    // aux exercices inclinés, et quiconque faisait du squat à la barre avait des supports.
    const po = (parsed.equipment||{}).owned||{};
    if(po.bench && po.bench_incline===undefined) merged.equipment.owned.bench_incline = true;
    if(po.barbell && po.rack===undefined) merged.equipment.owned.rack = true;
    // élastiques : des niveaux de résistance 1 à 5 (et plus des « kilos »)
    // anciennes valeurs en kg (> 5) : converties par rang, du plus léger au plus fort
    let bw = (merged.equipment.weights.bands||[]).map(Number).filter(v=>v>0);

}

// ---------- sauvegarde différée + cache des statistiques ----------
// save() est appelé à chaque interaction (un appui sur +/− par exemple). Réécrire tout
// l'historique (plusieurs centaines de Ko après quelques années) à chaque fois coûtait
// ~70 ms sur téléphone : on invalide le cache tout de suite et on écrit au calme,
// avec écriture forcée quand l'app passe en arrière-plan ou se ferme.
let DATA_VER = 0;
const MEMO = new Map();
function memo(key, fn){
  const hit = MEMO.get(key);
  if(hit && hit.v===DATA_VER) return hit.r;
  const r = fn();
  MEMO.set(key, { v:DATA_VER, r });
  return r;
}
let persistTimer = null, persistBlocked = false, persistFailed = false;
// Une séance terminée n'a plus besoin des champs de travail (notes, cibles de séries,
// ressenti vide, séries non faites) : on les retire pour garder le stockage léger.
function compactSession(s){
  const out = {};
  ["id","date","source","type","resolvedType","name","tplId","planned","startedAt","completedAt","durationSec","note"].forEach(k=>{ if(s[k]!=null && s[k]!==false) out[k] = s[k]; });
  out.exos = (s.exos||[]).map(ex=>({
    exoId: ex.exoId,
    targetReps: ex.targetReps,
    sets: ex.sets.filter(st=>st.done).map(st=>{
      // nombres garantis (sauvegarde restaurée, import) : un texte ferait des totaux faux
      const o = { reps: Math.max(0, +st.reps||0), done: true };
      if(st.weight!=null && st.weight!=="" && isFinite(st.weight)) o.weight = +st.weight;
      if(st.pr) o.pr = true;
      if(st.effort) o.effort = st.effort; // ressenti (répétitions en réserve) pour la progression
      return o;
    })
  })).filter(ex=>ex.sets.length);
  if(Array.isArray(s.stretches) && s.stretches.length) out.stretches = s.stretches.filter(x=>x && x.exoId).map(x=>({ exoId:x.exoId, sec:Math.max(0, Math.round(x.sec||0)) }));
  return out;
}
function save(){
  DATA_VER++;
  if(typeof prerenderStaleViews==="function") prerenderStaleViews();
  if(persistBlocked) return;
  clearTimeout(persistTimer);
  persistTimer = setTimeout(persistNow, 400);
}
function persistNow(urgent){
  clearTimeout(persistTimer); persistTimer = null;
  if(persistBlocked) return;
  const savedAt = Date.now(), str = serializeState(savedAt);
  S.meta.savedAt = savedAt;
  idbMirror(str, savedAt, urgent===true);
  try{ localStorage.setItem(STORAGE_KEY, str); persistFailed = false; }
  catch(e){
    // localStorage plein ou refusé : la copie IndexedDB prend le relais, on prévient une fois
    if(!persistFailed && typeof toast==="function") toast("Stockage principal plein : tes données sont gardées dans la copie de secours. Pense à faire une sauvegarde.");
    persistFailed = true;
  }
}
// sortie de l'app : écriture immédiate, copie de secours comprise
function flushPersist(){ if(persistTimer) persistNow(true); else if(idbPending) idbMirror(idbPending.str, idbPending.savedAt, true); }
window.addEventListener("pagehide", flushPersist);
// l'app ouverte dans un autre onglet a enregistré : on reprend sa version (la plus récente) au
// lieu de l'écraser à la prochaine sauvegarde. Si nos propres changements partent à l'instant,
// on ne fait rien : la dernière écriture gagne, comme avant.
window.addEventListener("storage", e=>{
  if(e.key!==STORAGE_KEY || persistBlocked) return;
  // données effacées ailleurs : plus d'écriture ici, rechargement une fois la copie de secours effacée aussi
  if(e.newValue==null){ persistBlocked = true; setTimeout(()=>location.reload(), 900); return; }
  if(persistTimer) return;
  let st; try{ st = normalizeState(JSON.parse(e.newValue)); }catch(err){ return; }
  if(S.meta.savedAt && !(st.meta.savedAt > S.meta.savedAt)) return;
  S = st; DATA_VER++;
  if(typeof onExternalState==="function") onExternalState();
});
document.addEventListener("visibilitychange", ()=>{ if(document.visibilityState==="hidden") flushPersist(); });

// ---------- utilitaires ----------
function uid(){ return Date.now().toString(36)+Math.random().toString(36).slice(2,8); }
function clone(x){ return JSON.parse(JSON.stringify(x)); }
function round1(x){ return Math.round(x*10)/10; }

// Dates au format AAAA-MM-JJ en heure LOCALE : toISOString() convertit en UTC et
// décale d'un jour les minuits locaux en Suisse (UTC+1/+2).
function localISO(d){
  return `${d.getFullYear()}-${String(d.getMonth()+1).padStart(2,"0")}-${String(d.getDate()).padStart(2,"0")}`;
}
function todayISO(){ return localISO(new Date()); }
// appelées des milliers de fois par les statistiques : pas de tableau intermédiaire
function parseISO(s){
  if(s.length===10) return new Date(+s.slice(0,4), +s.slice(5,7)-1, +s.slice(8,10));

  return w>ref.weight ? (r>=ref.reps ? 1 : 0) : (byReps>0 ? 0 : -1);
}

// ---------- résumé d'une séance (v3.3) ----------
// Les statistiques et les trophées parcouraient chaque série de tout l'historique, une fois par
// indicateur (une quarantaine). Une séance enregistrée ne change plus : on la résume une fois
// (séries, répétitions, tonnage, records, jambes, gainage, charge max, 1RM estimés…) et le
// résumé est gardé tant que l'objet n'est pas modifié (sessionTouched). Les séances « vivantes »
// (séance en cours, édition) ne sont pas marquées et sont toujours recalculées.
let SUM_CACHE = new WeakMap();
const BW_ONLY = new Set(["bodyweight","bench","mat","pullup_bar"]);
function sessionSummary(s){
  const stored = !!s[STORED];
  let r = stored ? SUM_CACHE.get(s) : undefined;
  if(r) return r;
  r = { sets:0, reps:0, vol:0, prs:0, legSets:0, holdSec:0, bwReps:0, maxKg:0, exos:[], e1:[] };
  for(const ex of s.exos){
    const d = EXO_MAP[ex.exoId];
    let n = 0, reps = 0, vol = 0, prs = 0, mx = 0, e1 = 0;
    for(const st of ex.sets){
      if(!st.done) continue;
      n++; const rp = st.reps||0, w = st.weight||0;
      reps += rp; vol += rp*w; if(st.pr) prs++;
      if(st.weight>mx) mx = st.weight;
      if(w){ const v = estimated1RM(w, st.reps); if(v>e1) e1 = v; }
    }
    r.sets += n; r.prs += prs;
    if(!d || loadableTypeOf(d)!=="bands") r.vol += vol;     // tonnage en kg : sans les élastiques
    const timed = d && isTimed(d);
    if(!timed) r.reps += reps;                             // les exercices tenus comptent des secondes
    if(!n || !d) { if(n) r.exos.push(ex.exoId); continue; }
    r.exos.push(ex.exoId);
    if(timed) r.holdSec += reps;
    else if(d.equip.every(q=>BW_ONLY.has(q))) r.bwReps += reps;
    if(regionOf(d)==="legs") r.legSets += n;
    if(kgType(d)){ if(mx>r.maxKg) r.maxKg = mx; if(e1) r.e1.push([ex.exoId, e1]); }
  }
  if(stored) SUM_CACHE.set(s, r);
  return r;
}

function estimated1RM(weight,reps){

  return weight*(1+reps/30); // formule d'Epley
}
function exoPRs(exoId){ return memo("pr:"+exoId, ()=>exoPRs_raw(exoId)); }
function exoPRs_raw(exoId){

  S.sessions.forEach(s=>{
    const ex = s.exos.find(x=>x.exoId===exoId);

// Records recalculés après la modification d'une séance passée : même règle qu'en direct

function recomputePRFlags(){
  const best = {}; let before = 0, after = 0;
  S.sessions.forEach(s=>{
    const cur = {};
    s.exos.forEach(ex=>{
      const b = best[ex.exoId], c = cur[ex.exoId] || (cur[ex.exoId] = { w:b?b.w:0, r:b?b.r:0 });
      ex.sets.forEach(st=>{
        if(!st.done) return;
        if(st.pr) before++;
        const w = st.weight||0, r = st.reps||0, e = estimated1RM(w,r);
        const was = !!st.pr;
        if(b && (w||r) && (w>c.w || e>c.r+0.01)){ st.pr = true; after++; } else delete st.pr;
        if(was!==!!st.pr) sessionTouched(s);
        c.w = Math.max(c.w,w); c.r = Math.max(c.r,e);
      });
    });
    Object.keys(cur).forEach(id=>{ best[id] = cur[id]; });
  });

// ---------- régularité ----------
// Semaines consécutives avec au moins une séance. La semaine en cours pas encore entamée ne
// casse pas la série. Joker : une semaine sans séance est pardonnée si aucun autre joker n'a
// servi dans les 4 semaines précédentes (≈ une par mois : vacances, maladie). Deux semaines
// vides d'affilée cassent la série. Une semaine « joker » ne compte pas dans la longueur.
const JOKER_GAP = 4;
function streakInfo(){ return memo("streakInfo:"+todayISO(), streakInfo_raw); }
function streakInfo_raw(){
  const weeks = new Set(S.sessions.map(s=>weekKey(s.date)));
  const thisWeek = weekKey(todayISO());
  let cursor = weeks.has(thisWeek) ? thisWeek : addDaysISO(thisWeek,-7);
  // à rebours : jokers espacés d'au moins JOKER_GAP semaines
  let n = 0, jokers = [], lastJokerIdx = -Infinity, i = 0;
  for(;;){
    if(weeks.has(cursor)) n++;
    else if(weeks.has(addDaysISO(cursor,-7)) && i-lastJokerIdx>=JOKER_GAP){
      jokers.push(cursor); lastJokerIdx = i;
    } else break;
    cursor = addDaysISO(cursor,-7); i++;
  }
  if(!n) jokers = [];
  // joker récent (dans les 4 dernières semaines) : affiché, et pas de nouveau joker avant qu'il expire
  const recent = jokers.find(w=>daysBetween(w, thisWeek)<JOKER_GAP*7) || null;
  return { n, jokers, recent, nextJokerIn: recent ? JOKER_GAP - Math.round(daysBetween(recent, thisWeek)/7) : 0 };
}
function currentStreakWeeks(){ return streakInfo().n; }
function maxStreakWeeksEver(){ return memo("maxStreakWeeksEver", maxStreakWeeksEver_raw); }
function maxStreakWeeksEver_raw(){
  const weeks = Array.from(new Set(S.sessions.map(s=>weekKey(s.date)))).sort();
  if(!weeks.length) return 0;
  const has = new Set(weeks);
  let best = 0, cur = 0, lastJoker = -Infinity, i = 0;
  for(let w = weeks[0]; w<=weeks[weeks.length-1]; w = addDaysISO(w,7), i++){
    if(has.has(w)){ cur++; best = Math.max(best, cur); }
    else if(cur>0 && has.has(addDaysISO(w,7)) && i-lastJoker>=JOKER_GAP) lastJoker = i;
    else { cur = 0; lastJoker = -Infinity; }
  }
  return Math.max(best, currentStreakWeeks());
}

    const iso = addDaysISO(monday, i), t = S.templates.find(x=>(x.days||[]).includes(i));
    if(!t || (t.since && iso<t.since)) continue;

// (il reste libre de le choisir lui-même dans la liste)
function levelOK(e){ return S.goals.level!=="debutant" || e.level<3; }
// exercices de force proposés par l'app (les étirements ont leur propre bloc, voir stretchBlock)
function engineExos(){ const all = availableExos().filter(e=>!isStretch(e)), ok = all.filter(levelOK); return ok.length>=4 ? ok : all; }

function normName(s){
  return (s||"").toLowerCase().normalize("NFD").replace(/[̀-ͯ]/g,"").replace(/[^a-z0-9]+/g," ").trim();
}

// ---------- stimulus de la semaine (4.0) ----------
// Les propositions visent aussi les muscles sous le seuil de progrès : moins de 4 séries pondérées
// sur 7 jours (Progrès > Muscles, repères de Pelland et al.). Manque à combler de 0 (seuil atteint)
// à 1 (rien cette semaine) ; au-delà de 10 séries, un léger malus (le muscle a déjà beaucoup donné).
function stimDeficit(muscleId){
  try{
    if(!S.sessions.length) return 0;
    const r = muscleVolume(7).find(x=>x.id===muscleId); if(!r) return 0;
    return r.sets>=STIM.high ? -.5 : Math.max(0, STIM.min-r.sets)/STIM.min;
  }catch(e){ return 0; }
}
// muscles sous le seuil que la séance fait travailler en principal (pour l'expliquer)
function stimTargets(exos){
  try{
    const vol = muscleVolume(7), low = new Map(vol.filter(r=>r.sets<STIM.min).map(r=>[r.id, r]));
    // rien fait depuis 7 jours : tout est sous le seuil, le dire n'apprend rien
    if(!S.sessions.length || low.size===vol.length) return [];
    const out = []; exos.forEach(e=>{ const r = low.get(e.muscles[0]); if(r && !out.includes(r)) out.push(r); });
    return out.map(r=>({ id:r.id, n:r.n, sets:r.sets }));
  }catch(e){ return []; }
}
function stimTargetsText(t){
  return t.length ? `Priorité à ${t.slice(0,3).map(r=>`${r.n.toLowerCase()} (${fmtDec(r.sets)}/${STIM.min} séries)`).join(", ")}, en retard cette semaine.` : "";
}
// score d'un groupe musculaire : plus il a été délaissé récemment, plus il est prioritaire ;
// un muscle sous le seuil de la semaine gagne jusqu'à 4 points, sauf s'il récupère encore
function muscleScore(muscleId){
  const days = daysSinceTrained(muscleId);
  const emph = S.goals.emphasis[muscleId] || "normal";
  let w = emph==="prioriser" ? 1.6 : emph==="eviter" ? 0.25 : 1;
  let score = (Math.min(days,10) + 4*stimDeficit(muscleId)) * w;
  if(days<2) score *= 0.2; // récupération : fortement déprioritisé si travaillé hier ou aujourd'hui
  return score;
}

function recencyPenalty(exoId){
  // pénalise un exercice utilisé dans les 2 dernières séances, pour varier
  let penalty = 0;
  for(let i=S.sessions.length-1, n=0; i>=0 && n<2; i--, n++){
    if(S.sessions[i].exos.some(e=>e.exoId===exoId)) penalty += 2.5;
  }
  return penalty;
}

function scoreExo(exo){
  const primary = exo.muscles[0];
  let score = muscleScore(primary);
  exo.muscles.slice(1).forEach(m=>score += muscleScore(m)*0.3);
  if(isIncluded(exo.id)) score += 3;
  // niveau : les débutants privilégient les exercices accessibles, les avancés les plus exigeants
  const lv = S.goals.level;
  if(lv==="debutant") score += exo.level===1 ? 1.5 : 0;
  else if(lv==="intermediaire" && exo.level===1) score -= 0.7;   // versions allégées (pompes genoux…) : plutôt pour débuter
  else if(lv==="avance") score += exo.level===3 ? 1 : exo.level===1 ? -1 : 0;
  score -= recencyPenalty(exo.id);
  return score;
}

function repRangeForGoal(exo){
  const goal = S.goals.overall;
  const mid = Math.round((exo.repsMin+exo.repsMax)/2);
  if(goal==="force") return [exo.repsMin, mid];
  if(goal==="endurance") return [mid, exo.repsMax+4];
  return [exo.repsMin, exo.repsMax];
}

function loadableTypeOf(exo){
  if(exo._load!==undefined) return exo._load;
  return (exo._load = exo.equip.find(id=>EQUIP_MAP[id] && EQUIP_MAP[id].loadable) || null);
}

// charge « réelle » en kg (les élastiques ont des niveaux de résistance, pas des kilos)
function kgType(def){ const t = def && loadableTypeOf(def); return t && t!=="bands" ? t : null; }
function fmtLoad(def, w){ if(w==null || w==="") return ""; return loadableTypeOf(def)==="bands" ? "élastique "+bandLabel(w).toLowerCase() : fmtDec(w)+" kg"; }
function loadSuffix(def, w){ if(w==null || w==="" || !w) return ""; return loadableTypeOf(def)==="bands" ? " · "+fmtLoad(def, w) : " × "+fmtLoad(def, w); }
function nextWeight(exo, current){
  const type = loadableTypeOf(exo);
  if(!type) return null;
  const owned = (S.equipment.weights[type]||[]).slice().sort((a,b)=>a-b);
  if(owned.length){
    const higher = owned.find(w=>w>current+0.001);
    return higher!==undefined ? higher : owned[owned.length-1];
  }
  const inc = DEFAULT_INCREMENT[type]||2.5;
  return round1(current+inc);
}

// ---------- progression : « double progression » guidée par le ressenti ----------
// Repères (ACSM 2009, confirmés par la mise à jour 2026) : on progresse d'abord en
// répétitions dans la fourchette, puis on augmente la charge (2 à 10 %) quand on dépasse
// le haut de la fourchette ; les répétitions en réserve (RIR, Helms/Zourdos 2016)
// servent à moduler : « 0 en réserve » = on consolide, « 3+ en réserve » = on accélère.
// Variante plus difficile pour les exercices au poids du corps (pas de charge à ajouter).
const HARDER = {
  pompes_mur:["pompes_genoux"], pompes_genoux:["pompes"], pompes_surelevees:["pompes"], pompes:["pompes_declinees"],
  pompes_larges:["pompes_declinees"], pompes_diamant:["pompes_declinees"],
  squat_pdc:["squat_bulgare_pdc","squat_saute"], fentes_avant:["squat_bulgare_pdc"], fentes_arriere:["squat_bulgare_pdc"], fente_croisee:["squat_bulgare_pdc"],
  pont_fessier:["pont_fessier_uni"], tractions_negatives:["tractions"], releve_genoux_suspendu:["releve_jambes_suspendu"],
  crunch:["releve_jambes"], planche:["planche_commando"], enroule_pilates:["teaser_pilates"],
  dips_chaise:["dips_barres"], montees_chaise:["squat_bulgare_pdc"],
};
function harderVariant(exo){
  const list = HARDER[exo.id]; if(!list) return null;
  const id = list.find(x=>EXO_MAP[x] && !EXO_RETIRED.has(x) && hasEquip(S.equipment, EXO_MAP[x].equip) && !S.prefs.excluded.includes(x));
  return id ? EXO_MAP[id] : null;
}
// ressenti d'une performance : 1 = facile (3+ en réserve), 2 = correct, 3 = à fond ; 0 = non renseigné
function perfEffort(ex){ const d = ex.sets.filter(s=>s.done); for(let i=d.length-1;i>=0;i--) if(d[i].effort) return d[i].effort; return 0; }
function recentPerformances(exoId, n){
  return memo("rp:"+exoId+":"+n, ()=>{
    const out = [];
    for(let i=S.sessions.length-1;i>=0 && out.length<n;i--){
      const ex = S.sessions[i].exos.find(x=>x.exoId===exoId);
      if(ex && ex.sets.some(st=>st.done)) out.push({ session:S.sessions[i], exo:ex });
    }
    return out;
  });
}
function lowerWeight(exo, current){
  const type = loadableTypeOf(exo); if(!type) return current;
  const owned = (S.equipment.weights[type]||[]).slice().sort((a,b)=>a-b);
  if(owned.length){ const lower = owned.slice().reverse().find(w=>w<current-0.001); return lower!==undefined ? lower : current; }
  return Math.max(0, round1(current-(DEFAULT_INCREMENT[type]||2.5)));
}
// Première fois : un point de départ réaliste (charge par haltère, ou barre entière) selon le
// type de mouvement et le niveau, ramené au poids possédé le plus proche en dessous. Avant :
// la plus petite charge possédée, voire 1 kg — l'utilisateur devait tout remonter à la main.
const START_KG = {
  dumbbells:{ small:5, press:10, pull:10, legs:12, core:6 },
  kettlebell:{ small:8, press:12, pull:12, legs:16, core:8 },
  barbell:{ small:20, press:30, pull:30, legs:40, core:20 },
};
function startWeight(exo, type){
  const tbl = START_KG[type]; if(!tbl) return null;
  const m = exo.muscles[0];
  const kind = ["biceps","triceps","avantbras","mollets"].includes(m) || /elevations|oiseau|ecarte|pull_over|face_pull|shrug/.test(exo.id) ? "small"
    : ["squat","hinge","lunge"].includes(exo.pattern) ? "legs" : exo.pattern==="pull" ? "pull" : exo.pattern==="core" ? "core" : "press";
  const lv = S.goals.level==="debutant" ? .8 : S.goals.level==="avance" ? 1.3 : 1;
  const target = tbl[kind]*lv;
  const owned = (S.equipment.weights[type]||[]).slice().sort((a,b)=>a-b);
  if(!owned.length) return type==="barbell" ? Math.max(20, Math.round(target/5)*5) : Math.max(1, Math.round(target));
  const below = owned.filter(w=>w<=target+0.001);
  return below.length ? below[below.length-1] : owned[0];
}
function suggestForExo(exo, setsN, deload){
  const [rMin,rMax] = repRangeForGoal(exo);
  const n = setsN || exo.sets, timed = isTimed(exo);
  const type = loadableTypeOf(exo);
  let weight = null;
  if(type){
    const owned = (S.equipment.weights[type]||[]).slice().sort((a,b)=>a-b);
    weight = type==="bands" ? (owned.length ? owned[0] : 1) : startWeight(exo, type);
  }
  const mid = Math.round((rMin+rMax)/2);
  let reps = new Array(n).fill(timed ? rMin : mid), note = null, harder = null;
  const [last, prev] = recentPerformances(exo.id, 2);
  if(!last) return { targetReps:[rMin,rMax], weight, reps, note: type ? "Première fois : choisis une charge qui te laisse 2 à 3 répétitions en réserve." : null };

  const done = last.exo.sets.filter(st=>st.done);
  const lastReps = i => (done[Math.min(i, done.length-1)]||{}).reps || mid;
  const top = last.exo.targetReps ? last.exo.targetReps[1] : rMax, bottom = last.exo.targetReps ? last.exo.targetReps[0] : rMin;
  const effort = perfEffort(last.exo);
  const hitTop = done.every(st=>(st.reps||0)>=top);
  const missed = done.some(st=>(st.reps||0) < bottom);
  const prevMissed = prev && prev.exo.sets.filter(st=>st.done).some(st=>(st.reps||0) < (prev.exo.targetReps ? prev.exo.targetReps[0] : rMin));

  const gap = daysBetween(last.session.date, todayISO());
  if(type){
    const lastW = Math.max(0, ...done.map(st=>st.weight||0)) || weight;
    weight = lastW;
    if(gap>=21){
      // après 3 semaines sans cet exercice : on repart un cran plus léger, sans pression
      weight = lowerWeight(exo, lastW); reps = new Array(n).fill(mid);
      note = `Reprise après ${gap} jours : charge un peu allégée pour retrouver tes sensations.`;
    } else if((hitTop && effort!==3) || (effort===1 && done.every(st=>(st.reps||0)>=top-1))){
      const nw = nextWeight(exo, lastW);
      if(nw>lastW+0.001){
        weight = nw; reps = new Array(n).fill(rMin);
        note = type==="bands" ? `Passe à l'élastique ${bandLabel(nw).toLowerCase()} : tu as dépassé la fourchette. Reprends en bas (${rMin} reps) et remonte.` : `Charge augmentée à ${fmtDec(nw)} kg : tu as dépassé la fourchette. Reprends en bas (${rMin} reps) et remonte.`;
      } else {
        reps = reps.map((_,i)=>Math.min(rMax+4, lastReps(i)+1));
        note = type==="bands" ? "Tu utilises ton élastique le plus résistant : ajoute une répétition ou ralentis la descente (3 s)." : "Tu es à ta charge maximale : ajoute une répétition ou ralentis la descente (3 s).";
      }
    } else if(missed && (effort===3 || prevMissed)){
      const lw = lowerWeight(exo, lastW);
      weight = lw; reps = new Array(n).fill(rMin);
      note = lw<lastW ? `Charge allégée (${fmtLoad(exo, lw)}) pour retrouver une exécution propre, puis on remonte.` : "On garde la charge : vise une exécution propre avant tout.";
    } else if(missed){
      reps = new Array(n).fill(rMin);
      note = "Même charge : consolide les répétitions avant d'aller plus loin.";
    } else {
      const add = effort===3 ? 0 : 1;
      reps = reps.map((_,i)=>Math.max(rMin, Math.min(rMax, lastReps(i)+add)));
      if(add && reps.some((r,i)=>r>lastReps(i))) note = "Objectif du jour : une répétition de plus par série que la dernière fois.";
      else if(effort===3) note = "Dernière fois à fond : on refait pareil, en soignant l'exécution.";
    }
  } else {
    // poids du corps et exercices chronométrés : progression par les répétitions / les secondes
    const step = timed ? 5 : 1, cap = timed ? rMax+30 : rMax+6;
    const add = gap>=21 ? -step : effort===3 ? 0 : effort===1 ? step*2 : step;
    reps = reps.map((_,i)=>Math.max(rMin, Math.min(cap, lastReps(i)+add)));
    if(gap>=21){
      note = `Reprise après ${gap} jours : un peu moins que la dernière fois, on remonte vite.`;
    } else if(hitTop && effort!==3){
      const h = harderVariant(exo);
      if(h){ harder = h.id; note = `Tu maîtrises cet exercice : passe à « ${h.n} » pour continuer à progresser.`; }
      else if(add) note = timed ? `Objectif : ${step} secondes de plus par série.` : "Objectif : une répétition de plus par série.";
    } else if(add){
      note = timed ? `Objectif : +${add} s par rapport à la dernière fois.` : `Objectif : +${add} répétition${add>1?"s":""} par série par rapport à la dernière fois.`;
    }
  }
  // semaine allégée : même charge (pas de progression), 2 répétitions de moins (10 s pour un exercice
  // tenu), aucune série à fond. On réduit le volume et l'effort, pas la charge (consensus Delphi, Bell 2023)
  if(deload){
    harder = null;
    if(type && gap<21){ const lw = Math.max(0, ...done.map(st=>st.weight||0)); if(lw) weight = lw; }
    reps = reps.map((_,i)=>Math.max(timed ? rMin : Math.max(1, rMin-2), lastReps(i) - (timed ? 10 : 2)));
    note = timed ? "Semaine allégée : 10 s de moins que la dernière fois, sans aller au bout." : `Semaine allégée : ${type ? "même charge, " : ""}2 répétitions de moins, aucune série à fond.`;
  }
  return { targetReps:[rMin,rMax], weight, reps, note, harder };
}

function buildSetsFor(exo, suggestion){
  const midReps = Math.round((suggestion.targetReps[0]+suggestion.targetReps[1])/2);
  const sets = [];
  for(let i=0;i<exo.sets;i++){
    const r = suggestion.reps ? suggestion.reps[Math.min(i, suggestion.reps.length-1)] : midReps;
    sets.push({ reps:r, weight:suggestion.weight, done:false });
  }
  return sets;
}

function stepWeightValue(exo, current, dir){
  const type = loadableTypeOf(exo);
  if(!type) return current;
  const owned = (S.equipment.weights[type]||[]).slice().sort((a,b)=>a-b);
  if(owned.length){
    const idx = owned.findIndex(w=>Math.abs(w-current)<0.001);
    if(idx>=0){ const ni=idx+dir; return (ni>=0&&ni<owned.length) ? owned[ni] : current; }
    if(dir>0){ const higher = owned.find(w=>w>current); return higher!==undefined?higher:current; }
    const lower = owned.slice().reverse().find(w=>w<current);
    return lower!==undefined?lower:current;
  }
  const inc = DEFAULT_INCREMENT[type]||2.5;
  return Math.max(0, round1(current+dir*inc));
}

// ---------- types de séance ----------
const UPPER = ["pect","dos","epaules","biceps","triceps","avantbras"];
const LOWER = ["quadriceps","ischios","fessiers","mollets"];
const SESSION_TYPES = [
  { id:"auto", n:"Auto", muscles:null },
  { id:"full", n:"Corps complet", muscles:null },
  { id:"haut", n:"Haut du corps", muscles:UPPER },
  { id:"bas",  n:"Bas du corps", muscles:LOWER },
  { id:"push", n:"Poussée", muscles:["pect","epaules","triceps"] },
  { id:"pull", n:"Tirage", muscles:["dos","biceps","avantbras"] },
  { id:"bras", n:"Bras", muscles:["biceps","triceps","avantbras"] },
  { id:"core", n:"Gainage & cardio", muscles:["abdos","cardio"] },
  { id:"pilates", n:"Pilates & sol", muscles:["abdos","fessiers","dos"], floor:true },
];
const SESSION_TYPE_MAP = {}; SESSION_TYPES.forEach(t=>SESSION_TYPE_MAP[t.id]=t);

// « Auto » choisit un type selon la récupération : on évite de retravailler une
// zone sollicitée il y a moins de 2 jours.
function resolveAutoType(){
  const recent = ms => ms.some(m=>daysSinceTrained(m)<2);
  const upRecent = recent(UPPER), lowRecent = recent(LOWER);
  if(lowRecent && !upRecent) return { type:"haut", reason:"Tes jambes ont travaillé récemment : on cible le haut du corps." };
  if(upRecent && !lowRecent) return { type:"bas", reason:"Le haut du corps a travaillé récemment : on cible les jambes." };
  if(upRecent && lowRecent) return { type:"core", reason:"Tout le corps a travaillé récemment : séance plus légère de gainage." };
  return { type:"full", reason:"Tu es bien récupéré·e : séance corps complet, en priorité les groupes les moins travaillés." };
}

function poolForType(typeId){
  const t = SESSION_TYPE_MAP[typeId];
  const base = engineExos();
  if(!t || !t.muscles) return base;
  // Pilates & sol : au poids du corps, sur un tapis, sans sauts ni cardio
  if(t.floor) return base.filter(e=>e.equip.every(q=>q==="bodyweight") && !e.muscles.includes("cardio") && ["core","hinge","lunge"].includes(e.pattern) && t.muscles.includes(e.muscles[0]));
  const primary = base.filter(e=>t.muscles.includes(e.muscles[0]));
  if(primary.length>=3) return primary;
  return base.filter(e=>e.muscles.some(m=>t.muscles.includes(m)));
}

// famille d'un exercice (« pompes », « squat », « rowing »…) : deux variantes du même
// mouvement dans une séance font doublon, on préfère varier quand c'est possible
function exoFamily(e){ return e.id.split("_")[0]; }

// ---------- plan de séance (v3.4) ----------
// Chaque type de séance suit un plan d'emplacements, du plus exigeant au plus léger : on
// commence par les mouvements polyarticulaires (jambes, poussée, tirage), puis les
// compléments, et le gainage et les mollets ferment la séance. Un emplacement = mouvements
// acceptés (p) et muscles principaux visés (m). Avant, un cycle fixe de mouvements ignorait
// les muscles déjà couverts : trois exercices de pectoraux et aucun d'épaules en « Haut du corps ».
const Q = ["quadriceps"], HIP = ["fessiers","ischios"], PEC = ["pect"], SH = ["epaules"], BACK = ["dos"];
const SESSION_PLANS = {
  full: [ {p:["squat","lunge"],m:Q}, {p:["push"],m:PEC}, {p:["hinge"],m:HIP}, {p:["pull"],m:BACK}, {p:["core"]},
          {p:["push"],m:SH}, {p:["lunge","squat"]}, {p:["pull"],m:["biceps","epaules","dos"]}, {p:["calf"]}, {p:["push"],m:["triceps"]} ],
  haut: [ {p:["push"],m:PEC}, {p:["pull"],m:BACK}, {p:["push"],m:SH}, {p:["pull"],m:BACK}, {p:["push"],m:["triceps"]},
          {p:["pull"],m:["biceps"]}, {p:["pull"],m:["epaules"]}, {p:["push"],m:PEC}, {p:["pull","core"],m:["avantbras"]}, {p:["pull"],m:["biceps"]} ],
  bas:  [ {p:["squat"],m:Q}, {p:["hinge"],m:HIP}, {p:["lunge"]}, {p:["hinge"],m:HIP}, {p:["calf"]}, {p:["core"]},
          {p:["squat","lunge"]}, {p:["hinge"]}, {p:["core"]}, {p:["calf"]} ],
  push: [ {p:["push"],m:PEC}, {p:["push"],m:SH}, {p:["push"],m:PEC}, {p:["push"],m:["triceps"]}, {p:["push"],m:SH}, {p:["push"],m:["triceps"]},
          {p:["push"],m:PEC}, {p:["core"]} ],
  pull: [ {p:["pull"],m:BACK}, {p:["pull"],m:BACK}, {p:["pull"],m:["biceps"]}, {p:["pull"],m:["epaules"]}, {p:["pull"],m:["biceps"]},
          {p:["pull","core"],m:["avantbras"]}, {p:["hinge"]}, {p:["core"]} ],
  bras: [ {m:["biceps"]}, {m:["triceps"]}, {m:["biceps"]}, {m:["triceps"]}, {m:["avantbras"]}, {m:["biceps"]}, {m:["triceps"]}, {p:["core"]} ],
  core: [ {p:["core"],m:["abdos"]}, {p:["core"],m:["cardio"]}, {p:["core"],m:["abdos"]}, {p:["core"]}, {p:["core"],m:["cardio","abdos"]}, {p:["core"]} ],
  pilates: [ {p:["core"],m:["abdos"]}, {p:["hinge"],m:["fessiers"]}, {p:["core"],m:["dos"]}, {p:["core"],m:["abdos"]}, {p:["hinge","lunge"],m:["fessiers"]},
          {p:["core"],m:["abdos"]}, {p:["hinge"]}, {p:["core"]}, {p:["core"],m:["abdos"]}, {p:["hinge"]} ],
};
// fin de séance : gainage, mollets (et cardio) passent après les gros mouvements
const PATTERN_LATE = { core:2, calf:1 };

// avoid : exercices de la proposition précédente, fortement pénalisés pour que
// « Autre proposition » change vraiment. Le léger aléa départage les ex æquo.
function pickExosForSession(n, pool, avoid, typeId){
  pool = pool || engineExos();
  avoid = avoid || new Set();
  const base = {};
  pool.forEach(e=>{
    let sc = scoreExo(e) + Math.random()*1.2 - (avoid.has(e.id)?6:0);
    base[e.id] = sc;
  });
  const chosen = [], used = new Set(), muscleN = {}, patN = {};
  // variété : même famille, même muscle principal ou même mouvement déjà présents
  const adj = (e, slotI)=>{
    const fams = chosen.filter(c=>exoFamily(c)===exoFamily(e)).length;
    let sc = base[e.id] - fams*4.5 - (muscleN[e.muscles[0]]||0)*2.2 - (patN[e.pattern]||0)*0.6;
    if(slotI<3 && e.muscles.length>=3) sc += 0.8;       // en tête : les exercices qui font travailler plusieurs muscles
    return sc;
  };
  const take = e=>{ chosen.push(e); used.add(e.id); muscleN[e.muscles[0]] = (muscleN[e.muscles[0]]||0)+1; patN[e.pattern] = (patN[e.pattern]||0)+1; };
  const plan = SESSION_PLANS[typeId] || SESSION_PLANS.full;
  plan.forEach((slot, i)=>{
    if(chosen.length>=n) return;
    const cand = pool.filter(e=>!used.has(e.id) && (!slot.p || slot.p.includes(e.pattern)) && (!slot.m || slot.m.includes(e.muscles[0])));
    if(!cand.length) return;
    take(cand.reduce((b,x)=>adj(x,i)>adj(b,i)?x:b));
  });
  // plan épuisé ou matériel limité : les meilleurs restants, toujours en variant
  while(chosen.length<n){
    const rest = pool.filter(e=>!used.has(e.id));
    if(!rest.length) break;
    take(rest.reduce((b,x)=>adj(x,99)>adj(b,99)?x:b));
  }
  // ordre de la séance : gros mouvements d'abord, gainage et mollets à la fin
  // (Pilates : on garde l'alternance abdos / fessiers / dos du plan)
  if(typeId==="pilates") return chosen;
  return chosen.map((e,i)=>({ e, k:(PATTERN_LATE[e.pattern]||0)*100 + i })).sort((a,b)=>a.k-b.k).map(x=>x.e);
}

function sessionEntryFor(exo, setsN){
  // semaine allégée : environ 40 % de séries en moins (3 → 2, 5 → 3), jamais moins de 2
  const dl = typeof deloadActive==="function" && deloadActive() && !isStretch(exo);
  const n0 = setsN || exo.sets, n = dl ? Math.max(2, Math.min(n0, Math.round(n0*.6))) : n0;
  const sug = suggestForExo(exo, n, dl);
  const e = { exoId:exo.id, targetSets:n, targetReps:sug.targetReps, note:sug.note, sets:buildSetsFor(Object.assign({},exo,{sets:n}),sug) };
  if(sug.harder) e.harder = sug.harder;
  if(dl) e.deload = true;
  return e;
}

function generateEngineSession(typeId, avoid){
  typeId = typeId || "auto";
  let resolved = typeId, reason = null;
  if(typeId==="auto"){ const r = resolveAutoType(); resolved = r.type; reason = r.reason; }
  const n = sessionSize();
  const exos = pickExosForSession(resolved==="core" ? Math.min(n,5) : n, poolForType(resolved), avoid, resolved);
  const stim = stimTargets(exos);
  const session = {
    id: uid(), date: todayISO(), source:"engine", type:typeId, resolvedType:resolved, reason, stim:stim.length ? stimTargetsText(stim) : null,
    startedAt:null, completedAt:null,
    exos: exos.map(exo=>sessionEntryFor(exo))
  };
  if(S.settings.stretching) session.exos.push(...stretchBlock(session));
  return session;
}

// ---------- étirements (retour au calme) ----------
// 2 à 3 étirements en fin de séance proposée, pour les muscles qui viennent de travailler
// (réglage « Étirements en fin de séance » du Profil). Toujours placés après les exercices.
function stretchBlock(session){
  const pool = EXOS.filter(e=>isStretch(e) && !isExcluded(e.id));
  if(!pool.length) return [];
  const worked = focusMuscles(session), chosen = [];
  const take = e=>{ if(e && !chosen.includes(e) && chosen.length<3) chosen.push(e); };
  worked.forEach(m=>take(pool.find(e=>e.muscles[0]===m && !chosen.includes(e)) || pool.find(e=>e.muscles.includes(m) && !chosen.includes(e))));
  // séance de gainage ou peu de correspondances : mobilité du dos
  ["etir_chat_vache","etir_enfant","etir_ischios"].forEach(id=>{ if(chosen.length<2) take(pool.find(e=>e.id===id)); });
  return chosen.map(e=>sessionEntryFor(e));
}
function isStretchEntry(ex){ return isStretch(EXO_MAP[ex.exoId]); }
function mainExos(session){ return session.exos.filter(ex=>!isStretchEntry(ex)); }
// réglage modifié : la proposition du jour (pas encore commencée) est mise à jour tout de suite
function applyStretchSetting(){
  const d = S.draft;
  if(!d || d.startedAt || d.source!=="engine") return;
  d.exos = mainExos(d);
  if(S.settings.stretching) d.exos.push(...stretchBlock(d));
}

// Séance express (v4.0) : les jours sans envie, 3 exercices variés (tout le corps) × 2 séries,
// repos de 45 s au plus : une dizaine de minutes pour garder l'habitude (et la série de semaines).
function buildExpressSession(){
  let exos = pickExosForSession(3, poolForType("full"), undefined, "full");
  if(exos.length<3) exos = engineExos().filter(e=>!isStretch(e)).slice(0,3);
  return { id: uid(), date: todayISO(), source:"engine", type:"auto", resolvedType:"full", name:"Séance express", express:true,
    startedAt:null, completedAt:null, exos: exos.map(exo=>sessionEntryFor(exo, 2)) };
}
function buildCustomSession(entries, name){
  return {
    id: uid(), date: todayISO(), source:"custom", name: name||null, startedAt:null, completedAt:null,
    exos: entries.filter(e=>EXO_MAP[e.exoId]).map(e=>sessionEntryFor(EXO_MAP[e.exoId], e.sets))
  };
}

// durée estimée : ~40 s d'effort par série + le repos prévu
function estimateMinutes(session){
  const sec = session.exos.reduce((t,ex)=>{
    const def = EXO_MAP[ex.exoId]; if(!def) return t;
    return t + ex.sets.length*(40+def.restSec);
  },0);
  return Math.max(5, Math.round(sec/60/5)*5);
}
function focusMuscles(session){
  const count = {};
  session.exos.forEach(ex=>{ const d=EXO_MAP[ex.exoId]; if(d && !isStretch(d)) count[d.muscles[0]]=(count[d.muscles[0]]||0)+ex.sets.length; });
  return Object.keys(count).sort((a,b)=>count[b]-count[a]);
}

function resolveExoRef(ref){
  if(ref.id && EXO_MAP[ref.id]) return EXO_MAP[ref.id];
  const target = normName(ref.nom||ref.name||ref.id||"");
  if(!target) return null;
  let found = EXOS.find(e=>normName(e.n)===target || normName(e.id)===target);
  if(found) return found;
  found = EXOS.find(e=>normName(e.n).includes(target) || target.includes(normName(e.n)));
  return found||null;
}

function buildSessionFromImported(prog){
  const warnings = [];
  const exos = [];
  (prog.exercices||prog.exercises||[]).forEach(ref=>{
    const exo = resolveExoRef(ref);
    if(!exo){ warnings.push(`Exercice non reconnu : "${ref.nom||ref.name||ref.id||"?"}" (ignoré).`); return; }
    const setsN = ref.series||ref.sets||exo.sets;
    let reps = [exo.repsMin, exo.repsMax];
    if(typeof ref.reps==="string" && ref.reps.includes("-")){
      const [a,b] = ref.reps.split("-").map(x=>parseInt(x,10));
      if(!isNaN(a)&&!isNaN(b)) reps=[a,b];
    } else if(typeof ref.reps==="number"){ reps=[ref.reps,ref.reps]; }
    const weight = (ref.poids!=null?ref.poids:ref.weight!=null?ref.weight:null);
    const mid = Math.round((reps[0]+reps[1])/2);
    const sets = [];
    for(let i=0;i<setsN;i++) sets.push({reps:mid,weight,done:false,rpe:null});
    exos.push({ exoId:exo.id, targetSets:setsN, targetReps:reps, note:null, sets });
  });
  return { id:uid(), date:todayISO(), source:"imported", startedAt:null, completedAt:null,
    name: prog.nom||prog.name||null, exos, warnings };
}

function getOrCreateDraft(){
  // une séance démarrée reste active même si minuit passe pendant l'entraînement
  if(S.draft && (S.draft.date===todayISO() || S.draft.startedAt)) return S.draft;
  if(S.importedProgram && S.importedProgram.length){
    S.draft = buildSessionFromImported(S.importedProgram[0]);
  } else {
    S.draft = generateEngineSession();
  }
  save();
  return S.draft;
}

// typeId : type de séance voulu ; sans typeId on garde le type actuel et on varie les exercices
function regenerateDraft(typeId){
  const prev = S.draft;
  const avoid = !typeId && prev ? new Set(prev.exos.map(e=>e.exoId)) : null;
  S.draft = generateEngineSession(typeId || (prev&&prev.type) || "auto", avoid);
  save();
  return S.draft;
}

function importProgramJSON(text){
  let data;
  try{ data = JSON.parse(text); }catch(e){ return { ok:false, error:"Le fichier n'est pas un JSON valide." }; }
  const sessions = data.sessions || (Array.isArray(data)?data:null);
  if(!sessions || !Array.isArray(sessions) || !sessions.length){
    return { ok:false, error:"Format inattendu : aucune clé \"sessions\" trouvée." };
  }
  const warnings = [];
  sessions.forEach(s=>{
    const built = buildSessionFromImported(s);
    if(built.warnings) warnings.push(...built.warnings);
  });
  S.importedProgram = sessions;
  S.settings.todayTab = "proposal"; // le programme importé s'affiche dans « Proposée »
  if(S.draft && S.draft.date===todayISO() && !S.draft.startedAt){
    S.draft = buildSessionFromImported(S.importedProgram[0]);
  }
  save();
  return { ok:true, count:sessions.length, warnings };
}

// « Compléter avec l'app » : ajoute des exercices à une séance composée à la main,
// en visant les muscles et les mouvements que la séance ne couvre pas encore.
function suggestComplement(existingIds, n){
  const have = existingIds.map(id=>EXO_MAP[id]).filter(Boolean);
  const coveredMuscles = new Set(have.map(e=>e.muscles[0]));
  const coveredPatterns = new Set(have.map(e=>e.pattern));
  const fams = new Set(have.map(exoFamily));
  const pool = engineExos().filter(e=>!existingIds.includes(e.id));
  const jitter = {}; pool.forEach(e=>jitter[e.id]=Math.random()*1.2);
  const out = [];
  while(out.length<n && pool.length){
    let best=null, bestScore=-Infinity;
    pool.forEach(e=>{
      if(out.includes(e)) return;
      const sc = scoreExo(e) + jitter[e.id] - (coveredMuscles.has(e.muscles[0])?5:0) - (coveredPatterns.has(e.pattern)?2:0) - (fams.has(exoFamily(e))?3:0);
      if(sc>bestScore){ bestScore=sc; best=e; }
    });
    if(!best) break;
    out.push(best);
    coveredMuscles.add(best.muscles[0]); coveredPatterns.add(best.pattern); fams.add(exoFamily(best));
  }
  return out;
}

// ---------- tabbar ----------
function buildShell(){
  qs("#app").innerHTML = TABS.map(t=>`<div class="view" id="v-${t.id}"></div>`).join("");
  if(!qs("#charttip")){ const t = document.createElement("div"); t.id = "charttip"; t.setAttribute("role","tooltip"); document.body.appendChild(t); }
  qs(".tabbar").innerHTML = TABS.map(t=>`<button class="tabbtn" data-a="tab" data-id="${t.id}">${icon(t.icon)}<span class="tl">${t.n}</span></button>`).join("");
  // défilement : barre de navigation translucide et grand titre qui se replie façon iOS
  // (une seule écriture par image, uniquement des propriétés composées par le GPU)
  qsa(".view").forEach(v=>{
    let pending = false;
    v.addEventListener("scroll", ()=>{
      if(pending) return; pending = true;
      requestAnimationFrame(()=>{
        pending = false;
        const y = v.scrollTop;
        if(v.classList.contains("scrolled")!==(y>4)){ v.classList.toggle("scrolled", y>4); if(v.id==="v-"+currentTab && !statusDim) syncStatusBar(); }
        const lt = v.querySelector(".lt");
        if(lt){ const k = Math.max(0, Math.min(1, y/70)); lt.style.opacity = (1-k*0.9).toFixed(2); lt.style.transform = k ? `translateY(${(k*6).toFixed(1)}px) scale(${(1-k*0.06).toFixed(3)})` : ""; }
      });
    }, { passive:true });
  });
}

let currentTab = "today";
const TAB_ORDER = ["today","history","progress","profil"];
// transitions entre écrans : View Transitions (Safari 18+, Chrome) quand disponible,
// sinon l'animation d'entrée CSS habituelle
const canVT = ()=>!!document.startViewTransition && !(window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches);
function withTransition(kind, fn){
  if(!canVT()) return fn();
  document.documentElement.dataset.vt = kind;
  const t = document.startViewTransition(fn);
  // deux changements rapprochés interrompent la transition précédente : ses promesses sont
  // rejetées (AbortError), sans conséquence ; une erreur de l'écran lui-même est notée
  const done = ()=>{ if(document.documentElement.dataset.vt===kind) delete document.documentElement.dataset.vt; };
  t.finished.then(done, done);
  t.ready.catch(()=>{});
  if(t.updateCallbackDone) t.updateCallbackDone.catch(err=>{ if(!err || err.name!=="AbortError") reportError("transition", err); });
}
// Changement d'onglet (v4.0) : comme sur iOS, immédiat et léger. L'écran d'arrivée apparaît en
// fondu court avec un petit glissement dans le sens de l'onglet ; son contenu n'est reconstruit
// que si les données ont changé, et les animations d'entrée (cartes en cascade, compteurs) ne se
// jouent qu'à la première visite. Avant : capture de toute la page (View Transitions) + cascade
// rejouée à chaque visite, ce qui donnait l'impression d'un rechargement.
function switchTab(id){ switchTabNow(id); }
function switchTabNow(id){
  const from = TAB_ORDER.indexOf(currentTab), to = TAB_ORDER.indexOf(id);
  const v = qs("#v-"+id); if(!v) return;
  const changed = currentTab!==id;
  v.dataset.dir = !changed || from<0 ? "" : to>from ? "r" : "l";
  currentTab = id;
  qsa(".tabbtn").forEach(b=>{ const on = b.dataset.id===id; b.classList.toggle("on", on); if(on) b.setAttribute("aria-current", "page"); else b.removeAttribute("aria-current"); });
  qsa(".view").forEach(x=>x.classList.toggle("active", x===v));
  const upToDate = v._ver===DATA_VER && v._day===todayISO() && v.firstChild;
  if(!upToDate){
    const first = !v._seen; v._seen = true;
    if(first) markEnter(v);
    renderView(id);
    if(first) animateCounts(v);
  } else settleSegs(v);
  if(id==="history" && typeof markFreshHistory==="function") markFreshHistory(v);
  // fondu d'arrivée par l'API Web Animations : aucune mise en page forcée, rien à nettoyer
  if(changed && v.animate && !reducedMotion()){
    const dx = v.dataset.dir==="r" ? 12 : v.dataset.dir==="l" ? -12 : 0;
    try{ v.animate([{ opacity:0, transform:`translateX(${dx}px)` }, { opacity:1, transform:"none" }], { duration:220, easing:"cubic-bezier(.2,.8,.2,1)" }); }catch(e){}
  }
  if(typeof renderRestBar==="function") renderRestBar();
  syncLiveChrome();
  if(typeof syncStatusBar==="function" && !statusDim) syncStatusBar();
  prerenderStaleViews();
}
// Onglets déjà visités dont les données ont changé : reconstruits pendant les temps morts (un à la
// fois), pour que le prochain changement d'onglet soit instantané au lieu de reconstruire au toucher.
// Rien pendant une séance en cours (barre d'onglets masquée, batterie) ni pour les trophées 3D.
let prerenderQueued = false;
function prerenderStaleViews(){
  if(prerenderQueued) return;
  const idle = window.requestIdleCallback || (f=>setTimeout(()=>f({ timeRemaining:()=>12, didTimeout:false }), 400));
  const stale = ()=>(S.draft && S.draft.startedAt) ? [] : TAB_ORDER.filter(id=>id!==currentTab).map(id=>qs("#v-"+id))
    .filter(v=>v && v._seen && !(v._ver===DATA_VER && v._day===todayISO()) && !(v.id==="v-progress" && typeof progressTab!=="undefined" && progressTab==="medals"));
  prerenderQueued = true;
  idle(function step(dl){
    const list = stale();
    if(!list.length){ prerenderQueued = false; return; }
    if(dl && !dl.didTimeout && dl.timeRemaining()<10){ idle(step, { timeout:3000 }); return; }
    try{ renderView(list[0].id.slice(2)); }catch(e){}
    if(list.length>1) idle(step, { timeout:3000 }); else prerenderQueued = false;
  }, { timeout:3000 });
}
// onglet déjà affiché touché à nouveau : retour en haut en douceur (convention iOS) ; déjà en
// haut de Progrès sur un sous-onglet : retour au résumé. Jamais de reconstruction de la page.
function reselectTab(){
  const v = qs("#v-"+currentTab); if(!v) return;
  if(v.scrollTop>4){ try{ v.scrollTo({ top:0, behavior:reducedMotion() ? "auto" : "smooth" }); }catch(e){ v.scrollTop = 0; } return; }
  if(currentTab==="progress" && typeof progressTab!=="undefined" && progressTab!=="overview" && ACT.progressTab) ACT.progressTab({ v:"overview" });
}
// séance en cours à l'écran : la barre d'onglets s'efface (toute la hauteur pour l'effort, rien
// ne passe dessous) ; « Terminer » et la croix restent en haut pour sortir
function syncLiveChrome(){ document.body.classList.toggle("live-focus", currentTab==="today" && !!(S.draft && S.draft.startedAt)); }

const VIEWS = {};
function renderView(id){
  if(id==="today" && typeof syncWakeLock==="function") syncWakeLock();
  const el = qs("#v-"+id);
  if(!el || !VIEWS[id]) return;
  const scrollTop = el.scrollTop;
  hideTip();
  // un écran qui échoue (donnée inattendue) ne doit ni rester vide ni bloquer l'app : message
  // sobre et bouton pour réessayer, les autres onglets restent utilisables
  let html;
  try{ html = VIEWS[id](); }catch(err){ reportError("écran "+id, err); html = viewErrorHTML(id); }
  el.innerHTML = html;
  if(id==="today") syncLiveChrome();
  el._ver = DATA_VER; el._day = todayISO(); // rendu à jour pour ces données
  el.classList.toggle("scrolled", scrollTop>4);
  // rétablir la position force une mise en page immédiate : inutile en haut de page (cas courant)
  if(scrollTop>0) el.scrollTop = scrollTop;
  settleSegs(el);
  if(typeof afterRenderView==="function") try{ afterRenderView(id, el); }catch(err){ reportError("après "+id, err); }
}
function viewErrorHTML(id){
  return `<div class="content"><div class="empty-state view-err"><span class="em">${ii("warn")}</span>
    Cet écran n'a pas pu s'afficher.<br>Tes données ne sont pas touchées.
    <div class="btnrow" style="justify-content:center"><button class="btn secondary sm" data-a="retryView" data-v="${id}">Réessayer</button></div></div></div>`;
}
// rendu avec entrée animée (apparition décalée des éléments .stagger, compteurs)
// — réservé aux changements d'onglet ou de section, pas aux rendus après chaque action.
// Un minuteur par écran : avec un seul minuteur partagé, deux onglets visités coup sur coup
// laissaient le premier en « .enter » pour de bon, et chacun de ses rendus suivants (séance
// modifiée, « Afficher plus »…) rejouait toute la cascade d'entrée.
function markEnter(el){
  el.classList.add("enter"); clearTimeout(el._enterT);
  el._enterT = setTimeout(()=>{ el.classList.remove("enter"); el.dataset.dir = ""; }, 1200);
}
function renderViewAnimated(id, reuse){
  const el = qs("#v-"+id);
  if(!el) return;
  // changement d'onglet sans modification des données : on réutilise le rendu existant
  // (ni reconstruction du HTML ni nouvelle mise en page complète) ; il faut alors relancer
  // les animations d'entrée. Un rendu neuf les joue de lui-même (éléments nouveaux).
  if(reuse && el._ver===DATA_VER && el._day===todayISO() && el.firstChild){
    el.classList.remove("enter"); void el.offsetWidth;
    markEnter(el); settleSegs(el);
  } else { markEnter(el); renderView(id); }

}

const SEG_PREV = {};

  </div>`;

// L'indicateur glisse de l'ancienne à la nouvelle position. Web Animations plutôt qu'une

    const prev = SEG_PREV[key]==null ? cur : SEG_PREV[key];
