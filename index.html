/* v2.5 : graphiques parcourables au doigt */
.colchart .cc-plot,.linechart svg{touch-action:pan-y;-webkit-user-select:none;user-select:none;-webkit-touch-callout:none}
.lc-cursor{stroke:var(--label2);stroke-width:1;stroke-dasharray:3 3;opacity:0;transition:opacity .15s}
.lc-cdot{fill:var(--bg2);stroke:var(--tint-ink);stroke-width:2.6;opacity:0;transition:opacity .15s;pointer-events:none}
.lc-cursor.on,.lc-cdot.on{opacity:1}
#charttip{transition:opacity .15s,transform .09s ease-out}
/* v2.5 : transitions entre écrans (View Transitions) */
.tabbar{view-transition-name:tabbar}
::view-transition-group(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
::view-transition-old(root),::view-transition-new(root){animation-duration:.32s;animation-timing-function:cubic-bezier(.32,.72,0,1)}
html[data-vt="tab-r"]::view-transition-old(root){animation-name:vtOutL}
html[data-vt="tab-r"]::view-transition-new(root){animation-name:vtInR}
html[data-vt="tab-l"]::view-transition-old(root){animation-name:vtOutR}
html[data-vt="tab-l"]::view-transition-new(root){animation-name:vtInL}
html[data-vt="fade"]::view-transition-old(root){animation-name:vtFadeOut}
html[data-vt="fade"]::view-transition-new(root){animation-name:vtFadeIn}
@keyframes vtOutL{to{opacity:0;transform:translateX(-7%) scale(.985)}}
@keyframes vtInR{from{opacity:0;transform:translateX(9%)}}
@keyframes vtOutR{to{opacity:0;transform:translateX(7%) scale(.985)}}
@keyframes vtInL{from{opacity:0;transform:translateX(-9%)}}
@keyframes vtFadeOut{to{opacity:0}}
@keyframes vtFadeIn{from{opacity:0;transform:translateY(8px)}}
/* v2.5 : exercice animé dans la fiche */
.exo-stage{width:168px;height:168px;margin:0 auto 12px;border-radius:40px;background:radial-gradient(circle at 50% 30%,color-mix(in srgb,var(--rc,var(--tint)) 22%,var(--bg2)),var(--bg2) 72%);box-shadow:inset 0 0 0 .5px var(--sep);display:grid;place-items:center;animation:badgePop .5s cubic-bezier(.32,1.4,.4,1)}
.exo-anim{width:142px;height:142px;overflow:visible}
.exo-anim .ea-env{fill:none;stroke:var(--label3);stroke-width:1.1;stroke-linecap:round}

.exo-anim .ea-head{fill:var(--rc,var(--tint))}
.exo-anim .ea-load{fill:var(--label);opacity:.85}
.exo-anim .ea-plate{fill:none;stroke:var(--label);stroke-width:1.05;opacity:.85}
.exo-anim .ea-handle{fill:none;stroke:var(--label);stroke-width:.85;opacity:.85}
.exo-anim .ea-db{fill:none;stroke:var(--label);stroke-width:1.15;stroke-linecap:round;opacity:.85}
.exo-anim .ea-band{fill:none;stroke:var(--rc,var(--tint));stroke-width:.7;stroke-linecap:round;opacity:.55;stroke-dasharray:.1 1.1}
.exo-anim .ea-ghost{fill:none;stroke:var(--label);stroke-width:1.75;stroke-linecap:round;stroke-linejoin:round;opacity:.09}
.exo-anim .ea-ghost circle{fill:var(--label);stroke:none}
.exo-anim .ea-shadow{fill:var(--label);opacity:.08}
/* ================= v2.5 : Rewind ================= */
.rc-sec{margin:18px 20px 8px}
.rw-cover{position:relative;display:flex;flex-direction:column;align-items:flex-start;gap:2px;width:calc(100% - 32px);margin:4px 16px 0;padding:22px 20px 20px;border-radius:24px;overflow:hidden;color:#fff;text-align:left;min-height:168px;box-shadow:0 18px 36px -18px rgba(216,72,15,.7);transition:transform .2s cubic-bezier(.32,1.4,.4,1)}
.rw-cover:active{transform:scale(.97)}
.rw-cover[disabled]{filter:grayscale(1);opacity:.6}
.rwc-bg{position:absolute;inset:-30%;z-index:-1;will-change:transform;background:radial-gradient(120% 90% at 85% 10%,#FFB300 0,transparent 55%),radial-gradient(120% 120% at 0% 100%,#8A1C00 0,transparent 60%),linear-gradient(140deg,#FF7A1A,#D8480F 55%,#7A1E05);animation:rwcMove 9s ease-in-out infinite alternate}
/* dérive du dégradé par transformation (composée par le GPU) plutôt que background-position (repeinte à chaque image) */
@keyframes rwcMove{from{transform:translate(8%,8%)}to{transform:translate(-8%,-8%)}}
.rwc-k{font-size:var(--fs-cap);font-weight:700;letter-spacing:.22em;text-transform:uppercase;opacity:.85}
.rwc-t{font-family:var(--display);font-weight:700;font-size:var(--fs-t1);line-height:1.1;margin-top:4px}
.rwc-s{font-size:var(--fs-sub);font-weight:600;opacity:.9}
.rwc-play{position:absolute;right:18px;bottom:18px;width:52px;height:52px;border-radius:50%;background:#fff;color:#D8480F;display:grid;place-items:center;box-shadow:0 8px 20px -6px rgba(0,0,0,.35)}
.rwc-play svg{width:22px;height:22px;margin-left:3px}

#rewind{position:fixed;inset:0;z-index:95;color:#fff;overflow:hidden;background:#140803;opacity:0;transform:scale(1.04);transition:opacity .35s ease,transform .45s cubic-bezier(.32,.72,0,1);touch-action:none;-webkit-user-select:none;user-select:none;--a:#FF7A1A;--b:#D8480F;--c:#5A1400}
#rewind.show{opacity:1;transform:none}
#rewind.closing{opacity:0;transform:scale(.96)}
#rewind[data-bg="ember"]{--a:#FF8A2A;--b:#D8480F;--c:#4A1000}
#rewind[data-bg="teal"]{--a:#35D0C6;--b:#0E7C86;--c:#062A33}
#rewind[data-bg="violet"]{--a:#A77BFF;--b:#5B3FD0;--c:#1A0F45}
#rewind[data-bg="green"]{--a:#6EE38F;--b:#1E9E55;--c:#08331C}
#rewind[data-bg="blue"]{--a:#6FB6FF;--b:#1F63E0;--c:#0A1F4D}
#rewind[data-bg="gold"]{--a:#FFD65A;--b:#E09A12;--c:#4A2A00}
#rewind[data-bg="night"]{--a:#6B7280;--b:#374151;--c:#0B0F17}
.rw-bgs{position:absolute;inset:0;background:linear-gradient(160deg,var(--b),var(--c));transition:background .8s ease}
.rw-bgs i{position:absolute;width:80vmax;height:80vmax;border-radius:50%;background:radial-gradient(circle,var(--a) 0,transparent 62%);opacity:.55;filter:blur(8px);transition:background .8s ease;animation:rwBlob 14s ease-in-out infinite alternate}
.rw-bgs i:nth-child(1){left:-30vmax;top:-30vmax}
.rw-bgs i:nth-child(2){right:-35vmax;bottom:-25vmax;animation-duration:17s;animation-delay:-4s;opacity:.4}
.rw-bgs i:nth-child(3){left:10vmax;bottom:-45vmax;width:60vmax;height:60vmax;animation-duration:11s;opacity:.3}
@keyframes rwBlob{to{transform:translate(12vmax,10vmax) scale(1.15)}}
.rw-top{position:absolute;left:0;right:0;top:0;z-index:3;padding:calc(10px + var(--sat)) 12px 0;display:flex;align-items:center;gap:10px}
.rw-prog{flex:1;display:flex;gap:4px}
.rw-prog span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.3);overflow:hidden}
.rw-prog i{display:block;height:100%;background:#fff;transform-origin:left;transform:scaleX(0)}
.rw-x{width:44px;height:44px;display:grid;place-items:center;color:#fff;margin:-8px -6px -8px 0}
.rw-x svg{width:22px;height:22px}
.rw-stage-wrap{position:absolute;inset:0;z-index:2}
.rw-slide{position:absolute;inset:0;display:flex;align-items:center;justify-content:center;padding:calc(64px + var(--sat)) 28px calc(40px + var(--sab));opacity:0;transform:translateX(36px) scale(.98);transition:opacity .38s ease,transform .45s cubic-bezier(.32,.72,0,1)}
.rw-slide.from-back{transform:translateX(-36px) scale(.98)}
.rw-slide.in{opacity:1;transform:none}
.rw-slide.out{opacity:0;transform:translateX(-36px) scale(.97)}
.rw-slide.out.back{transform:translateX(36px) scale(.97)}
.rw-in{width:100%;max-width:440px;text-align:center;display:flex;flex-direction:column;align-items:center}
.rw-in>*{opacity:0;transform:translateY(18px);animation:rwUp .7s cubic-bezier(.2,.8,.2,1) forwards}
.rw-in>*:nth-child(2){animation-delay:.12s}.rw-in>*:nth-child(3){animation-delay:.24s}.rw-in>*:nth-child(4){animation-delay:.4s}.rw-in>*:nth-child(5){animation-delay:.55s}.rw-in>*:nth-child(6){animation-delay:.7s}
@keyframes rwUp{to{opacity:1;transform:none}}
.rw-kicker{font-size:var(--fs-foot);font-weight:700;letter-spacing:.3em;text-transform:uppercase;opacity:.85}
.rw-label{font-size:var(--fs-t3);font-weight:700;opacity:.92;margin-bottom:6px}
.rw-big{font-family:var(--num);font-weight:700;font-size:min(34vw,150px);line-height:.95;letter-spacing:-.04em;font-variant-numeric:tabular-nums;text-shadow:0 10px 40px rgba(0,0,0,.25)}
.rw-big.sm{font-size:min(20vw,86px)}
.rw-unit{font-size:var(--fs-t2);font-weight:700;opacity:.9;margin-top:2px}
.rw-title{font-family:var(--display);font-weight:700;font-size:var(--fs-t1);line-height:1.15;margin-top:8px}
.rw-note{font-size:var(--fs-body);line-height:1.4;opacity:.92;margin:18px 0 0;max-width:320px}
.rw-note b{font-weight:700}
.rw-chip{margin-top:14px;padding:8px 14px;border-radius:20px;background:rgba(255,255,255,.18);font-weight:700;font-size:var(--fs-sub);-webkit-backdrop-filter:blur(8px);backdrop-filter:blur(8px)}
.rw-chip.up{background:rgba(255,255,255,.26)}
.rw-chip .ii{vertical-align:-.15em}
/* rembobinage */
.rw-tape{width:120px;height:120px;margin:22px 0 10px;display:grid;place-items:center}
.rw-tape svg{width:100%;height:100%;fill:#fff;filter:drop-shadow(0 8px 24px rgba(0,0,0,.3))}
.rewinding .rw-tape svg{animation:rwTape .45s linear infinite}
@keyframes rwTape{0%{transform:translateX(0);opacity:1}50%{transform:translateX(-6px);opacity:.7}100%{transform:translateX(0);opacity:1}}
.landed .rw-tape svg{animation:rwLand .6s cubic-bezier(.32,1.6,.4,1)}
@keyframes rwLand{from{transform:scale(.7) rotate(-12deg)}}
.rw-date{font-family:var(--display);font-weight:700;font-size:var(--fs-lt);line-height:1.1;font-variant-numeric:tabular-nums;min-height:1.2em}
.rewinding .rw-date{filter:blur(.6px);opacity:.9;text-shadow:-3px 0 rgba(255,60,60,.55),3px 0 rgba(60,200,255,.55)}
.landed .rw-date{animation:rwPop .6s cubic-bezier(.32,1.6,.4,1)}
@keyframes rwPop{from{transform:scale(.85)}}
.rewinding::after{content:"";position:absolute;inset:0;pointer-events:none;background:repeating-linear-gradient(180deg,rgba(255,255,255,.05) 0 2px,transparent 2px 4px);animation:rwScan .3s steps(3) infinite}
@keyframes rwScan{to{background-position:0 4px}}
.rw-sub{font-size:var(--fs-body);opacity:.9;margin-top:10px}
/* calendrier du mois / barres de l'année */
.rw-cal{display:grid;grid-template-columns:repeat(7,1fr);gap:7px;width:100%;max-width:300px;margin-top:22px}
.rw-cal i{aspect-ratio:1;border-radius:50%;background:rgba(255,255,255,.16)}
.rw-cal i.pad{background:none}
.rw-cal i.on{background:#fff;box-shadow:0 0 14px rgba(255,255,255,.7);animation:rwDot .4s calc(.6s + var(--k)*35ms) both cubic-bezier(.32,1.6,.4,1)}
@keyframes rwDot{from{transform:scale(0);opacity:0}}
.rw-bars{display:flex;align-items:flex-end;gap:6px;height:130px;width:100%;max-width:320px;margin-top:24px}
.rw-bars div{flex:1;height:100%;display:flex;flex-direction:column;justify-content:flex-end;align-items:center;gap:6px}
.rw-bars span{width:100%;height:var(--h);min-height:4px;border-radius:6px;background:#fff;transform-origin:bottom;animation:rwBar .7s calc(.5s + var(--k)*60ms) both cubic-bezier(.2,.8,.2,1)}
.rw-bars small{font-size:11px;font-weight:700;opacity:.8}
@keyframes rwBar{from{transform:scaleY(0)}}
/* anneau du temps */
.rw-ring{position:relative;width:220px;height:220px;display:grid;place-items:center;margin:8px 0 4px}
.rw-ring svg{position:absolute;inset:0;width:100%;height:100%;transform:rotate(-90deg)}
.rw-ring circle{fill:none;stroke:rgba(255,255,255,.2);stroke-width:10}
.rw-ring circle.p{stroke:#fff;stroke-linecap:round;stroke-dasharray:327;stroke-dashoffset:327;animation:rwRing 1.6s .4s forwards cubic-bezier(.2,.8,.2,1)}
@keyframes rwRing{to{stroke-dashoffset:calc(327 - 327*var(--p))}}
/* disques */
.rw-plates{display:flex;gap:6px;margin-top:18px;height:58px;align-items:center}
.rw-plates i{width:14px;height:calc(28px + var(--k)*4px);max-height:58px;border-radius:4px;background:linear-gradient(90deg,rgba(255,255,255,.95),rgba(255,255,255,.55));animation:rwPlate .45s calc(.6s + var(--k)*90ms) both cubic-bezier(.32,1.6,.4,1)}
@keyframes rwPlate{from{transform:translateY(-40px);opacity:0}}
/* exercice favori */
.rw-stage{width:190px;height:190px;border-radius:48px;background:rgba(255,255,255,.14);display:grid;place-items:center;margin:6px 0 4px;--rc:#fff}
.rw-stage .exo-anim{width:160px;height:160px}
.rw-stage .exo-anim .ea-body{stroke:#fff}.rw-stage .exo-anim .ea-head{fill:#fff}.rw-stage .exo-anim .ea-env{stroke:rgba(255,255,255,.45)}.rw-stage .exo-anim .ea-load{fill:#1b1b1b}.rw-stage .exo-anim .ea-plate,.rw-stage .exo-anim .ea-handle,.rw-stage .exo-anim .ea-db{stroke:#1b1b1b}.rw-stage .exo-anim .ea-ghost{stroke:#fff}.rw-stage .exo-anim .ea-ghost circle,.rw-stage .exo-anim .ea-shadow{fill:#fff}.rw-stage .exo-anim .ea-band{stroke:#fff}
.rw-list{width:100%;max-width:340px;margin-top:18px;display:flex;flex-direction:column;gap:8px}
.rw-list div{display:flex;align-items:center;gap:10px;padding:10px 14px;border-radius:16px;background:rgba(255,255,255,.14);font-weight:600;text-align:left;animation:rwUp .5s calc(.9s + var(--k)*.12s) both}

.rw-list span{margin-left:auto;opacity:.85;font-variant-numeric:tabular-nums;white-space:nowrap}

.rw-habits{display:flex;flex-direction:column;gap:12px;width:100%;max-width:340px;margin-top:12px}
.rw-habits div{display:flex;align-items:center;gap:14px;padding:14px 16px;border-radius:18px;background:rgba(255,255,255,.14);text-align:left;font-size:var(--fs-callout);line-height:1.3;animation:rwUp .55s calc(.35s + var(--k)*.18s) both}

.rw-medals{display:grid;grid-template-columns:repeat(3,1fr);gap:14px 10px;width:100%;max-width:340px;margin-top:20px}
.rw-medals div{display:flex;flex-direction:column;align-items:center;gap:6px;animation:rwMedal .6s calc(.5s + var(--k)*.12s) both cubic-bezier(.32,1.5,.4,1)}
.rw-medals small{font-size:12px;font-weight:700;opacity:.9;line-height:1.2}
@keyframes rwMedal{from{transform:scale(.3) rotate(-20deg);opacity:0}}
/* fin */
.rw-card{width:min(70vw,300px);aspect-ratio:4/5;border-radius:20px;overflow:hidden;box-shadow:0 30px 60px -20px rgba(0,0,0,.6);margin:10px 0 20px;animation:rwCard .8s .2s both cubic-bezier(.2,.8,.2,1)}
.rw-card img{width:100%;height:100%;display:block}
@keyframes rwCard{from{transform:perspective(700px) rotateX(18deg) translateY(40px);opacity:0}}

.rw-actions .btn{background:#fff;color:#C2410C}
.rw-actions .btn.secondary{background:rgba(255,255,255,.18);color:#fff}
#rewind.paused .rw-prog i{opacity:.6}
@media (prefers-reduced-motion:reduce){.rw-bgs i,.rwc-bg{animation:none}.rw-in>*{animation-duration:.01s}}

.rw-in>.rw-card,.rw-in>.rw-bolt{opacity:1;transform:none}
.rw-ring>div{position:relative;display:flex;flex-direction:column;align-items:center}
/* ================= v2.6 : trophée 3D (démonstration) ================= */

  background:radial-gradient(90% 120% at 22% 40%,rgba(255,150,40,.28),transparent 60%),linear-gradient(160deg,#26211C,#0B0907);box-shadow:0 16px 34px -18px rgba(0,0,0,.6),inset 0 0 0 .5px rgba(255,255,255,.08);transition:transform .25s cubic-bezier(.32,1.4,.4,1),opacity .2s}

  background:radial-gradient(120% 60% at 50% 0%,rgba(255,150,40,.3),transparent 65%),linear-gradient(180deg,#221C16,#0A0806 55%);box-shadow:0 -20px 50px rgba(0,0,0,.4);transform:translateY(24px);opacity:0;transition:transform .45s cubic-bezier(.32,.72,0,1),opacity .3s}
.t3d-full.show .t3d-panel{transform:none;opacity:1}
.t3d-full.closing .t3d-panel{transform:translateY(40px);opacity:0}
.t3d-x{position:absolute;right:12px;top:12px;width:44px;height:44px;border-radius:22px;display:grid;place-items:center;color:#fff;background:rgba(255,255,255,.12);z-index:2}
.t3d-x svg{width:18px;height:18px}
.t3d-big{width:min(78vw,340px);aspect-ratio:1;margin:8px auto 0;touch-action:none;cursor:grab;transition:transform .5s cubic-bezier(.32,.72,0,1);transform-origin:center}
.t3d-big .t3d-canvas{width:100%;height:100%;display:block}
.t3d-body{text-align:center;max-width:420px;margin:0 auto}
.t3d-name{font-family:var(--display);font-weight:700;font-size:var(--fs-t1);margin-top:4px}
.t3d-tier{color:#FFB36B;font-weight:700;margin-top:2px}
.t3d-desc{color:rgba(255,255,255,.75);font-size:var(--fs-sub);line-height:1.4;margin:10px 0 14px}
.t3d-body .mc-bar{background:rgba(255,255,255,.14)}
.t3d-prog{font-size:var(--fs-foot);color:rgba(255,255,255,.7);margin-top:8px}
.t3d-sec{margin:20px 0 8px;font-size:var(--fs-cap);font-weight:700;letter-spacing:.12em;text-transform:uppercase;color:rgba(255,255,255,.55)}
.t3d-metals{display:flex;gap:8px;justify-content:center;flex-wrap:wrap}
.t3d-metals .chip{background:rgba(255,255,255,.1);color:#fff}
.t3d-metals .chip.on{background:#fff;color:#1a120a}
.t3d-metals .ii{width:12px;height:12px;opacity:.7;margin-left:2px}
.t3d-actions{margin-top:18px}
.t3d-actions .btn.secondary{background:rgba(255,255,255,.12);color:#fff}
@media (prefers-reduced-motion:reduce){.t3d-big{transition:none}}

/* v2.7 : palier Diamant (remplace Platine) */
.tier-tag.t4{background:var(--diam)!important;color:#1B2A4A}
.m-spark{animation:mSpark 2.8s ease-in-out infinite}
.medal-modal .m-spark{filter:drop-shadow(0 0 1.5px #fff)} /* le halo (filtre recalculé à chaque image) seulement en grand */
@keyframes mSpark{0%,100%{opacity:0;transform:scale(.2) rotate(0)}45%{opacity:1;transform:scale(1) rotate(45deg)}60%{opacity:.9;transform:scale(.8) rotate(60deg)}}
@media (prefers-reduced-motion:reduce){.m-spark{animation:none;opacity:.8}}
/* v2.7 : vignettes 3D des trophées */
.medal .medal-3d{position:absolute;left:-14%;top:-14%;width:128%;height:128%;max-width:none;opacity:0;transition:opacity .35s ease;pointer-events:none}
.medal.m3d-on{filter:drop-shadow(0 4px 6px rgba(0,0,0,.18))}
.medal.m3d-on .medal-3d{opacity:1}
.medal.m3d-on .medal-svg{opacity:0;transition:opacity .35s ease}
.t3d-fallback svg{width:104px;height:104px}
.t3d-rows{margin:16px 0 0;text-align:left;border-radius:16px;background:rgba(255,255,255,.06);padding:4px 14px}
.t3d-row{display:flex;align-items:center;gap:10px;padding:10px 0;border-bottom:.5px solid rgba(255,255,255,.1);font-size:var(--fs-sub);color:rgba(255,255,255,.55)}
.t3d-row:last-child{border-bottom:0}
.t3d-row.got{color:#fff}
.t3d-row b{width:64px}
.t3d-row em{margin-left:auto;font-style:normal;font-size:var(--fs-cap);opacity:.8}
.t3d-row .ii{color:#34C759}

/* ================= ASCEN : identité « Barre relevée »,version adoucie ================= */
/* Titres : Geist serré. Chiffres : Barlow Semi Condensed (tableau d'affichage). Orange en aplat,texte encre dessus. */
.lt{font-weight:700;letter-spacing:-.03em}
.fc-name,.exo-hero .nm,.pc-title,.be-t,.mm-name,.cel-title,.ph-name,.hero-title,.la-name,.cc-title,.tpl-empty .te-t,.ob-t,.ob-t2,.rwc-t,.rw-title,.t3d-name{letter-spacing:-.022em}
h2.sh{letter-spacing:-.02em}
.kpi-v,.stat-box .num,.ring-time,#restbar .rt-time,.tg-val,.big-stepper .bs-val:not(.band-val),.stepper .val,.mini-step span,.wv-v{font-family:var(--num);font-weight:600;letter-spacing:0}
.kpi-v{font-size:calc(36rem/17)}
.stat-box .num{font-size:var(--fs-t1)}
.big-stepper .bs-val:not(.band-val){font-size:var(--fs-t1)}
.ring-time{font-size:calc(38rem/17)}
.hist-kpi b,.cc-stats b,.lh-clock span,.lh-pct b,.tg-val{font-weight:600}
/* aplats : plus de dégradés ni de reflets animés,l'orange suffit */
.btn{border-radius:var(--r-btn);font-weight:600}
.validate{background:var(--tint);box-shadow:none}
.validate::after{display:none}
.lp-seg i{background:var(--tint)}
.spill{border-radius:var(--r-card);box-shadow:none}
.ls-chip.current{background:var(--tint);box-shadow:none}
.celebrate-ring{background:var(--tint);color:var(--on-tint);box-shadow:0 0 0 10px var(--tint-bg)}
/* carte « action du jour » : encre,texte clair,bouton orange */
.hero{background:var(--ink);color:var(--on-ink);border-radius:var(--r-hero);box-shadow:none}
.hero::before,.hero::after,.hero-sheen{display:none}
.hero-eyebrow{color:#FF9A73;opacity:1;letter-spacing:.1em}
.hero-title{text-shadow:none;font-size:var(--fs-t1)}
.hero-meta span{background:rgba(244,243,241,.1);color:rgba(244,243,241,.86);font-weight:600}
.hero-picts .hp{background:rgba(244,243,241,.07);box-shadow:inset 0 0 0 1px rgba(244,243,241,.1);color:var(--on-ink)}
.hp-more{color:rgba(244,243,241,.7)}
.hero-go,:root[data-theme="dark"] .hero-go{background:var(--tint);color:var(--on-tint);box-shadow:none;border-radius:var(--r-btn);justify-content:space-between;padding:0 10px 0 20px;font-weight:700}
.hg-ico{order:2;background:var(--on-tint);color:var(--tint)}
.hero-go .hg-ico::after{background:rgba(20,18,16,.25)}
.hero.done{background:#1D5E36;box-shadow:none}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]) .hero-go{background:var(--tint);color:var(--on-tint)} :root:not([data-theme="light"]) .hero{box-shadow:inset 0 0 0 1px rgba(244,243,241,.08)} }
:root[data-theme="dark"] .hero{box-shadow:inset 0 0 0 1px rgba(244,243,241,.08)}
/* logotype ASCEN (SVG au trait, voir ui_shell.js : ascenMark) */
.ascen-mark{display:block;height:auto;fill:none;stroke:currentColor}
.ascen-mark .bar{stroke:var(--tint)}
.lv-badge,.ph-avatar{background:conic-gradient(var(--tint) 0 100%)}
.lv-badge b,.lv-badge span{font-family:var(--num);font-weight:600}
.xpbar span{background:var(--tint)}
/* lancement */
.splash{background:#141210;color:#F4F3F1}
.sp-logo{position:relative;width:224px;height:61px;margin-bottom:22px}
.sp-logo svg{position:absolute;inset:0;width:100%;height:100%;stroke:#F4F3F1}
.sp-logo .bar{stroke:#FF6B3D}
.sp-letters{position:absolute;inset:0;animation:spWipe .7s cubic-bezier(.6,0,.2,1) .1s both}
.sp-bar{position:absolute;inset:0;animation:spBarIn .25s ease .55s both,spBarUp .6s cubic-bezier(.3,1.5,.5,1) .85s both}
@keyframes spWipe{from{clip-path:inset(0 100% 0 0)}to{clip-path:inset(0 0 0 0)}}
@keyframes spBarIn{from{opacity:0}to{opacity:1}}
@keyframes spBarUp{from{transform:translateY(21.4%)}to{transform:none}}
.sp-tag{color:rgba(244,243,241,.62);letter-spacing:.01em}
.ob-logo{width:176px;margin:18px auto 22px;color:var(--label);animation:fadeUp .6s ease both}
.ob-logo .ascen-mark{width:176px;height:48px}
/* lancement de séance : encre,anneaux et chiffres sobres,l'orange en accent */
.la-bg{background:#141210}
.la-rings span{border-color:rgba(255,107,61,.6)}
.la-count b{font-weight:600;font-size:170px;text-shadow:none;color:#F4F3F1}
.la-burst i{background:#FF6B3D;box-shadow:none}
.la-burst i:nth-child(3n){background:#F4F3F1}
.la-title{font-family:var(--display);font-weight:700;letter-spacing:-.03em;text-shadow:none;color:#FF8C62}
.la-picts span{background:rgba(244,243,241,.07);box-shadow:inset 0 0 0 1px rgba(244,243,241,.12)}
.la-line{font-style:normal;color:rgba(244,243,241,.7)}
.btn.big,.btn.big.validate{box-shadow:none}
.sfi.lg{background:var(--c);box-shadow:inset 0 0 0 .5px rgba(0,0,0,.08)}
.te-days button.on{box-shadow:none}
.about-logo{display:flex;flex-direction:column;align-items:center;gap:10px;padding:10px 0 22px;color:var(--label)}
.about-logo .ascen-mark{width:150px;height:41px}
.about-logo span{font-size:var(--fs-sub);color:var(--label2)}
/* Rewind : couverture encre,orange en accent ; les diapositives « braise » passent à l'orange ASCEN */
.rwc-bg{background:radial-gradient(90% 90% at 90% 0%,rgba(255,107,61,.34),transparent 60%),#141210}
.rwc-k{color:#FF8C62;opacity:1}
.rwc-play{background:#FF6B3D;color:#141210;box-shadow:none}
#rewind[data-bg="ember"]{--a:#FF7A4D;--b:#D9532A;--c:#231009}

/* =====================================================================================
   SYSTÈME ASCEN (v2.9) — couche de référence des composants. Les sections précédentes
   restent pour le détail ; ici on fixe les règles communes : une seule marge latérale,une échelle typographique,deux niveaux de carte,une hiérarchie de boutons,des pictos
   teintés au lieu d'aplats multicolores,et des zones de sécurité iOS centralisées.
   ===================================================================================== */

/* --- cadre : zones de sécurité et défilement --- */
html{overflow:hidden}
#app{position:fixed;inset:0}
.view{top:var(--sat);padding-bottom:calc(var(--tabbar-h) + var(--sab) + 96px);scroll-padding-top:52px}
.tabbar{padding-bottom:var(--sab)}
.tabbtn{min-height:var(--tabbar-h);padding:6px 0 4px;color:var(--tab-off)}
.tabbtn .tl{font-size:var(--fs-cap2);font-weight:500;letter-spacing:.01em}
.tabbtn.on .tl{font-weight:600}
#restbar{bottom:calc(var(--tabbar-h) + var(--sab) + 10px)}
.sheet{max-height:calc(100% - var(--sat) - 10px);border-radius:var(--r-hero) var(--r-hero) 0 0}
.sheet.tall{height:calc(100% - var(--sat) - 10px)}
:root{--tab-off:rgba(50,47,42,.46)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tab-off:rgba(244,243,241,.45)}}
:root[data-theme="dark"]{--tab-off:rgba(244,243,241,.45)}

/* --- typographie : trois niveaux nets par écran --- */
.eyebrow{font-size:var(--fs-sub);font-weight:500;color:var(--label2);margin-top:0}
.lt{font-size:var(--fs-lt);line-height:1.08;padding:2px 20px 14px}
h2.sh{font-family:var(--display);font-size:var(--fs-t3);font-weight:700;letter-spacing:-.02em;margin:32px 20px 10px}
h2.sh .more{font-family:var(--sans);font-size:var(--fs-sub);font-weight:500;letter-spacing:0}
.sh-sub{font-size:var(--fs-sub);margin:-6px 20px 12px}
.row{min-height:52px;padding:11px 16px;gap:12px}
.row .t{font-size:var(--fs-body);font-weight:400}
.row .s{font-size:var(--fs-foot);margin-top:2px}
.row .val{font-size:var(--fs-sub)}
/* étiquettes en capitales : un seul style partout */
.pick-h,.big-stepper .bs-label,.hero-eyebrow,.kpi-l,.cc-s .up{letter-spacing:.05em}
.pick-h{font-size:var(--fs-cap);font-weight:600;color:var(--label2)}
.big-stepper .bs-label{font-size:var(--fs-cap2);font-weight:600}

/* --- cartes : une seule famille (fond, rayon 16, pas d'ombre) ; la carte du jour et la carte focus au-dessus (rayon 22) --- */
.group,.kpi,.stat-box,.chart-card,.builder-empty,.tpl-empty,.backup-nudge,.level-card,.profile-hero,.up-next,.week-plan,.tpl-card2,.medal-card{border-radius:var(--r-card);box-shadow:none}
.focus-card{border-radius:var(--r-hero);box-shadow:none}
.chart-card{margin:12px var(--gutter) 0;padding:16px}
.kpi{padding:14px 16px}
.kpi-l{font-size:var(--fs-foot);font-weight:500;color:var(--label2);letter-spacing:0}
.kpi-s{font-size:var(--fs-foot)}
.stat-box{padding:14px 8px}
.stat-box .lbl{font-size:var(--fs-cap);color:var(--label2)}

/* --- boutons : primaire (aplat orange, un seul par écran) · secondaire (teinté) · tertiaire (gris) · texte --- */
.btn{height:50px;border-radius:var(--r-btn);font-weight:600;font-size:var(--fs-body);gap:8px}
.btn.big{height:56px;border-radius:16px}
.btn.sm{height:44px;border-radius:12px;font-size:var(--fs-sub);padding:0 16px}
.btn.secondary{background:var(--tint-bg);color:var(--tint-ink)}
.btn.tertiary{background:var(--fill2);color:var(--label)}
.btn.tertiary svg,.btn.tertiary .spk{color:var(--tint-ink)}
.btn.ghost{background:transparent;color:var(--tint-ink);font-weight:600}
.btn:disabled,.btn.disabled{opacity:.4}
.hr-note.center{text-align:center;margin-top:8px}

/* --- pictos d'exercice : fond teinté + trait de la couleur de la région (plus d'aplats multicolores) --- */
.xico{--tile:color-mix(in srgb,var(--rc,var(--tint)) 15%,var(--bg2));background:var(--tile);color:color-mix(in srgb,var(--rc,var(--tint)) 88%,var(--label));box-shadow:none}
.xico.xl,.xico.lg{box-shadow:none}
.xico.done{background:color-mix(in srgb,var(--green) 16%,var(--bg2));color:var(--green)}
/* icônes de contenu (rappels, cartes vides, entrées) : monochromes teintées ; les réglages du Profil gardent leurs couleurs iOS */
.backup-nudge .sfi,.be-ico .sfi,.te-ico .sfi,.rc-entry .sfi{background:var(--tint-bg)!important;box-shadow:none}
.backup-nudge .sfi svg,.be-ico .sfi svg,.te-ico .sfi svg,.rc-entry .sfi svg{color:var(--tint-ink)}
.backup-nudge .sfi [fill="#fff"],.be-ico .sfi [fill="#fff"],.te-ico .sfi [fill="#fff"],.rc-entry .sfi [fill="#fff"]{fill:var(--tint-ink)}
.backup-nudge .sfi [stroke="#fff"],.be-ico .sfi [stroke="#fff"],.te-ico .sfi [stroke="#fff"],.rc-entry .sfi [stroke="#fff"]{stroke:var(--tint-ink)}
.sfi.lg{border-radius:12px}

/* --- Aujourd'hui : résumé de semaine en une carte,trois colonnes identiques --- */
.stat-pills{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:0;margin:0 var(--gutter) 16px;padding:14px 0 16px;background:var(--bg2);border-radius:var(--r-card)}
.spill{display:flex;flex-direction:column;align-items:flex-start;gap:2px;padding:0 16px;border-radius:0;background:none;box-shadow:none;min-width:0}
.spill+.spill{box-shadow:inset .5px 0 0 var(--sep)}
.spill:active{transform:none;opacity:.6}
.sp-v{display:flex;align-items:baseline;gap:3px;line-height:1}
.sp-v b{font-family:var(--num);font-weight:600;font-size:calc(30rem/17);letter-spacing:0;font-variant-numeric:tabular-nums}
.sp-v i{font-style:normal;font-size:var(--fs-sub);font-weight:500;color:var(--label2)}
.sp-l{font-size:var(--fs-cap);color:var(--label2);white-space:nowrap;overflow:hidden;text-overflow:ellipsis;max-width:100%}
.spg{display:block;width:100%;height:4px;margin-top:8px;border-radius:2px;background:var(--fill);overflow:hidden}
.spg>i{display:block;height:100%;border-radius:2px;background:var(--tint)}
.spill.full .spg>i{background:var(--green)}
.spg-dots{display:grid;grid-template-columns:repeat(5,1fr);gap:3px;background:none}
.spg-dots>i{height:4px;border-radius:2px;background:var(--fill)}
.spg-dots>i.on{background:var(--tint)}
.enter .spg>i{animation:hbGrow .9s cubic-bezier(.2,.8,.2,1) .35s both;transform-origin:left}
/* carte du jour : méta en une ligne de texte,pictos plus petits */
.hero{margin:0 var(--gutter) 24px;width:calc(100% - 2 * var(--gutter));padding:20px 20px 18px}
.hero-title{font-size:var(--fs-t1);line-height:1.1}
.hero-meta{gap:0;margin-top:6px}
.hero-meta span{background:none;padding:0;border-radius:0;font-size:var(--fs-sub);font-weight:500;color:rgba(244,243,241,.7)}
.hero-meta span+span::before{content:"·";margin:0 7px;opacity:.6}
.hero-picts{margin-top:16px;gap:6px}
.hero-picts .hp{width:36px;height:36px;border-radius:10px}
.hero-go{height:52px;margin-top:18px}
/* rappels (sauvegarde, Rewind) : texte,puis actions alignées dessous */
.backup-nudge{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;row-gap:10px;align-items:start;margin:0 var(--gutter) 16px;padding:14px 16px}
.backup-nudge .t{font-size:var(--fs-body);font-weight:600}
.backup-nudge .s{font-size:var(--fs-foot);color:var(--label2);margin-top:2px;white-space:normal}
.backup-nudge .bn-act{grid-column:2;flex-direction:row;align-items:center;gap:16px}
.backup-nudge .bn-act button{font-size:var(--fs-sub);font-weight:600;min-height:32px}
.backup-nudge .bn-act button.later{font-size:var(--fs-sub);font-weight:500}
/* cartes « composer » et « séances de la semaine » : même gabarit,compact,aligné à gauche */
.builder-empty,.tpl-empty{margin:0 var(--gutter);padding:16px;text-align:left}
.be-row{gap:12px;align-items:flex-start}
.be-t,.tpl-empty .te-t{font-family:var(--display);font-size:var(--fs-t3);font-weight:700;letter-spacing:-.02em;margin:0}
.be-s,.tpl-empty .te-s{font-size:var(--fs-sub);color:var(--label2);line-height:1.4;margin:4px 0 0}
.be-actions{margin-top:16px;gap:8px}
.tpl-empty{display:grid;grid-template-columns:auto minmax(0,1fr);column-gap:12px;align-items:start}
.tpl-empty .te-ico{grid-row:span 2;margin:0}
.tpl-empty .btn{grid-column:1/-1;width:100%;margin-top:14px}
.tpl-empty .btn.ghost{margin-top:2px;height:40px}
.tpl-section{margin-top:28px}

/* --- listes d'exercices : lignes plus denses,le dosage en clair,l'orange réservé aux actions --- */
.pick-row .dose{color:var(--label);font-weight:600}
.pick-row .s{font-size:var(--fs-foot)}
.pick-h{margin:20px 20px 8px}
.info-btn{background:none!important;box-shadow:inset 0 0 0 1.5px var(--sep);width:30px;height:30px;font-size:15px}
.xwrap .info-dot{width:16px;height:16px;font-size:10px;right:-4px;bottom:-4px}

/* --- historique : durée sur la ligne du titre,détails sur toute la largeur (plus de chiffres tronqués) --- */
.hr-top{display:flex;align-items:baseline;justify-content:space-between;gap:10px;min-width:0}
.hr-top .t{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hr-dur{flex:none;font-size:var(--fs-sub);color:var(--label2);font-variant-numeric:tabular-nums}
#v-history .row .s{white-space:nowrap;overflow:hidden;text-overflow:ellipsis}

/* --- graphiques : barres pleines de la couleur de la marque,sans rose délavé --- */
.cc-bar{opacity:1;background:var(--tint);width:min(12px,56%);border-radius:3px 3px 0 0}
.cc-col.cur .cc-bar,.cc-col.now .cc-bar{background:var(--tint)}

/* --- séance en cours : moins de boîtes dans la boîte,repères neutres --- */
.focus-card{margin:0 var(--gutter);padding:22px 18px 18px}
.fc-name{font-size:var(--fs-t2)}
.fc-sub{font-size:var(--fs-foot);margin-bottom:14px}
.big-steppers{gap:10px}
.big-stepper{background:var(--bg3);border-radius:var(--r-card);box-shadow:inset 0 0 0 .5px var(--sep)}
.exo-note{background:none;padding:0 6px;margin:0 0 16px;text-align:center;font-size:var(--fs-foot);color:var(--label2)}
.fc-last{margin:12px 0 14px}
.up-next{margin:12px var(--gutter) 0;width:calc(100% - 2 * var(--gutter));padding:12px 16px}

/* --- profil : en-tête sans voile coloré --- */
.profile-hero{background:var(--bg2);padding:18px 16px}

/* --- niveau (Progrès) --- */
.level-card{margin:0 var(--gutter) 12px}
.tpl-section .tpl-empty{margin:0}
/* sélection = encre (puces, exercice courant) ; l'orange reste pour les actions et la progression */
.chip.on{background:var(--label);color:var(--bg2)}
.ls-chip.current{background:var(--label);color:var(--bg2);box-shadow:none}
.ls-chip.current .ls-ring{background:conic-gradient(var(--tint) calc(var(--p)*1%),rgba(128,128,128,.35) 0)}
.ls-chip.current .ls-ring>span{background:var(--label);color:var(--bg2)}
.ls-chip.current .ls-ring>span .picto{color:var(--bg2)}
.fc-phase{color:var(--label2);font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em}
.lh-pct b{color:var(--label)}
.lh-pct small,.lh-pct span{color:var(--label2)}
/* icônes de contenu hors Profil : monochromes teintées (les réglages du Profil gardent le code couleur iOS) */
#v-today .sfi,#v-history .sfi,#v-progress .sfi{background:var(--tint-bg)!important;box-shadow:none}
#v-today .sfi [fill="#fff"],#v-history .sfi [fill="#fff"],#v-progress .sfi [fill="#fff"]{fill:var(--tint-ink)}
#v-today .sfi [stroke="#fff"],#v-history .sfi [stroke="#fff"],#v-progress .sfi [stroke="#fff"]{stroke:var(--tint-ink)}
/* sélecteur d'exercices */
.chip{font-weight:500}
.chip.on{font-weight:600}
.chip.cat{font-weight:500}
.pick-m{color:var(--label2)!important;font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em}
.pick-h .sfi{background:var(--fill)!important;box-shadow:none}
.pick-h .sfi [fill="#fff"]{fill:var(--label2)}
.pick-h .sfi [stroke="#fff"]{stroke:var(--label2)}
.pick-row .info-btn{box-shadow:none;color:var(--label3)!important;width:40px;height:40px;font-size:17px}
.chip-scroll .chip.cat{font-weight:500}.chip-scroll .chip.cat.on{font-weight:600}
.stat-box .num{font-size:var(--fs-t2);line-height:1.1;overflow-wrap:anywhere}
/* animation d'exercice : le muscle principal ressort (segment plus épais, plus foncé) */
.exo-anim .ea-focus{fill:none;stroke:color-mix(in srgb,var(--rc,var(--tint)) 45%,var(--label));stroke-width:2.3;stroke-linecap:round;opacity:.95}
.rw-stage .exo-anim .ea-focus{stroke:#FFD2BF}
/* fiche 3D d'un trophée : encre ASCEN,lumière neutre (plus de halo brun « forge ») */
.t3d-panel{background:radial-gradient(110% 55% at 50% 0%,rgba(255,255,255,.1),transparent 62%),linear-gradient(180deg,#1F1D1B,#0B0B0A 58%)}
.t3d-panel[data-tier="4"]{background:radial-gradient(110% 55% at 50% 0%,rgba(190,225,255,.2),transparent 62%),linear-gradient(180deg,#1A1E24,#0A0B0D 58%)}
/* étirements : section « retour au calme » (séance proposée, détail d'une séance) */
.cool-h{display:flex;align-items:center;gap:6px;margin:22px 20px 8px;font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label2)}
.cool-h svg{width:15px;height:15px;color:var(--green)}
.cool-group{margin-top:0}
/* v3.2 : enregistrer ou non la séance composée (seul chemin de création) */
.save-row{display:flex;align-items:center;gap:12px;width:calc(100% - 2*var(--gutter,16px));margin:10px var(--gutter,16px) 0;padding:12px 14px;border-radius:var(--r-card);background:var(--bg2);text-align:left;transition:transform .15s,background .15s}
.save-row:active{transform:scale(.985);background:var(--fill2)}
.save-row .grow{display:flex;flex-direction:column;gap:2px;min-width:0}
.save-row .t{font-weight:600;font-size:var(--fs-body);color:var(--tint-ink)}
.save-row.saved .t{color:var(--label)}
.save-row .s{font-size:var(--fs-foot);color:var(--label2);line-height:1.3}
.save-row .chev{color:var(--label3);flex:none}
.save-row .chev svg{width:15px;height:15px}
.tpl-add-row.one{grid-template-columns:1fr}
.te-lite{display:flex;flex-wrap:wrap;gap:6px;margin:10px 4px 4px}
.te-lite span{padding:6px 10px;border-radius:var(--r-pill);background:var(--fill2);font-size:var(--fs-foot);color:var(--label)}
.te-lite b{color:var(--label2);font-weight:600}
/* pas de zoom au double appui (boutons, pas +/−, listes) : le pincement reste possible.
   :where() = spécificité nulle,les gestes dédiés (pan-y, none) gardent la main */
:where(*){touch-action:manipulation}
:where(button){-webkit-user-select:none;user-select:none}
/* écran qui n'a pas pu s'afficher (renderView) */
.view-err .em svg{width:34px;height:34px;color:var(--orange,#FF9500)}
/* v3.4 : pictogrammes de la carte du jour touchables (fiche de l'exercice) */
.hero-picts .hp{transition:transform .15s}
.hero-picts .hp:active{transform:scale(.88)}
.hero-picts .hp-more{min-width:36px;min-height:36px}
/* v3.6 : carte des muscles (fiche exercice, Progrès) */
.mm{display:block;width:100%;max-width:250px;height:auto;margin:4px auto 0;overflow:visible}
.mm-base{fill:var(--fill);opacity:.65}
.mm-z{fill:var(--fill);stroke:var(--sep);stroke-width:.35;transition:fill-opacity .3s}
.mm-z.on{fill:var(--rc);fill-opacity:var(--v);stroke:var(--rc);stroke-opacity:.9}
.mm-z[data-tip]{cursor:pointer}
.mm-z.tip-on{stroke:var(--label);stroke-width:.8}
.mm-cap{font-size:4.4px;fill:var(--label2);text-anchor:middle;font-weight:600;letter-spacing:.04em;text-transform:uppercase}
.exo-mm{margin:6px 16px 0;padding:10px 0 4px;border-radius:var(--r-card);background:var(--bg2)}
.exo-mm .mm{max-width:210px}
.mm-card .mm{max-width:270px;margin-top:10px}
.mm-scale{display:flex;align-items:center;gap:10px;margin-top:12px;padding-top:12px;border-top:.5px solid var(--sep);font-size:var(--fs-foot);color:var(--label2)}
.mm-scale .sc{display:flex;flex:1;gap:3px}
.mm-scale .sc i{flex:1;height:8px;border-radius:3px;background:var(--label);opacity:var(--o)}
.mm-scale .sc i:first-child{background:var(--fill);opacity:1;box-shadow:inset 0 0 0 .5px var(--sep)}
.mm-hint{margin-top:8px;font-size:var(--fs-foot);color:var(--label2);text-align:center}
/* ---------- défis (v3.6) ---------- */
.ch-row .sfi,.ch-pick .sfi{flex:none}
.ch-pick{align-items:flex-start}
.ch-pick .sfi{margin-top:2px}
.ch-pick .btn{flex:none;align-self:center}
.ch-on{flex:none;align-self:center;font-size:var(--fs-foot);font-weight:700;color:var(--tint-ink);padding:4px 10px;border-radius:999px;background:color-mix(in srgb,var(--tint-ink) 14%,transparent)}
.ch-won{display:inline-flex;align-items:center;gap:3px;margin-left:6px;font-size:var(--fs-foot);font-weight:700;color:var(--green);vertical-align:1px}
.ch-won .ii{width:12px;height:12px}
.ch-count{font-size:var(--fs-foot);font-weight:600;color:var(--label2);text-transform:none;letter-spacing:0}
.cel-chal{background:color-mix(in srgb,var(--tint-ink) 15%,transparent);color:var(--tint-ink)}
.ch-group{margin-bottom:14px}
.ch-pick .s{white-space:normal;overflow:visible;text-overflow:clip;display:block}

/* ======== v3.8 · accessibilité mesurée (tests/ux_audit.js) ========
   Contraste ≥ 4,5:1 (WCAG 1.4.3), cibles tactiles ≥ 44 pt (Apple HIG) sans changer le dessin,
   texte ≥ 11 px dans les graphiques. */
:root,:root[data-theme="light"]{--tint-ink:#AD3A12;--tab-off:rgba(50,47,42,.72)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--tab-off:rgba(244,243,241,.58)}}
:root[data-theme="dark"]{--tab-off:rgba(244,243,241,.58)}
/* puce de l'exercice en cours : le compteur suit la couleur de la puce (il était blanc sur blanc en sombre) */
.ls-chip.current .ls-sets{color:var(--bg2)!important;opacity:.72}
.tier-tag.t2,.tier-tag.t3{color:#141210}
.safety-box .lbl{color:var(--tint-ink)}
.wp-t{color:var(--label2)}
.info-dot,.pick-row .info-btn{color:var(--label2)!important}
.info-btn{box-shadow:inset 0 0 0 1.5px var(--label3)}
/* zone de toucher agrandie à 44 × 44 au minimum, centrée sur le contrôle */
:where(.icon-btn,.btn.sm,.nb-done,.big-stepper button,.mini-step button,#restbar button,.seg button,.chip,.switch,.info-btn,.navbtn,.type-chip,.spill){position:relative}
.icon-btn::before,.btn.sm::before,.nb-done::before,.big-stepper button::before,.mini-step button::before,#restbar button::before,.seg button::before,.chip::before,.switch::before,.info-btn::before,.navbtn::before,.type-chip::before,.spill::before{
  content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%);border-radius:inherit}
/* pendant l'effort : boutons − / + plus grands */
.big-stepper button{width:40px;height:40px;border-radius:20px}
/* graphiques : 11 px minimum */
.cc-gl span,.cc-goal span,.cc-x span,.hm-months,.hm-days,.hm-legend{font-size:11px}
.lc-tick{font-size:11px}
:where(.hero-picts .hp,.later,.bn-act button,.ph-name,.fc-menu,.fc-info,.ring-adjust button,.focus-nav .center-link){position:relative}
.hero-picts .hp::before,.later::before,.bn-act button::before,.ph-name::before,.fc-menu::before,.fc-info::before,.ring-adjust button::before,.focus-nav .center-link::before{
  content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:max(100%,44px);transform:translate(-50%,-50%);border-radius:inherit}
.ls-chip{height:44px}
.pick-row{min-height:44px}
.pick-row .row-main{min-height:44px}
.seg button{white-space:nowrap;overflow:hidden;text-overflow:ellipsis;padding:0 6px}
#toast.has-act{pointer-events:auto;display:flex;align-items:center;gap:4px;padding:6px 6px 6px 16px;text-align:left}
#toast .t-undo{margin-left:10px;padding:0 14px;min-height:34px;border-radius:17px;background:var(--tint-bg);color:var(--tint-ink);font-weight:700;font-size:var(--fs-sub);flex:none;position:relative}
#toast .t-undo::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:44px;transform:translate(-50%,-50%)}
/* séance en cours : barre d'onglets effacée */
.tabbar{transition:transform .35s cubic-bezier(.32,.72,0,1),opacity .25s}
body.live-focus .tabbar{transform:translateY(105%);opacity:0;pointer-events:none}
body.live-focus #v-today{padding-bottom:calc(var(--sab) + 48px)}
body.live-focus #restbar{bottom:calc(14px + var(--sab))}
/* fin de séance : progrès concrets depuis un mois */
.cel-prog{display:flex;align-items:flex-start;gap:8px;margin-top:8px;padding:9px 12px;border-radius:12px;background:var(--fill2);color:var(--label);font-size:var(--fs-sub);font-weight:600;text-align:left;line-height:1.3;animation:noteIn .4s calc(var(--i)*120ms + .25s) both cubic-bezier(.32,.72,0,1)}
.cel-prog .ii{flex:none;width:17px;height:17px;margin-top:1px;color:var(--green)}
/* « ton pourquoi » */
.ph-why{display:inline-flex;align-items:center;gap:5px;margin-top:6px;font-size:var(--fs-foot);font-style:italic;color:var(--label2);text-align:left;position:relative}
.ph-why.empty{font-style:normal;color:var(--tint-ink);font-weight:600}
.ph-why svg{width:13px;height:13px;flex:none;opacity:.7}
.ph-why::before{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.why-card{margin:0 16px 14px;padding:14px 16px;border-radius:var(--r-card,18px);background:var(--bg2);box-shadow:inset 3px 0 0 var(--tint)}
.why-k{display:flex;align-items:center;gap:6px;font-size:var(--fs-cap);font-weight:700;letter-spacing:.04em;text-transform:uppercase;color:var(--tint-ink)}
.why-k .ii{width:14px;height:14px}
.why-t{margin-top:6px;font-family:var(--display);font-size:var(--fs-t3,20px);font-weight:700;line-height:1.25;color:var(--label)}
.why-s{margin-top:6px;font-size:var(--fs-foot);color:var(--label2)}
/* v4.0 : l'arrivée sur un onglet est animée en JS (Web Animations), une seule fois par changement */
.view.active{animation:none}
.tabbar{view-transition-name:none}
/* corriger les séries faites (v4.0) */
button.set-dots{display:flex;margin-left:auto;margin-right:auto;padding:6px 10px;border-radius:14px;position:relative}
button.set-dots:active{background:var(--fill2)}
button.fc-recap{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;width:100%;border-radius:14px}
button.fc-recap:active{background:var(--fill2)}
.ds-row{gap:10px;min-height:56px}
.ds-n{width:26px;height:26px;border-radius:13px;background:var(--fill);display:grid;place-items:center;font-weight:700;font-size:var(--fs-foot);flex:none;font-variant-numeric:tabular-nums}
.ds-f{display:flex;flex-direction:column;align-items:center;gap:2px}
.ds-f small{font-size:var(--fs-cap2);color:var(--label2)}
.ds-pr{color:var(--tint-ink);display:grid;place-items:center}
.ds-undo{margin-left:auto}
.rest-row{padding-bottom:4px}
.rest-seg{display:flex;gap:8px;padding:0 16px 12px 58px;flex-wrap:wrap}
.rest-seg .chip{flex:1;justify-content:center;min-width:0}
/* séance express (v4.0) */
.hero-alt{align-self:center;margin-top:10px;min-height:36px;padding:0 12px;display:inline-flex;align-items:center;gap:6px;font-size:var(--fs-sub);font-weight:600;color:rgba(244,243,241,.8);border-radius:18px;position:relative}
.hero-alt svg{width:16px;height:16px}
.hero-alt:active{background:rgba(255,255,255,.08)}
.hero-alt::before{content:"";position:absolute;left:0;right:0;top:50%;height:44px;transform:translateY(-50%)}
.why-go{margin-top:12px;width:auto;padding:0 16px}
.why-go svg{width:16px;height:16px}
button.set-dots::before{content:"";position:absolute;left:50%;top:50%;width:max(100%,44px);height:44px;transform:translate(-50%,-50%)}
/* exercices inclus / exclus : section repliable « Sans ton matériel » */
.pref-more>summary{list-style:none;cursor:pointer;display:flex;justify-content:space-between;align-items:center}
.pref-more>summary::-webkit-details-marker{display:none}
.pref-more>summary .more{display:inline-flex;align-items:center;gap:4px;color:var(--label2);font-size:var(--fs-sub);font-weight:600}
.pref-more>summary svg{width:14px;height:14px;transform:rotate(90deg);transition:transform .2s}
.pref-more[open]>summary svg{transform:rotate(-90deg)}
.pref-more>summary.sh{font-family:var(--display);font-size:var(--fs-t3);font-weight:700;letter-spacing:-.02em;margin:32px 20px 10px;min-height:44px}
/* Accueil 4.0 : la séance de l'utilisateur d'abord, une seule action forte par écran */
.home-seg .seg{margin:4px var(--gutter) 14px}
.hero-sub{margin-top:8px;font-size:var(--fs-sub);line-height:1.4;color:rgba(244,243,241,.72)}
.hero.compose .hero-go{margin-top:20px}
.hero.done{flex-direction:row;align-items:center;gap:14px;padding:14px 16px;margin-bottom:16px}
.hero.done .hero-badge{margin:0;flex:none}
.hd-main{display:flex;flex-direction:column;align-items:flex-start;min-width:0;flex:1}
.hero.done .hero-title{font-size:var(--fs-t3);margin-top:2px;max-width:100%;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.hero.done .hero-meta{margin-top:2px}
.hero.done .hero-meta span{font-size:var(--fs-foot);color:rgba(244,243,241,.8)}
.hero.done .chev{flex:none;display:grid;opacity:.7}
.hero.done .chev svg{width:14px;height:14px}
.home>.backup-nudge{margin-top:28px}
.hero.done .hero-eyebrow{color:rgba(255,255,255,.88)}
/* Motivation 4.0 : « à battre » en séance */
.fc-beat{display:flex;align-items:center;justify-content:center;gap:7px;margin:12px auto 14px;max-width:100%;padding:7px 12px;border-radius:12px;font-size:var(--fs-sub);color:var(--label2);line-height:1.3;text-wrap:balance}
.fc-beat .ii{width:16px;height:16px;flex:none;color:var(--tint-ink)}
.fc-beat b{color:var(--label);font-weight:700;font-family:var(--num)}
.fc-beat small{font-size:var(--fs-foot);color:var(--label2)}
.fc-beat.win{background:color-mix(in srgb,var(--green) 15%,transparent);color:var(--label);font-weight:600}
.fc-beat.win.pop{animation:noteIn .35s cubic-bezier(.32,.72,0,1)}
.fc-beat.win .ii{color:var(--green)}
@media (prefers-reduced-motion:reduce){.fc-beat.win.pop{animation:none}}
/* Motivation 4.0 : prochain cap sur l'accueil */
.goal-line{display:flex;align-items:center;gap:12px;width:calc(100% - 2 * var(--gutter));margin:-4px var(--gutter) 16px;padding:12px 14px;border-radius:var(--r-card);background:var(--bg2);text-align:left;color:var(--label)}
.goal-line:active{transform:scale(.98)}
.gl-ic{width:34px;height:34px;flex:none;border-radius:11px;display:grid;place-items:center;background:var(--tint-bg);color:var(--tint-ink)}
.gl-ic .ii{width:18px;height:18px}
.gl-t{flex:1;min-width:0;font-size:var(--fs-sub);font-weight:600;line-height:1.3}
.gl-t small{display:block;font-size:var(--fs-cap);font-weight:600;letter-spacing:.05em;text-transform:uppercase;color:var(--label2);margin-bottom:2px}
.gl-ring{--p:0;width:28px;height:28px;flex:none;border-radius:50%;background:conic-gradient(var(--tint) calc(var(--p)*1%),var(--fill) 0);-webkit-mask:radial-gradient(circle,transparent 9px,#000 9.5px);mask:radial-gradient(circle,transparent 9px,#000 9.5px)}
/* Motivation 4.0 : indice de force */
.tr-hero{display:flex;align-items:baseline;gap:10px;margin:-2px 0 6px}
.tr-v{font-family:var(--num);font-weight:700;font-size:calc(40rem/17);line-height:1;letter-spacing:-.01em;color:var(--label)}
.tr-d{font-size:var(--fs-foot);font-weight:700;padding:3px 9px;border-radius:999px;background:var(--fill);color:var(--label2)}
.tr-d.up{background:color-mix(in srgb,var(--green) 16%,transparent);color:var(--label)}
.tr-line{display:flex;align-items:flex-start;gap:8px;margin-top:10px;font-size:var(--fs-sub);line-height:1.35;color:var(--label2)}
.tr-line .ii{flex:none;width:17px;height:17px;margin-top:1px;color:var(--tint-ink)}
.tr-line b{color:var(--label)}
/* Indice de force 4.0 : statut, régions, méthode */
.tr-h{display:flex;align-items:flex-start;justify-content:space-between;gap:10px}
.tr-how{position:relative;flex:none;width:28px;height:28px;border-radius:50%;background:var(--fill);color:var(--label2);font-family:Georgia,serif;font-style:italic;font-weight:700;font-size:15px}
.tr-how::before{content:"";position:absolute;inset:-8px}
.tr-status{display:flex;align-items:center;gap:8px;width:100%;margin:2px 0 8px;padding:8px 12px;border-radius:12px;background:var(--fill2);font-size:var(--fs-foot);color:var(--label2);text-align:left}
.tr-status b{color:var(--label);font-weight:700}
.tr-dot{width:10px;height:10px;flex:none;border-radius:50%;background:var(--sc,var(--label3))}
.st-green{--sc:var(--green)} .st-red{--sc:var(--red)} .st-orange{--sc:var(--orange)} .st-blue{--sc:var(--blue)} .st-teal{--sc:#30B0C7} .st-gray{--sc:#8E8E93}
.tr-regs{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:6px 14px;margin-top:10px}
.tr-reg{display:flex;align-items:center;gap:7px;font-size:var(--fs-foot);color:var(--label2);min-width:0}
.tr-reg i{width:10px;height:10px;flex:none;border-radius:3px;background:var(--rc)}
.tr-reg span{flex:1;min-width:0;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.tr-reg b{font-family:var(--num);font-weight:700;color:var(--label)}
.tr-reg em{display:grid;color:var(--red)} .tr-reg em .ii{width:14px;height:14px}
.tr-line .ii[class]{color:var(--tint-ink)}
.goal-line.warn .gl-ic{background:color-mix(in srgb,var(--red) 14%,transparent);color:var(--red)}
.how-body h3{font-size:var(--fs-callout);font-weight:700;margin:18px 20px 6px}
.how-body p{margin:0 20px;font-size:var(--fs-sub);line-height:1.45;color:var(--label2)}
.how-st{display:flex;gap:12px;align-items:flex-start;margin:4px 16px 0;padding:14px;border-radius:var(--r-card);background:var(--bg2)}
.how-st .tr-dot{margin-top:5px}
.how-st p{margin:4px 0 0}
.how-src{margin:4px 20px 0;padding-left:18px;font-size:var(--fs-foot);line-height:1.45;color:var(--label2)}
.how-src li{margin:6px 0}
.how-src a{color:var(--tint-ink)}
.how-body .hr-note{margin:16px 20px 24px}
/* Progrès > Muscles : stimulus par muscle (repères de Pelland et al.) */
.stim-sum{display:flex;gap:8px;flex-wrap:wrap;margin:-2px 0 4px}
.stim-sum span{font-size:var(--fs-foot);color:var(--label2);padding:4px 10px;border-radius:999px;background:var(--fill)}
.stim-sum b{color:var(--label);font-family:var(--num)}
.stim-sum .sz-ok{background:color-mix(in srgb,var(--green) 15%,transparent)}
/* Favoris (4.0) : une étoile, au même endroit partout */
:root{--fav:#C98A00}
@media (prefers-color-scheme:dark){ :root:not([data-theme="light"]){--fav:#FFD60A} }
:root[data-theme="dark"]{--fav:#FFD60A}
.hd-acts{display:flex;align-items:center;gap:4px;margin-left:auto;flex:none}
.te-hd .hd-acts{justify-self:end;margin-left:0}
.te-hd .t{text-align:center;min-width:0;overflow:hidden;text-overflow:ellipsis;white-space:nowrap}
.fav-toggle .ii{width:21px;height:21px;color:var(--label2);opacity:.8;transition:transform .2s,color .2s,opacity .2s}
.fav-toggle.on .ii{color:var(--fav);opacity:1;transform:scale(1.08)}
.fav-mark{display:inline-flex;vertical-align:-.1em;margin-right:5px}
.fav-mark .ii{width:14px;height:14px;color:var(--fav)}
.chip.fav .ii{width:14px;height:14px;margin-right:4px;vertical-align:-.12em;color:var(--fav)}
.chip.fav.on .ii{color:currentColor}
.pick-h.fav{color:var(--label)}

  "Si les coudes tombent, la barre glisse : réduis la charge et travaille la mobilité des poignets."],
["fente_arriere_barre","Fente arrière barre",["quadriceps","fessiers"],["barbell","rack"],"lunge",true,{sets:3,repsMin:6,repsMax:10,restSec:90},
  ["Barre sur le haut du dos, pieds largeur de hanches.","Recule d'un grand pas et descends jusqu'à ce que les deux genoux soient proches de 90°.","Reviens en poussant sur le talon avant."],
  "Garde le buste droit et commence léger : la barre rend l'équilibre plus délicat."],
["shrugs_barre","Shrugs barre",["dos"],["barbell"],"pull",false,{sets:3,repsMin:10,repsMax:15,restSec:60},
  ["Debout, barre tenue bras tendus devant les cuisses.","Monte les épaules vers les oreilles sans plier les coudes.","Tiens une seconde en haut puis redescends lentement."],
  "Ne fais pas rouler les épaules : un mouvement vertical suffit et épargne l'articulation."],
["good_morning_barre","Good morning barre",["ischios","fessiers","dos"],["barbell","rack"],"hinge",false,{sets:3,repsMin:8,repsMax:12,restSec:90},
  ["Barre sur le haut du dos, genoux légèrement fléchis.","Pousse les hanches en arrière en inclinant le buste, dos neutre.","Remonte en contractant fessiers et ischios."],
  "Exercice technique : commence avec la barre à vide et arrête la descente dès que le dos s'arrondit."],
["halo_kb","Halo kettlebell",["epaules","abdos"],["kettlebell"],"push",false,{sets:3,repsMin:6,repsMax:10,restSec:45},
  ["Kettlebell tenue par les cornes, à l'envers, devant la poitrine.","Fais-la tourner autour de la tête, au plus près, en gardant les abdos serrés.","Alterne le sens à chaque répétition."],
  "Prends une charge légère : c'est un exercice de mobilité et de stabilité d'épaule."],
["fente_goblet_kb","Fente arrière goblet kettlebell",["quadriceps","fessiers"],["kettlebell"],"lunge",true,{sets:3,repsMin:8,repsMax:12,restSec:75},
  ["Kettlebell tenue contre la poitrine, coudes serrés.","Recule d'un grand pas et descends genoux proches de 90°.","Reviens en poussant sur le talon avant."],
  "Garde le buste droit et la kettlebell près du corps."],
["swing_kb_uni","Swing kettlebell à une main",["fessiers","ischios","abdos"],["kettlebell"],"hinge",true,{sets:3,repsMin:10,repsMax:15,restSec:75},
  ["Kettlebell dans une main, pieds un peu plus larges que les hanches.","Bascule les hanches en arrière, puis projette-les vers l'avant pour propulser la kettlebell.","Garde les épaules de face malgré la charge d'un seul côté."],
  "Le mouvement vient des hanches, pas du bras ; maîtrise le swing à deux mains avant cette variante."],
["tirage_vertical_elastique","Tirage vertical élastique",["dos","biceps"],["bands"],"pull",false,{sets:3,repsMin:10,repsMax:15,restSec:60},
  ["Élastique fixé en hauteur, à genoux ou assis face au point d'ancrage.","Tire les mains vers le haut de la poitrine en abaissant les coudes.","Remonte les bras lentement en gardant la tension."],
  "Vérifie que l'ancrage est solide avant chaque série."],
["pallof_press","Pallof press élastique",["abdos"],["bands"],"core",true,{sets:3,repsMin:8,repsMax:12,restSec:45},
  ["Élastique fixé à hauteur de poitrine, debout de profil par rapport à l'ancrage.","Tends les bras devant toi en résistant à la rotation.","Tiens deux secondes, ramène les mains à la poitrine ; fais les deux côtés."],
  "Le buste ne doit pas tourner : éloigne-toi moins si tu n'arrives pas à rester de face."],
["souleve_elastique","Soulevé de terre élastique",["ischios","fessiers"],["bands"],"hinge",false,{sets:3,repsMin:12,repsMax:15,restSec:60},
  ["Debout sur l'élastique, pieds largeur de hanches, poignées en main.","Pousse les hanches en arrière, dos neutre, genoux légèrement fléchis.","Remonte en contractant les fessiers."],
  "Garde l'élastique sous le milieu des pieds pour qu'il ne glisse pas."],
["kickback_fessier_elastique","Kickback fessier élastique",["fessiers"],["bands"],"hinge",true,{sets:3,repsMin:12,repsMax:15,restSec:45},
  ["À quatre pattes, élastique autour des pieds ou fixé à une cheville.","Pousse une jambe vers l'arrière et le haut, genou fléchi ou tendu.","Redescends contrôlé ; fais toutes les reps puis change de côté."],
  "Ne cambre pas le bas du dos pour monter plus haut : l'amplitude vient de la hanche."],
["tractions_negatives","Tractions négatives",["dos","biceps"],["bodyweight","pullup_bar"],"pull",false,{sets:3,repsMin:3,repsMax:6,restSec:90},
  ["Monte en haut de la barre à l'aide d'un support, menton au-dessus.","Descends le plus lentement possible (3 à 5 s) jusqu'à bras tendus.","Reprends appui sur le support pour remonter."],
  "Idéal pour progresser vers la traction ; arrête quand la descente n'est plus contrôlée."],
["releve_jambes_suspendu","Relevé de jambes tendues suspendu",["abdos"],["bodyweight","pullup_bar"],"core",false,{sets:3,repsMin:6,repsMax:12,restSec:75},
  ["Suspendu à la barre, épaules engagées, corps immobile.","Monte les jambes tendues jusqu'à l'horizontale ou plus haut.","Redescends lentement sans te balancer."],
  "Si tu te balances, reviens au relevé de genoux suspendu."],
// --- ajouts v2.2 : nouveaux équipements ---
["roue_abdo_genoux","Roue abdominale à genoux",["abdos","dos"],["ab_roller"],"core",false,{sets:3,repsMin:6,repsMax:12,restSec:60},
  ["À genoux sur un tapis, mains sur la roue sous les épaules, bassin légèrement rentré.","Roule vers l'avant en gardant le dos plat, aussi loin que tu restes gainé.","Reviens en tirant avec les abdos, sans creuser le bas du dos."],
  "Commence par une amplitude courte (15 à 20 cm) et allonge progressivement : le bas du dos ne doit jamais se cambrer."],
["roue_abdo_debout","Roue abdominale debout",["abdos","dos","epaules"],["ab_roller"],"core",false,{sets:3,repsMin:3,repsMax:8,restSec:90},
  ["Debout, jambes tendues, pose la roue au sol devant tes pieds.","Roule vers l'avant jusqu'à la limite où tu restes parfaitement gainé.","Reviens sans plier les hanches en premier."],
  "Variante très avancée : maîtrise d'abord 12 roulés complets à genoux."],
["dips_barres","Dips aux barres parallèles",["triceps","pect","epaules"],["dip_bars"],"push",false,{sets:3,repsMin:5,repsMax:12,restSec:90},
  ["En appui bras tendus, épaules basses, buste légèrement penché.","Descends jusqu'à ce que les bras soient proches de l'horizontale.","Pousse pour revenir bras tendus, sans balancer."],
  "Ne descends pas plus bas qu'un angle confortable pour l'épaule ; commence par des descentes lentes si besoin."],
["releve_genoux_barres","Relevé de genoux aux barres parallèles",["abdos"],["dip_bars"],"core",false,{sets:3,repsMin:8,repsMax:15,restSec:60},
  ["En appui sur les avant-bras ou bras tendus, dos contre le dossier si ta station en a un.","Monte les genoux vers la poitrine en enroulant le bassin.","Redescends lentement sans te balancer."],
  "Garde les épaules basses et actives pendant tout l'exercice."],
["l_sit","L-sit aux barres parallèles",["abdos","triceps"],["dip_bars"],"core",false,{sets:3,repsMin:10,repsMax:30,restSec:75},
  ["En appui bras tendus, épaules basses.","Monte les jambes tendues à l'horizontale (ou genoux fléchis pour débuter).","Tiens la position en respirant (durée en secondes)."],
  "Exercice avancé : commence genoux fléchis (tuck) et allonge les jambes avec le temps."],
["rowing_sangles","Rowing aux sangles",["dos","biceps"],["suspension"],"pull",false,{sets:3,repsMin:8,repsMax:15,restSec:60},
  ["Poignées en main, corps droit et incliné vers l'arrière, pieds devant.","Tire la poitrine vers les mains en serrant les omoplates.","Redescends contrôlé jusqu'aux bras tendus."],
  "Plus tu avances les pieds, plus c'est difficile : règle l'inclinaison pour rester dans la fourchette de répétitions."],
["pompes_sangles","Pompes aux sangles",["pect","triceps","epaules"],["suspension"],"push",false,{sets:3,repsMin:8,repsMax:15,restSec:75},
  ["Mains dans les poignées, corps incliné et aligné.","Descends en ouvrant les bras jusqu'à ce que les mains arrivent à hauteur de poitrine.","Pousse en gardant les sangles près du corps."],
  "L'instabilité rend l'exercice exigeant pour les épaules : commence debout, peu incliné."],
["squat_sangles","Squat unilatéral assisté aux sangles",["quadriceps","fessiers"],["suspension"],"squat",true,{sets:3,repsMin:6,repsMax:12,restSec:75},
  ["Poignées en main, en appui sur une jambe, l'autre tendue devant.","Descends en arrière, les sangles t'aidant à garder l'équilibre.","Remonte en poussant sur le talon."],
  "Utilise les bras seulement pour l'équilibre, pas pour te tirer vers le haut."],
["curl_sangles","Curl biceps aux sangles",["biceps"],["suspension"],"pull",false,{sets:3,repsMin:10,repsMax:15,restSec:60},
  ["Face au point d'ancrage, paumes vers le haut, bras tendus devant.","Plie les coudes pour amener les mains vers le front, coudes fixes.","Redescends lentement."],
  "Garde le corps gainé comme une planche pendant tout le mouvement."],
["fallout_sangles","Roll-out aux sangles",["abdos","epaules"],["suspension"],"core",false,{sets:3,repsMin:6,repsMax:12,restSec:60},
  ["Debout, poignées en main, bras tendus devant, corps incliné.","Monte les bras au-dessus de la tête en laissant le corps descendre vers l'avant.","Reviens en tirant avec les abdos, sans creuser le dos."],
  "Réduis l'amplitude si le bas du dos se creuse."],
["rowing_inverse_barre","Rowing inversé à la barre",["dos","biceps"],["barbell","rack"],"pull",false,{sets:3,repsMin:6,repsMax:15,restSec:75},
  ["Barre posée sur les supports à hauteur de hanche, allongé dessous.","Corps droit, tire la poitrine vers la barre.","Redescends contrôlé bras tendus."],
  "Vérifie que la barre est bien calée sur les supports avant de t'y suspendre."],
["tractions_scapulaires","Tractions scapulaires",["dos"],["bodyweight","pullup_bar"],"pull",false,{sets:3,repsMin:8,repsMax:12,restSec:60},
  ["Suspendu bras tendus.","Sans plier les coudes, abaisse et rapproche les omoplates pour monter de quelques centimètres.","Relâche lentement."],
  "Excellent point de départ avant les tractions complètes, et bon échauffement des épaules."],
["corde_a_sauter","Corde à sauter",["cardio","mollets"],["jump_rope"],"core",false,{sets:3,repsMin:30,repsMax:60,restSec:45},
  ["Coudes près du corps, la rotation vient des poignets.","Petits sauts sur l'avant des pieds.","Garde un rythme régulier pendant la durée (en secondes)."],
  "Sur un sol souple de préférence ; réduis la durée si les mollets ou les tibias sont sensibles."],
// v3.0 : exercices « maison » sans matériel (une chaise, une table ou un rebord suffisent)
["dips_chaise","Dips sur chaise ou banc",["triceps","epaules","pect"],["bodyweight"],"push",false,{sets:3,repsMin:8,repsMax:15,restSec:60},
  ["Mains sur le rebord d'une chaise stable ou d'un banc (ou d'un canapé, d'une marche), doigts vers l'avant, jambes devant toi.","Descends en pliant les coudes vers l'arrière jusqu'à ~90°, dos proche du rebord.","Remonte en poussant sur les paumes jusqu'à tendre les bras, sans verrouiller brutalement."],
  "Chaise calée contre un mur. Ne descends pas plus bas que 90° au coude si l'avant de l'épaule tire ; genoux pliés = plus facile, jambes tendues = plus dur."],
["extension_triceps_sol","Extension triceps au sol (sphinx)",["triceps"],["bodyweight"],"push",false,{sets:3,repsMin:8,repsMax:12,restSec:60},
  ["En appui sur les avant-bras, comme en planche, mains sous les épaules.","Pousse dans les paumes pour décoller les coudes du sol jusqu'à tendre les bras.","Redescends lentement sur les avant-bras en gardant le corps gainé."],
  "Commence sur les genoux si le mouvement est trop dur ; garde les coudes serrés et le bassin aligné."],
["pompes_hindoues","Pompes hindoues",["pect","epaules","triceps"],["bodyweight"],"push",false,{sets:3,repsMin:6,repsMax:12,restSec:75},
  ["Départ en V inversé, bassin haut, bras tendus.","Plonge vers l'avant en frôlant le sol avec la poitrine, comme pour passer sous une barrière.","Termine buste relevé, bras tendus, bassin bas, puis reviens en V inversé."],
  "Mouvement fluide et contrôlé ; en cas de gêne dans le bas du dos, limite l'extension en fin de mouvement."],
["rowing_table","Rowing inversé sous une table",["dos","biceps"],["bodyweight"],"pull",false,{sets:3,repsMin:6,repsMax:12,restSec:75},
  ["Allongé sous une table solide, mains au bord, bras tendus.","Corps gainé, tire la poitrine vers le bord en serrant les omoplates.","Redescends lentement jusqu'à bras tendus."],
  "Vérifie que la table ne bascule pas (lourde, pieds stables) avant la première répétition. Genoux pliés = plus facile."],
["montees_chaise","Montées sur chaise (step-up)",["quadriceps","fessiers"],["bodyweight"],"lunge",true,{sets:3,repsMin:8,repsMax:12,restSec:60},
  ["Pied entier sur une chaise stable ou une marche.","Monte en poussant sur le talon de la jambe du dessus, sans t'élancer avec l'autre.","Redescends contrôlé, puis enchaîne du même côté avant de changer."],
  "Chaise calée contre un mur, jamais sur roulettes. Une marche d'escalier est plus sûre pour commencer."],
["nordic_curl","Nordic curl assisté",["ischios","fessiers"],["bodyweight"],"hinge",false,{sets:3,repsMin:4,repsMax:8,restSec:90},
  ["À genoux sur un coussin, chevilles bloquées sous un canapé ou tenues.","Corps droit des genoux à la tête, bascule lentement vers l'avant en freinant avec les ischios.","Amortis avec les mains au sol, puis repousse pour revenir."],
  "Exercice exigeant : descends seulement jusqu'où tu contrôles, et augmente l'amplitude progressivement."],
// v3.1 : étirements (retour au calme). Mesurés en secondes, jamais comptés comme du travail de
// force (séries, volume, muscles travaillés, récupération) : voir isStretch et finalizeSession.
["etir_ischios","Étirement des ischio-jambiers",["ischios","mollets"],["bodyweight"],"stretch",false,{sets:1,repsMin:30,repsMax:45,restSec:10},
  ["Debout, pieds à largeur de hanches, genoux souples.","Bascule le buste vers l'avant dos long, mains qui glissent vers les tibias.","Relâche la nuque et respire lentement pendant le maintien (durée en secondes)."],
  "Tu dois sentir un étirement sous la cuisse, jamais une douleur dans le bas du dos : plie les genoux au besoin."],
["etir_quadriceps","Étirement des quadriceps (debout)",["quadriceps"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Debout, une main contre un mur pour l'équilibre.","Attrape la cheville et rapproche le talon des fessiers, genoux côte à côte.","Bassin légèrement rentré, maintiens puis change de côté (durée en secondes)."],
  "Ne tire pas sur le genou : s'il gêne, attrape plutôt le bas du pantalon ou utilise une serviette."],
["etir_fessiers","Étirement des fessiers (en 4)",["fessiers"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Allongé sur le dos, pose une cheville sur le genou opposé.","Attrape l'arrière de la cuisse d'appui et ramène les jambes vers toi.","Garde la tête et les épaules au sol, puis change de côté (durée en secondes)."],
  "À éviter en cas de douleur de hanche ou de genou : réduis l'amplitude plutôt que de forcer."],
["etir_mollets","Étirement des mollets (au mur)",["mollets"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Face à un mur, mains en appui, un pied reculé.","Talon arrière au sol, jambe arrière tendue, avance le bassin vers le mur.","Maintiens puis change de côté (durée en secondes)."],
  "Le talon arrière reste au sol et le pied pointe vers le mur ; tu ne dois ressentir aucune douleur au tendon d'Achille."],
["etir_pectoraux","Étirement des pectoraux (encadrement de porte)",["pect","epaules"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Avant-bras contre le montant d'une porte, coude à hauteur d'épaule.","Avance doucement le buste jusqu'à sentir l'étirement devant l'épaule.","Garde les épaules basses, puis change de côté (durée en secondes)."],
  "Amplitude modérée si l'épaule est sensible ; arrête à la moindre sensation de pincement."],
["etir_enfant","Posture de l'enfant (dos)",["dos"],["bodyweight"],"stretch",false,{sets:1,repsMin:30,repsMax:60,restSec:10},
  ["À genoux, fessiers vers les talons.","Allonge les bras loin devant, front vers le sol.","Respire dans le dos et relâche les épaules (durée en secondes)."],
  "Glisse un coussin entre fessiers et talons si les genoux tirent."],
["etir_epaules","Étirement des épaules (bras croisé)",["epaules"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Debout, passe un bras tendu devant la poitrine.","Avec l'autre main, ramène-le doucement au-dessus du coude.","Épaule basse, maintiens puis change de côté (durée en secondes)."],
  "Tire au-dessus du coude, jamais sur l'articulation."],
["etir_triceps","Étirement des triceps (bras derrière la tête)",["triceps"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Lève un bras, plie le coude et laisse la main descendre entre les omoplates.","Avec l'autre main, pousse doucement le coude vers l'arrière.","Tête droite, maintiens puis change de côté (durée en secondes)."],
  "Garde le dos droit, sans cambrer ; amplitude modérée si l'épaule est sensible."],
["etir_avantbras","Étirement des avant-bras (poignets)",["avantbras","biceps"],["bodyweight"],"stretch",true,{sets:2,repsMin:20,repsMax:30,restSec:10},
  ["Bras tendu devant toi, paume vers le haut.","Avec l'autre main, tire doucement les doigts vers le bas.","Maintiens, puis paume vers le bas, puis change de bras (durée en secondes)."],
  "Tension légère seulement : le poignet est une articulation fragile."],
["etir_psoas","Étirement des fléchisseurs de hanche (fente basse)",["quadriceps","fessiers"],["bodyweight"],"stretch",true,{sets:2,repsMin:30,repsMax:45,restSec:10},
  ["Genou arrière posé sur un coussin, pied avant loin devant.","Rentre le bassin et avance-le doucement jusqu'à sentir l'avant de la hanche.","Buste droit, maintiens puis change de côté (durée en secondes)."],
  "Le genou avant ne dépasse pas trop la pointe du pied ; place un coussin sous le genou au sol."],
["etir_cobra","Cobra (abdominaux)",["abdos"],["bodyweight"],"stretch",false,{sets:1,repsMin:20,repsMax:30,restSec:10},
  ["Allongé sur le ventre, mains sous les épaules.","Redresse doucement le buste, bassin au sol, épaules loin des oreilles.","Respire lentement pendant le maintien (durée en secondes)."],
  "Arrête avant toute gêne dans le bas du dos : garde les coudes légèrement pliés si besoin."],
["etir_chat_vache","Chat-vache (mobilité du dos)",["dos","abdos"],["bodyweight"],"stretch",false,{sets:1,repsMin:30,repsMax:60,restSec:10},
  ["À quatre pattes, mains sous les épaules, genoux sous les hanches.","Inspire en creusant le dos, regard vers l'avant ; expire en l'arrondissant, menton vers la poitrine.","Enchaîne lentement au rythme de la respiration (durée en secondes)."],
  "Mouvement doux et sans à-coups, dans une amplitude confortable."],

// ---- 4.0 : Pilates et poids du corps (au sol, sans matériel) ----
["pilates_cent","Le Cent (Pilates)",["abdos"],["bodyweight"],"core",false,{sets:2,repsMin:30,repsMax:60,restSec:30},
  ["Allongé sur le dos, jambes en table (genoux à 90°), ou tendues à 45° pour plus de difficulté.","Décolle la tête et les épaules, bras tendus le long du corps à quelques centimètres du sol.","Bats des bras par petits mouvements rapides : inspire sur 5 battements, expire sur 5 (durée en secondes)."],
  "Le bas du dos reste plaqué au sol ; si la nuque tire, repose la tête entre les séries."],
["enroule_pilates","Enroulé de colonne (roll-up)",["abdos"],["bodyweight"],"core",false,{sets:3,repsMin:6,repsMax:10,restSec:45},
  ["Allongé sur le dos, jambes tendues, bras tendus au-dessus de la tête.","Expire et enroule la colonne vertèbre par vertèbre jusqu'à t'asseoir, bras vers les pieds.","Redéroule lentement jusqu'au sol en contrôlant la descente."],
  "Si tu ne montes pas sans élan, plie les genoux ou n'enroule que la moitié du trajet."],
["cercles_jambe","Cercles de jambe (Pilates)",["abdos","fessiers"],["bodyweight"],"core",true,{sets:2,repsMin:6,repsMax:10,restSec:30},
  ["Allongé sur le dos, une jambe tendue vers le plafond, l'autre allongée au sol.","Dessine des cercles de la taille d'un ballon avec la jambe levée, bassin immobile.","Fais les cercles dans un sens puis dans l'autre, puis change de jambe."],
  "Réduis la taille des cercles si le bassin bascule ou si le bas du dos se cambre."],
["teaser_pilates","Teaser (Pilates)",["abdos"],["bodyweight"],"core",false,{sets:3,repsMin:4,repsMax:8,restSec:45},
  ["Assis en équilibre sur les ischions, jambes tendues à 45°, bras tendus vers les pieds : le corps forme un V.","Déroule le dos vers le sol en gardant les jambes en l'air.","Remonte en V en expirant, sans à-coup."],
  "Exercice avancé : commence genoux pliés, pieds posés au sol, et ne déroule qu'à mi-chemin."],
["nage_pilates","Nage au sol (swimming)",["dos","fessiers"],["bodyweight"],"core",false,{sets:3,repsMin:20,repsMax:30,restSec:30},
  ["Allongé sur le ventre, bras tendus devant, jambes tendues.","Décolle légèrement les bras, le buste et les jambes, regard vers le sol.","Bats bras et jambes opposés en alternance, par petits mouvements rapides (durée en secondes)."],
  "Allonge-toi plus que tu ne te cambres : la nuque reste dans le prolongement du dos."],
["coquillage","Coquillage (clamshell)",["fessiers"],["bodyweight"],"hinge",true,{sets:3,repsMin:12,repsMax:20,restSec:30},
  ["Allongé sur le côté, genoux pliés à 90°, talons alignés avec les fesses.","Pieds collés, ouvre le genou du dessus comme un coquillage.","Referme lentement sans laisser le bassin rouler en arrière, puis change de côté."],
  "Bassin bien empilé : s'il bascule en arrière, réduis l'amplitude."],
["elevation_jambe_cote","Élévation latérale de jambe (allongé)",["fessiers"],["bodyweight"],"hinge",true,{sets:3,repsMin:12,repsMax:20,restSec:30},
  ["Allongé sur le côté, jambes tendues dans l'alignement du corps, tête posée sur le bras.","Lève la jambe du dessus jusqu'à hauteur de hanche, pointe de pied vers l'avant.","Redescends sans la poser, puis change de côté."],
  "Ne monte pas trop haut : au-delà, c'est le bas du dos qui travaille."],
