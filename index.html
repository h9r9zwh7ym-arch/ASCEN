 \xE0 l'aide d'un support, menton au-dessus.","Descends le plus lentement possible (3 \xE0 5 s) jusqu'\xE0 bras tendus.","Reprends appui sur le support pour remonter."],"Id\xE9al pour progresser vers la traction ; arr\xEAte quand la descente n'est plus contr\xF4l\xE9e."],["releve_jambes_suspendu","Relev\xE9 de jambes tendues suspendu",["abdos"],["bodyweight","pullup_bar"],"core",!1,{sets:3,repsMin:6,repsMax:12,restSec:75},["Suspendu \xE0 la barre, \xE9paules engag\xE9es, corps immobile.","Monte les jambes tendues jusqu'\xE0 l'horizontale ou plus haut.","Redescends lentement sans te balancer."],"Si tu te balances, reviens au relev\xE9 de genoux suspendu."],["roue_abdo_genoux","Roue abdominale \xE0 genoux",["abdos","dos"],["ab_roller"],"core",!1,{sets:3,repsMin:6,repsMax:12,restSec:60},["\xC0 genoux sur un tapis, mains sur la roue sous les \xE9paules, bassin l\xE9g\xE8rement rentr\xE9.","Roule vers l'avant en gardant le dos plat, aussi loin que tu restes gain\xE9.","Reviens en tirant avec les abdos, sans creuser le bas du dos."],"Commence par une amplitude courte (15 \xE0 20 cm) et allonge progressivement : le bas du dos ne doit jamais se cambrer."],["roue_abdo_debout","Roue abdominale debout",["abdos","dos","epaules"],["ab_roller"],"core",!1,{sets:3,repsMin:3,repsMax:8,restSec:90},["Debout, jambes tendues, pose la roue au sol devant tes pieds.","Roule vers l'avant jusqu'\xE0 la limite o\xF9 tu restes parfaitement gain\xE9.","Reviens sans plier les hanches en premier."],"Variante tr\xE8s avanc\xE9e : ma\xEEtrise d'abord 12 roul\xE9s complets \xE0 genoux."],["dips_barres","Dips aux barres parall\xE8les",["triceps","pect","epaules"],["dip_bars"],"push",!1,{sets:3,repsMin:5,repsMax:12,restSec:90},["En appui bras tendus, \xE9paules basses, buste l\xE9g\xE8rement pench\xE9.","Descends jusqu'\xE0 ce que les bras soient proches de l'horizontale.","Pousse pour revenir bras tendus, sans balancer."],"Ne descends pas plus bas qu'un angle confortable pour l'\xE9paule ; commence par des descentes lentes si besoin."],["releve_genoux_barres","Relev\xE9 de genoux aux barres parall\xE8les",["abdos"],["dip_bars"],"core",!1,{sets:3,repsMin:8,repsMax:15,restSec:60},["En appui sur les avant-bras ou bras tendus, dos contre le dossier si ta station en a un.","Monte les genoux vers la poitrine en enroulant le bassin.","Redescends lentement sans te balancer."],"Garde les \xE9paules basses et actives pendant tout l'exercice."],["l_sit","L-sit aux barres parall\xE8les",["abdos","triceps"],["dip_bars"],"core",!1,{sets:3,repsMin:10,repsMax:30,restSec:75},["En appui bras tendus, \xE9paules basses.","Monte les jambes tendues \xE0 l'horizontale (ou genoux fl\xE9chis pour d\xE9buter).","Tiens la position en respirant (dur\xE9e en secondes)."],"Exercice avanc\xE9 : commence genoux fl\xE9chis (tuck) et allonge les jambes avec le temps."],["rowing_sangles","Rowing aux sangles",["dos","biceps"],["suspension"],"pull",!1,{sets:3,repsMin:8,repsMax:15,restSec:60},["Poign\xE9es en main, corps droit et inclin\xE9 vers l'arri\xE8re, pieds devant.","Tire la poitrine vers les mains en serrant les omoplates.","Redescends contr\xF4l\xE9 jusqu'aux bras tendus."],"Plus tu avances les pieds, plus c'est difficile : r\xE8gle l'inclinaison pour rester dans la fourchette de r\xE9p\xE9titions."],["pompes_sangles","Pompes aux sangles",["pect","triceps","epaules"],["suspension"],"push",!1,{sets:3,repsMin:8,repsMax:15,restSec:75},["Mains dans les poign\xE9es, corps inclin\xE9 et align\xE9.","Descends en ouvrant les bras jusqu'\xE0 ce que les mains arrivent \xE0 hauteur de poitrine.","Pousse en gardant les sangles pr\xE8s du corps."],"L'instabilit\xE9 rend l'exercice exigeant pour les \xE9paules : commence debout, peu inclin\xE9."],["squat_sangles","Squat unilat\xE9ral assist\xE9 aux sangles",["quadriceps","fessiers"],["suspension"],"squat",!0,{sets:3,repsMin:6,repsMax:12,restSec:75},["Poign\xE9es en main, en appui sur une jambe, l'autre tendue devant.","Descends en arri\xE8re, les sangles t'aidant \xE0 garder l'\xE9quilibre.","Remonte en poussant sur le talon."],"Utilise les bras seulement pour l'\xE9quilibre, pas pour te tirer vers le haut."],["curl_sangles","Curl biceps aux sangles",["biceps"],["suspension"],"pull",!1,{sets:3,repsMin:10,repsMax:15,restSec:60},["Face au point d'ancrage, paumes vers le haut, bras tendus devant.","Plie les coudes pour amener les mains vers le front, coudes fixes.","Redescends lentement."],"Garde le corps gain\xE9 comme une planche pendant tout le mouvement."],["fallout_sangles","Roll-out aux sangles",["abdos","epaules"],["suspension"],"core",!1,{sets:3,repsMin:6,repsMax:12,restSec:60},["Debout, poign\xE9es en main, bras tendus devant, corps inclin\xE9.","Monte les bras au-dessus de la t\xEAte en laissant le corps descendre vers l'avant.","Reviens en tirant avec les abdos, sans creuser le dos."],"R\xE9duis l'amplitude si le bas du dos se creuse."],["rowing_inverse_barre","Rowing invers\xE9 \xE0 la barre",["dos","biceps"],["barbell","rack"],"pull",!1,{sets:3,repsMin:6,repsMax:15,restSec:75},["Barre pos\xE9e sur les supports \xE0 hauteur de hanche, allong\xE9 dessous.","Corps droit, tire la poitrine vers la barre.","Redescends contr\xF4l\xE9 bras tendus."],"V\xE9rifie que la barre est bien cal\xE9e sur les supports avant de t'y suspendre."],["tractions_scapulaires","Tractions scapulaires",["dos"],["bodyweight","pullup_bar"],"pull",!1,{sets:3,repsMin:8,repsMax:12,restSec:60},["Suspendu bras tendus.","Sans plier les coudes, abaisse et rapproche les omoplates pour monter de quelques centim\xE8tres.","Rel\xE2che lentement."],"Excellent point de d\xE9part avant les tractions compl\xE8tes, et bon \xE9chauffement des \xE9paules."],["corde_a_sauter","Corde \xE0 sauter",["cardio","mollets"],["jump_rope"],"core",!1,{sets:3,repsMin:30,repsMax:60,restSec:45},["Coudes pr\xE8s du corps, la rotation vient des poignets.","Petits sauts sur l'avant des pieds.","Garde un rythme r\xE9gulier pendant la dur\xE9e (en secondes)."],"Sur un sol souple de pr\xE9f\xE9rence ; r\xE9duis la dur\xE9e si les mollets ou les tibias sont sensibles."],["dips_chaise","Dips sur chaise ou banc",["triceps","epaules","pect"],["bodyweight"],"push",!1,{sets:3,repsMin:8,repsMax:15,restSec:60},["Mains sur le rebord d'une chaise stable ou d'un banc (ou d'un canap\xE9, d'une marche), doigts vers l'avant, jambes devant toi.","Descends en pliant les coudes vers l'arri\xE8re jusqu'\xE0 ~90\xB0, dos proche du rebord.","Remonte en poussant sur les paumes jusqu'\xE0 tendre les bras, sans verrouiller brutalement."],"Chaise cal\xE9e contre un mur. Ne descends pas plus bas que 90\xB0 au coude si l'avant de l'\xE9paule tire ; genoux pli\xE9s = plus facile, jambes tendues = plus dur."],["extension_triceps_sol","Extension triceps au sol (sphinx)",["triceps"],["bodyweight"],"push",!1,{sets:3,repsMin:8,repsMax:12,restSec:60},["En appui sur les avant-bras, comme en planche, mains sous les \xE9paules.","Pousse dans les paumes pour d\xE9coller les coudes du sol jusqu'\xE0 tendre les bras.","Redescends lentement sur les avant-bras en gardant le corps gain\xE9."],"Commence sur les genoux si le mouvement est trop dur ; garde les coudes serr\xE9s et le bassin align\xE9."],["pompes_hindoues","Pompes hindoues",["pect","epaules","triceps"],["bodyweight"],"push",!1,{sets:3,repsMin:6,repsMax:12,restSec:75},["D\xE9part en V invers\xE9, bassin haut, bras tendus.","Plonge vers l'avant en fr\xF4lant le sol avec la poitrine, comme pour passer sous une barri\xE8re.","Termine buste relev\xE9, bras tendus, bassin bas, puis reviens en V invers\xE9."],"Mouvement fluide et contr\xF4l\xE9 ; en cas de g\xEAne dans le bas du dos, limite l'extension en fin de mouvement."],["rowing_table","Rowing invers\xE9 sous une table",["dos","biceps"],["bodyweight"],"pull",!1,{sets:3,repsMin:6,repsMax:12,restSec:75},["Allong\xE9 sous une table solide, mains au bord, bras tendus.","Corps gain\xE9, tire la poitrine vers le bord en serrant les omoplates.","Redescends lentement jusqu'\xE0 bras tendus."],"V\xE9rifie que la table ne bascule pas (lourde, pieds stables) avant la premi\xE8re r\xE9p\xE9tition. Genoux pli\xE9s = plus facile."],["montees_chaise","Mont\xE9es sur chaise (step-up)",["quadriceps","fessiers"],["bodyweight"],"lunge",!0,{sets:3,repsMin:8,repsMax:12,restSec:60},["Pied entier sur une chaise stable ou une marche.","Monte en poussant sur le talon de la jambe du dessus, sans t'\xE9lancer avec l'autre.","Redescends contr\xF4l\xE9, puis encha\xEEne du m\xEAme c\xF4t\xE9 avant de changer."],"Chaise cal\xE9e contre un mur, jamais sur roulettes. Une marche d'escalier est plus s\xFBre pour commencer."],["nordic_curl","Nordic curl assist\xE9",["ischios","fessiers"],["bodyweight"],"hinge",!1,{sets:3,repsMin:4,repsMax:8,restSec:90},["\xC0 genoux sur un coussin, chevilles bloqu\xE9es sous un canap\xE9 ou tenues.","Corps droit des genoux \xE0 la t\xEAte, bascule lentement vers l'avant en freinant avec les ischios.","Amortis avec les mains au sol, puis repousse pour revenir."],"Exercice exigeant : descends seulement jusqu'o\xF9 tu contr\xF4les, et augmente l'amplitude progressivement."],["etir_ischios","\xC9tirement des ischio-jambiers",["ischios","mollets"],["bodyweight"],"stretch",!1,{sets:1,repsMin:30,repsMax:45,restSec:10},["Debout, pieds \xE0 largeur de hanches, genoux souples.","Bascule le buste vers l'avant dos long, mains qui glissent vers les tibias.","Rel\xE2che la nuque et respire lentement pendant le maintien (dur\xE9e en secondes)."],"Tu dois sentir un \xE9tirement sous la cuisse, jamais une douleur dans le bas du dos : plie les genoux au besoin."],["etir_quadriceps","\xC9tirement des quadriceps (debout)",["quadriceps"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Debout, une main contre un mur pour l'\xE9quilibre.","Attrape la cheville et rapproche le talon des fessiers, genoux c\xF4te \xE0 c\xF4te.","Bassin l\xE9g\xE8rement rentr\xE9, maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Ne tire pas sur le genou : s'il g\xEAne, attrape plut\xF4t le bas du pantalon ou utilise une serviette."],["etir_fessiers","\xC9tirement des fessiers (en 4)",["fessiers"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Allong\xE9 sur le dos, pose une cheville sur le genou oppos\xE9.","Attrape l'arri\xE8re de la cuisse d'appui et ram\xE8ne les jambes vers toi.","Garde la t\xEAte et les \xE9paules au sol, puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"\xC0 \xE9viter en cas de douleur de hanche ou de genou : r\xE9duis l'amplitude plut\xF4t que de forcer."],["etir_mollets","\xC9tirement des mollets (au mur)",["mollets"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Face \xE0 un mur, mains en appui, un pied recul\xE9.","Talon arri\xE8re au sol, jambe arri\xE8re tendue, avance le bassin vers le mur.","Maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Le talon arri\xE8re reste au sol et le pied pointe vers le mur ; tu ne dois ressentir aucune douleur au tendon d'Achille."],["etir_pectoraux","\xC9tirement des pectoraux (encadrement de porte)",["pect","epaules"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Avant-bras contre le montant d'une porte, coude \xE0 hauteur d'\xE9paule.","Avance doucement le buste jusqu'\xE0 sentir l'\xE9tirement devant l'\xE9paule.","Garde les \xE9paules basses, puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Amplitude mod\xE9r\xE9e si l'\xE9paule est sensible ; arr\xEAte \xE0 la moindre sensation de pincement."],["etir_enfant","Posture de l'enfant (dos)",["dos"],["bodyweight"],"stretch",!1,{sets:1,repsMin:30,repsMax:60,restSec:10},["\xC0 genoux, fessiers vers les talons.","Allonge les bras loin devant, front vers le sol.","Respire dans le dos et rel\xE2che les \xE9paules (dur\xE9e en secondes)."],"Glisse un coussin entre fessiers et talons si les genoux tirent."],["etir_epaules","\xC9tirement des \xE9paules (bras crois\xE9)",["epaules"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Debout, passe un bras tendu devant la poitrine.","Avec l'autre main, ram\xE8ne-le doucement au-dessus du coude.","\xC9paule basse, maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Tire au-dessus du coude, jamais sur l'articulation."],["etir_triceps","\xC9tirement des triceps (bras derri\xE8re la t\xEAte)",["triceps"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["L\xE8ve un bras, plie le coude et laisse la main descendre entre les omoplates.","Avec l'autre main, pousse doucement le coude vers l'arri\xE8re.","T\xEAte droite, maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Garde le dos droit, sans cambrer ; amplitude mod\xE9r\xE9e si l'\xE9paule est sensible."],["etir_avantbras","\xC9tirement des avant-bras (poignets)",["avantbras","biceps"],["bodyweight"],"stretch",!0,{sets:2,repsMin:20,repsMax:30,restSec:10},["Bras tendu devant toi, paume vers le haut.","Avec l'autre main, tire doucement les doigts vers le bas.","Maintiens, puis paume vers le bas, puis change de bras (dur\xE9e en secondes)."],"Tension l\xE9g\xE8re seulement : le poignet est une articulation fragile."],["etir_psoas","\xC9tirement des fl\xE9chisseurs de hanche (fente basse)",["quadriceps","fessiers"],["bodyweight"],"stretch",!0,{sets:2,repsMin:30,repsMax:45,restSec:10},["Genou arri\xE8re pos\xE9 sur un coussin, pied avant loin devant.","Rentre le bassin et avance-le doucement jusqu'\xE0 sentir l'avant de la hanche.","Buste droit, maintiens puis change de c\xF4t\xE9 (dur\xE9e en secondes)."],"Le genou avant ne d\xE9passe pas trop la pointe du pied ; place un coussin sous le genou au sol."],["etir_cobra","Cobra (abdominaux)",["abdos"],["bodyweight"],"stretch",!1,{sets:1,repsMin:20,repsMax:30,restSec:10},["Allong\xE9 sur le ventre, mains sous les \xE9paules.","Redresse doucement le buste, bassin au sol, \xE9paules loin des oreilles.","Respire lentement pendant le maintien (dur\xE9e en secondes)."],"Arr\xEAte avant toute g\xEAne dans le bas du dos : garde les coudes l\xE9g\xE8rement pli\xE9s si besoin."],["etir_chat_vache","Chat-vache (mobilit\xE9 du dos)",["dos","abdos"],["bodyweight"],"stretch",!1,{sets:1,repsMin:30,repsMax:60,restSec:10},["\xC0 quatre pattes, mains sous les \xE9paules, genoux sous les hanches.","Inspire en creusant le dos, regard vers l'avant ; expire en l'arrondissant, menton vers la poitrine.","Encha\xEEne lentement au rythme de la respiration (dur\xE9e en secondes)."],"Mouvement doux et sans \xE0-coups, dans une amplitude confortable."],["pilates_cent","Le Cent (Pilates)",["abdos"],["bodyweight"],"core",!1,{sets:2,repsMin:30,repsMax:60,restSec:30},["Allong\xE9 sur le dos, jambes en table (genoux \xE0 90\xB0), ou tendues \xE0 45\xB0 pour plus de difficult\xE9.","D\xE9colle la t\xEAte et les \xE9paules, bras tendus le long du corps \xE0 quelques centim\xE8tres du sol.","Bats des bras par petits mouvements rapides : inspire sur 5 battements, expire sur 5 (dur\xE9e en secondes)."],"Le bas du dos reste plaqu\xE9 au sol ; si la nuque tire, repose la t\xEAte entre les s\xE9ries."],["enroule_pilates","Enroul\xE9 de colonne (roll-up)",["abdos"],["bodyweight"],"core",!1,{sets:3,repsMin:6,repsMax:10,restSec:45},["Allong\xE9 sur le dos, jambes tendues, bras tendus au-dessus de la t\xEAte.","Expire et enroule la colonne vert\xE8bre par vert\xE8bre jusqu'\xE0 t'asseoir, bras vers les pieds.","Red\xE9roule lentement jusqu'au sol en contr\xF4lant la descente."],"Si tu ne montes pas sans \xE9lan, plie les genoux ou n'enroule que la moiti\xE9 du trajet."],["cercles_jambe","Cercles de jambe (Pilates)",["abdos","fessiers"],["bodyweight"],"core",!0,{sets:2,repsMin:6,repsMax:10,restSec:30},["Allong\xE9 sur le dos, une jambe tendue vers le plafond, l'autre allong\xE9e au sol.","Dessine des cercles de la taille d'un ballon avec la jambe lev\xE9e, bassin immobile.","Fais les cercles dans un sens puis dans l'autre, puis change de jambe."],"R\xE9duis la taille des cercles si le bassin bascule ou si le bas du dos se cambre."],["teaser_pilates","Teaser (Pilates)",["abdos"],["bodyweight"],"core",!1,{sets:3,repsMin:4,repsMax:8,restSec:45},["Assis en \xE9quilibre sur les ischions, jambes tendues \xE0 45\xB0, bras tendus vers les pieds : le corps forme un V.","D\xE9roule le dos vers le sol en gardant les jambes en l'air.","Remonte en V en expirant, sans \xE0-coup."],"Exercice avanc\xE9 : commence genoux pli\xE9s, pieds pos\xE9s au sol, et ne d\xE9roule qu'\xE0 mi-chemin."],["nage_pilates","Nage au sol (swimming)",["dos","fessiers"],["bodyweight"],"core",!1,{sets:3,repsMin:20,repsMax:30,restSec:30},["Allong\xE9 sur le ventre, bras tendus devant, jambes tendues.","D\xE9colle l\xE9g\xE8rement les bras, le buste et les jambes, regard vers le sol.","Bats bras et jambes oppos\xE9s en alternance, par petits mouvements rapides (dur\xE9e en secondes)."],"Allonge-toi plus que tu ne te cambres : la nuque reste dans le prolongement du dos."],["coquillage","Coquillage (clamshell)",["fessiers"],["bodyweight"],"hinge",!0,{sets:3,repsMin:12,repsMax:20,restSec:30},["Allong\xE9 sur le c\xF4t\xE9, genoux pli\xE9s \xE0 90\xB0, talons align\xE9s avec les fesses.","Pieds coll\xE9s, ouvre le genou du dessus comme un coquillage.","Referme lentement sans laisser le bassin rouler en arri\xE8re, puis change de c\xF4t\xE9."],"Bassin bien empil\xE9 : s'il bascule en arri\xE8re, r\xE9duis l'amplitude."],["elevation_jambe_cote","\xC9l\xE9vation lat\xE9rale de jambe (allong\xE9)",["fessiers"],["bodyweight"],"hinge",!0,{sets:3,repsMin:12,repsMax:20,restSec:30},["Allong\xE9 sur le c\xF4t\xE9, jambes tendues dans l'alignement du corps, t\xEAte pos\xE9e sur le bras.","L\xE8ve la jambe du dessus jusqu'\xE0 hauteur de hanche, pointe de pied vers l'avant.","Redescends sans la poser, puis change de c\xF4t\xE9."],"Ne monte pas trop haut : au-del\xE0, c'est le bas du dos qui travaille."],["kickback_quadrupedie","Kickback fessier \xE0 quatre pattes",["fessiers","ischios"],["bodyweight"],"hinge",!0,{sets:3,repsMin:12,repsMax:20,restSec:30},["\xC0 quatre pattes, mains sous les \xE9paules, genoux sous les hanches.","Garde le genou pli\xE9 \xE0 90\xB0 et pousse le talon vers le plafond.","Redescends sans poser le genou, dos immobile, puis change de c\xF4t\xE9."],"Ne cambre pas : monte seulement tant que le bas du dos reste neutre."],["crunch_velo","Crunch v\xE9lo (bicycle)",["abdos"],["bodyweight"],"core",!1,{sets:3,repsMin:12,repsMax:20,restSec:45},["Allong\xE9 sur le dos, mains derri\xE8re la t\xEAte, jambes en table.","Am\xE8ne un coude vers le genou oppos\xE9 en tendant l'autre jambe.","Alterne de chaque c\xF4t\xE9 en contr\xF4lant, sans tirer sur la nuque."],"Mouvement lent : la rotation vient du buste, pas des coudes."],["fente_croisee","Fente crois\xE9e (r\xE9v\xE9rence)",["fessiers","quadriceps"],["bodyweight"],"lunge",!0,{sets:3,repsMin:10,repsMax:14,restSec:60},["Debout, pieds largeur de hanches.","Recule une jambe en diagonale derri\xE8re l'autre, comme une r\xE9v\xE9rence, et descends.","Remonte en poussant sur le talon avant, puis change de c\xF4t\xE9."],"Genou avant dans l'axe du pied : ne le laisse pas rentrer vers l'int\xE9rieur."],["pompes_mur","Pompes contre le mur",["pect","triceps","epaules"],["bodyweight"],"push",!1,{sets:3,repsMin:12,repsMax:20,restSec:45},["Face au mur, mains \xE0 plat \xE0 hauteur d'\xE9paules, un peu plus \xE9cart\xE9es qu'elles.","Recule les pieds pour incliner le corps, gain\xE9 de la t\xEAte aux talons.","Plie les coudes pour approcher la poitrine du mur, puis repousse en expirant."],"Plus les pieds sont loin du mur, plus c'est difficile : progresse ensuite vers les pompes sur les genoux."],["planche_touches","Planche avec touchers d'\xE9paule",["abdos","epaules"],["bodyweight"],"core",!1,{sets:3,repsMin:10,repsMax:20,restSec:45},["En planche bras tendus, mains sous les \xE9paules, pieds \xE9cart\xE9s largeur de hanches.","Touche l'\xE9paule oppos\xE9e avec une main, sans faire tourner le  84 144 83 148 82 156 80",sx:78,sy:56,pal:"hima",vh:821}},ASC_TERRAIN={pre:{art:"pre",l:["Alpage","P\xE2turage","Prairie","Lisi\xE8re","Chalet d'alpage"],q:["Les cloches des vaches r\xE9sonnent dans la combe.","Une marmotte siffle et file dans son terrier.","La for\xEAt s'arr\xEAte ici : le ciel s'ouvre.","Un chalet d'alpage, et l'odeur du foin coup\xE9.","Gentianes et edelweiss bordent le sentier.","Une fontaine d'eau fra\xEEche : on remplit la gourde.","Les premiers rayons chauffent l'herbe encore humide."]},roc:{art:"roc",f:"Plus un arbre : la roche prend le relais.",l:["Pierrier","\xC9boulis","Combe","Ressaut","Vire","Couloir"],q:["Les chamois t'observent depuis la cr\xEAte.","Le sentier se faufile entre les blocs.","Un bouquetin immobile te regarde passer.","Les cailloux roulent sous tes pas.","Les choucas tournoient, \xE0 l'aff\xFBt d'une miette.","Une main sur le rocher, et on se hisse.","Un cairn indique le chemin.","Le rocher chauff\xE9 par le soleil sent la pierre \xE0 feu.","Une chute de pierres, loin sur la droite."]},mor:{art:"mor",f:"Crampons aux pieds : le glacier commence.",l:["Moraine","Glacier","Rive du glacier"],q:["Un lac turquoise dort au pied de la moraine.","La glace craque doucement sous le soleil.","Un torrent gronde sous la glace.","On s'encorde : les crevasses guettent.","Des blocs pos\xE9s l\xE0 par le glacier, il y a tr\xE8s longtemps."]},nev:{art:"nev",l:["N\xE9v\xE9","S\xE9racs","Plateau glaciaire","Rimaye","Pente de neige"],q:["Des s\xE9racs bleus, gros comme des maisons.","L'air se fait rare : chaque pas compte.","La neige crisse dans le froid du matin.","Un grand pas pour franchir la rimaye.","Le silence, seulement troubl\xE9 par le vent.","La neige \xE9blouit : lunettes obligatoires.","La trace monte en lacets r\xE9guliers.","Un pont de neige, franchi sans un bruit."]},are:{art:"are",l:["Ar\xEAte","\xC9paule","Cr\xEAte","Ant\xE9cime","Gendarme","Br\xE8che"],q:["Le vide des deux c\xF4t\xE9s : un pas apr\xE8s l'autre.","La vue porte jusqu'\xE0 l'horizon.","Le sommet para\xEEt tout proche.","Le vent siffle sur l'ar\xEAte.","Une mer de nuages s'\xE9tend sous tes pieds.","Les premi\xE8res lueurs dorent les sommets voisins.","Les autres sommets passent un \xE0 un sous toi.","Une prise solide, un pas, une autre prise.","La lumi\xE8re rasante sculpte chaque rocher.","Tout para\xEEt plus petit, sauf le ciel."]},des:{art:"des",l:["D\xE9sert alpin","Coul\xE9e de lave","Plateau de lave","Pierrier volcanique"],q:["Plus rien ne pousse : roche et poussi\xE8re volcanique.","Le Mawenzi dresse ses aiguilles \xE0 l'est.","Nuits glaciales, journ\xE9es br\xFBlantes.","\xAB Pole pole \xBB : doucement, comme disent les guides.","Les nuages restent sous toi, comme une mer.","Les derniers s\xE9ne\xE7ons g\xE9ants, plantes d'un autre monde.","Un corbeau \xE0 nuque blanche te suit des yeux.","Le sommet du Kibo, enneig\xE9, para\xEEt tout proche."]},cen:{art:"cen",l:["Pente de cendres","Lacets","Pierrier"],q:["Deux pas en avant, un en arri\xE8re dans la cendre.","Les frontales des autres cord\xE9es scintillent plus bas.","Les glaciers du Kibo brillent au-dessus.","Le froid mord : les mains restent dans les poches.","La frontale \xE9claire trois m\xE8tres de cendre, pas plus.","Les lacets n'en finissent pas : on compte les pas.","L'aube approche \xE0 l'est, derri\xE8re le Mawenzi."]},crat:{art:"are",l:["Bord du crat\xE8re"],q:["Le crat\xE8re du Kibo s'ouvre devant toi.","Des murs de glace, derniers vestiges des glaciers du Kibo."]},apie:{art:"des",l:["Pierrier","Lacets","Plateau","Moraine"],q:["Un condor plane au-dessus de la vall\xE9e.","Le vent soul\xE8ve la poussi\xE8re du pierrier.","Les mules sont rest\xE9es en bas, \xE0 Plaza de Mulas.","La cordill\xE8re s'\xE9tend \xE0 perte de vue."]},apen:{art:"nev",l:["P\xE9nitents","Pente de neige","Plateau","Col"],q:["Des p\xE9nitents de neige, hauts comme toi.","Le \xAB viento blanco \xBB se l\xE8ve l'apr\xE8s-midi.","L'eau, ici, se gagne en faisant fondre la neige.","Le froid sec craquelle les l\xE8vres.","Les tentes claquent sous les rafales.","Des pierres pos\xE9es sur la tente la tiennent face au vent.","On boit, on boit encore : l'altitude ass\xE8che."]},hmor:{art:"mor",l:["Moraine","Glacier"],q:["Le glacier craque et g\xE9mit sous les tentes.","Des p\xE9nitents de glace bordent la moraine.","Les cairns jalonnent la moraine.","Le soleil br\xFBle, le froid mord \xE0 l'ombre.","Une avalanche gronde au loin, sans danger.","La moraine s'\xE9tire, grise et sans fin.","Un torrent de fonte court sous les pierres.","Des sommets de 7 000 m bordent la vall\xE9e."]},hpen:{art:"nev",l:["Cordes fixes","Pente de glace","\xC9peron"],q:["Les cordes fixes claquent dans le vent.","Le jumar mord la corde, pas apr\xE8s pas.","Les tentes s'accrochent \xE0 un replat taill\xE9 dans la glace.","L'aube rosit les sommets voisins.","Respirer, avancer, respirer.","Un piolet plant\xE9, une longe, une pause.","La glace bleue sonne sous les crampons.","Le camp suivant n'est qu'un point color\xE9, l\xE0-haut.","Un th\xE9 br\xFBlant, fait avec la neige fondue."]},hhaut:{art:"are",l:["Ar\xEAte","Pente de neige"],q:["Le jet-stream hurle sur la cr\xEAte.","Chaque pas demande trois respirations.","La courbure de la Terre se devine \xE0 l'horizon.","Le ciel vire au bleu nuit, m\xEAme en plein jour.","Les nuages sont loin, tr\xE8s loin dessous.","Le soleil br\xFBle, l'ombre g\xE8le.","Les sommets de 7 000 m sont maintenant \xE0 ta hauteur.","La nuit, le vent secoue la tente sans rel\xE2che."]},hmort:{art:"high",l:["Pente sommitale"],q:["Au-del\xE0 de 8 000 m, la zone de la mort : on ne s'attarde pas.","L'oxyg\xE8ne siffle dans le masque.","Plus haut que presque tous les sommets du monde.","Le temps compte : redescendre avant la mi-journ\xE9e.","Le ciel est presque noir au-dessus de toi.","Les \xE9toiles brillent encore quand on se met en route.","Chaque pas se d\xE9cide.","Les g\xE9ants alentour ne sont plus que des collines."]}},ASC_ZONES={moleson:[[1700,"pre"],[1870,       <h3>1. Ta force sur chaque exercice</h3>
      <p>Le 1RM estim\xE9 de ta meilleure s\xE9rie (formules d'Epley et de Brzycki, fiables jusqu'\xE0 10 r\xE9p\xE9titions). Si tu indiques les r\xE9p\xE9titions que tu aurais pu faire en plus, elles sont ajout\xE9es. Pour les pompes, la charge est la part du poids du corps qu'elles soul\xE8vent (64 % au sol, 49 % sur les genoux) : ajoute une pes\xE9e dans Profil pour qu'elles comptent en kg. Sans pes\xE9e, et pour les autres exercices au poids du corps, la m\xEAme formule s'applique \xE0 charge constante : passer de 10 \xE0 20 r\xE9p\xE9titions compte +25 %, pas +100 %. Pour les gainages, 1 r\xE9p\xE9tition \u2248 3 secondes sous tension.</p>

      <h3>4. Le statut</h3>
