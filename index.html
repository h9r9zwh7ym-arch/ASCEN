  customClear(){
    confirmSheet({ title:"Vider ma séance ?", html:"Les exercices choisis seront retirés. Tes séances enregistrées ne changent pas.", ok:"Vider", danger:true,
      onOk:()=>{ S.custom = { exos:[] }; save(); renderTodaySoft(); } });
  },
  startExpress(){
    if(S.draft && S.draft.startedAt) return;
    const s = buildExpressSession(); if(!s.exos.length) return;
    S.draft = s; S.draft.startedAt = new Date().toISOString();
    liveFocusIdx = 0; completeShown = false;
    save(); scrollTodayTop(); renderViewAnimated("today");
    showLaunch(S.draft);
  },
  startCustom(){
    if(!S.custom.exos.length) return;
    S.draft = buildCustomSession(S.custom.exos, S.custom.name);
    const planned = plannedTemplate();
    if(S.custom.tplId){ S.draft.tplId = S.custom.tplId; S.draft.planned = !!planned && planned.id===S.custom.tplId; }
    S.draft.startedAt = new Date().toISOString();
    liveFocusIdx = 0; completeShown = false;
    save(); scrollTodayTop(); renderViewAnimated("today");
    showLaunch(S.draft);
  },
  saveTemplateOpen(){
    // « Ma séance » s'enregistre via l'éditeur, pré-rempli (et relié à sa séance si elle en vient)
    openTplEditor(S.custom.tplId || null, { n:S.custom.name||"", exos:S.custom.exos.map(e=>({ exoId:e.exoId, sets:e.sets })), fromCustom:true, lite:true,
      ...(S.custom.tplId ? {} : { days:(S.custom.pendingDays||[]).slice() }) });
  },

  missCatchUp(d){
    const t = S.templates.find(x=>x.id===d.id); if(!t) return;
    S.custom = { exos: clone(t.exos), name: t.n, tplId: t.id, planDate: todayISO() };
    S.settings.todayTab = "custom"; t.exos.forEach(e=>freshIds.add(e.exoId));
    save(); renderTodaySoft(); toast(`« ${t.n} » chargée : en route pour le rattrapage`, "repeat");
  },
  missSkip(d){ S.meta.missSkip = d.iso+":"+d.id; save(); changed(); },
  loadTemplate(d){
    const t = S.templates.find(x=>x.id===d.id); if(!t) return;
    S.custom = { exos: clone(t.exos), name: t.n, tplId: t.id };
    t.exos.forEach(e=>freshIds.add(e.exoId));
    closeSheet(); save(); renderTodaySoft(); toast(`« ${t.n} » chargée dans Ma séance`);
    setTimeout(()=>{ const g = qs("#v-today .group.builder"); if(g) g.scrollIntoView({ behavior:"smooth", block:"center" }); }, 260);
  },
  deleteTemplate(d){
    const t = S.templates.find(x=>x.id===d.id); if(!t) return;
    confirmSheet({ title:`Supprimer « ${t.n} » ?`, html:"La séance enregistrée et ses jours de planning seront supprimés.", ok:"Supprimer", danger:true, onOk:()=>{
      const i = S.templates.indexOf(t), wasCustom = S.custom.tplId===d.id;
      S.templates = S.templates.filter(x=>x.id!==d.id);
      if(wasCustom) delete S.custom.tplId;
      save(); changed();
      toast(`« ${t.n} » supprimée`, "trash", ()=>{
        if(S.templates.some(x=>x.id===t.id)) return;
        S.templates.splice(Math.min(i, S.templates.length), 0, t); if(wasCustom) S.custom.tplId = t.id; save(); changed();
      });
    } });
  },

  // --- séance en cours ---
  // navigation en boucle : après le dernier exercice on revient au premier, et inversement
  focusPrev(){ const n = S.draft ? S.draft.exos.length : 0; if(n>1){ liveFocusIdx = (liveFocusIdx-1+n)%n; focusAnimDir="l"; refreshFocusRegion(); } },
  focusNext(){ const n = S.draft ? S.draft.exos.length : 0; if(n>1){ liveFocusIdx = (liveFocusIdx+1)%n; focusAnimDir="r"; refreshFocusRegion(); } },
  focusJump(d){ const ni=+d.idx; focusAnimDir = ni>liveFocusIdx?"r":ni<liveFocusIdx?"l":null; liveFocusIdx=ni; refreshFocusRegion(); },
  jumpFromOverview(d){ const ni=+d.idx; focusAnimDir = ni>liveFocusIdx?"r":ni<liveFocusIdx?"l":null; liveFocusIdx=ni; closeSheet(); refreshFocusRegion(); },

  holdStart(d){
    const exi = +d.exi, ex = S.draft.exos[exi], st = ex.sets.find(s=>!s.done); if(!st) return;
    if(restState) stopRestTimer();
    hold = { exi, target: Math.max(5, st.reps||30), phase:"prep", t0: Date.now(), lastTick:3 };
    clearInterval(holdTimer); holdTimer = setInterval(holdTick, 100);
    sfx("restTick"); haptic(12); refreshFocusRegion();
  },
  holdStop(){
    if(!hold) return;
    if(hold.phase==="prep"){ clearInterval(holdTimer); hold = null; refreshFocusRegion(); return; }
    holdFinish((Date.now()-hold.t0)/1000);
  },
  setEffort(d, el){
    const src = restState && restState.src; if(!src) return;
    const st = S.draft.exos[src.exi] && S.draft.exos[src.exi].sets[src.si]; if(!st) return;
    const v = +d.v; st.effort = st.effort===v ? 0 : v;
    const box = el && el.closest(".ef-opts");
    if(box) qsa("button", box).forEach(b=>{ const on = +b.dataset.v===st.effort; b.classList.toggle("on", on); b.setAttribute("aria-pressed", on); });
    sfx("seg"); haptic(6); save();
  },
  swapHarder(d){
    const i = +d.idx, ex = S.draft.exos[i]; if(!ex || !ex.harder || !EXO_MAP[ex.harder]) return;
    const h = EXO_MAP[ex.harder];
    const entry = sessionEntryFor(h, ex.sets.length);
    // les séries déjà faites restent acquises sur l'exercice d'origine
    if(ex.sets.some(s=>s.done)){ ex.sets = ex.sets.filter(s=>s.done); delete ex.harder; S.draft.exos.splice(i+1, 0, entry); liveFocusIdx = i+1; }
    else S.draft.exos[i] = entry;
    focusAnimDir = "r"; save(); refreshFocusRegion(); sfx("open");
    toast(`Place à « ${h.n} »`);
  },
  toggleFlow(){
    S.settings.flow = circuitMode() ? "classic" : "circuit"; save(); closeSheet();
    toast(circuitMode() ? "Après chaque repos : exercice suivant" : "Toutes les séries d'un exercice, puis le suivant");
    refreshFocusRegion();
  },
  favToggle(d, el){
    const on = toggleFavorite(d.id), n = EXO_MAP[d.id] ? EXO_MAP[d.id].n : "Exercice";
    if(el && el.classList.contains("fav-toggle")){ el.classList.toggle("on", on); el.setAttribute("aria-pressed", on); el.setAttribute("aria-label", on ? "Retirer des favoris" : "Ajouter aux favoris");
      el.classList.remove("pop"); if(on){ void el.offsetWidth; el.classList.add("pop"); } }
    haptic(10); sfx(on ? "fav" : "close"); closeModalIfMenu();
    toast(on ? `${n} ajouté aux favoris` : `${n} retiré des favoris`, "star");
    if(picker){ const l = qs("#pickerList"); if(l) l.innerHTML = pickerListHTML(); }
  },
  focusMenu(d){
    const i = +d.idx, def = EXO_MAP[S.draft.exos[i].exoId];
    openModal(`<div class="tm-head r-${regionOf(def)}">${exoIcon(def,"sm")}<div><div style="font-weight:700;font-size:calc(17rem/17)">${esc(def.n)}</div></div></div>
      <div class="menu-list">

        <button data-a="addSetFocus" data-exi="${i}">${icon("plus")}<span>Ajouter une série</span></button>
        ${S.draft.exos[i].sets.some(s=>s.done) ? `<button data-a="editDoneSets" data-exi="${i}">${icon("edit")}<span>Corriger les séries faites</span></button>` : ""}
        <button data-a="toggleFlow">${icon("repeat")}<span>${circuitMode()?"Enchaînement : exercice suivant après chaque repos":"Enchaînement : toutes les séries d'abord"}</span></button>

  openOverview(){ openSheet(`<div class="sheet-hd"><span class="t">Exercices de la séance</span><button class="icon-btn" data-a="closesheet" aria-label="Fermer">${icon("close")}</button></div><div class="sheet-body">${overviewBodyHTML()}</div>`); },
  removeExoOverview(d){
    const draft = S.draft, i = +d.idx, [ex] = draft.exos.splice(i,1); if(!ex) return;
    toast(`${EXO_MAP[ex.exoId] ? EXO_MAP[ex.exoId].n : "Exercice"} retiré`, null, ()=>{
      if(S.draft!==draft || draft.exos.includes(ex)) return;
      draft.exos.splice(Math.min(i, draft.exos.length), 0, ex); save(); refreshFocusRegion();
      const b = qs(".sheet-body"); if(b && qs("#overlay").classList.contains("open")) b.innerHTML = overviewBodyHTML();
    });
    if(liveFocusIdx>=S.draft.exos.length) liveFocusIdx = Math.max(0,S.draft.exos.length-1);

  addSetFocus(d){
    const ex = S.draft.exos[+d.exi];
    const last = ex.sets[ex.sets.length-1];
    ex.sets.push({ reps:last?last.reps:null, weight:last?last.weight:null, done:false, rpe:null });
    ex.targetSets = ex.sets.length;
    completeShown = false;
    closeSheet(); save(); refreshFocusRegion();
  },
  // un changement se reporte sur les séries suivantes non validées qui avaient la même valeur
  stepReps(d){
    const ex = S.draft.exos[+d.exi], st = ex.sets[+d.si], old = st.reps;
    const v = Math.max(0,(old||0)+parseInt(d.d,10));
    ex.sets.forEach((s,i)=>{ if(i>=+d.si && !s.done && s.reps===old) s.reps = v; });
    st.reps = v;
    valRoll = { f:"reps", d: parseInt(d.d,10)>0 ? "up" : "down" }; sfx("step", parseInt(d.d,10)>0);
    save(); refreshFocusRegion();
  },
  stepWeight(d){
    const ex = S.draft.exos[+d.exi], def = EXO_MAP[ex.exoId], st = ex.sets[+d.si], old = st.weight;
    const v = stepWeightValue(def, old||0, parseInt(d.d,10));
    ex.sets.forEach((s,i)=>{ if(i>=+d.si && !s.done && s.weight===old) s.weight = v; });
    st.weight = v;
    valRoll = { f:"weight", d: parseInt(d.d,10)>0 ? "up" : "down" }; sfx("step", parseInt(d.d,10)>0);
    save(); refreshFocusRegion();
  },
  editVal(d){
    const ex = S.draft.exos[+d.exi], st = ex.sets[+d.si], isW = d.f==="weight";
    promptNumber({ title: isW?"Charge de la série":"Répétitions", value: isW?st.weight:st.reps, unit: isW?"kg":"reps", step: isW?"0.5":"1",
      onOk: v=>{
        // bornes réalistes (comme dans l'édition de l'historique) : une faute de frappe ne doit pas
        // gonfler le tonnage, les records et les trophées ; élastiques = niveaux 1 à 5
        const def = EXO_MAP[ex.exoId], bands = def && loadableTypeOf(def)==="bands";
        v = isW ? Math.min(bands ? 5 : 500, v) : Math.min(9999, v);
        // la nouvelle valeur s'applique aussi aux séries suivantes non validées
        ex.sets.forEach((s,i)=>{ if(i>=+d.si && !s.done){ if(isW) s.weight = round1(v); else s.reps = Math.round(v); } });
        save(); refreshFocusRegion();
      }});
  },
  validateSet(d){
    const exi = +d.exi;
    const ex = S.draft.exos[exi], def = EXO_MAP[ex.exoId];
    const si = ex.sets.findIndex(s=>!s.done);
    if(si<0) return;
    const st = ex.sets[si];
    haptic(12);
    let [bx,by] = centerOf(".validate");
    if(bx==null){ [bx,by] = centerOf(".focus-card .set-dots"); if(bx==null){ bx = innerWidth/2; by = innerHeight/2; } }
    // les textes flottants partent des points de série (même place avant et après le repos)
    const dotsR = (qs(".focus-card .set-dots")||{getBoundingClientRect:()=>null}).getBoundingClientRect();
    const fx0 = dotsR ? dotsR.left+dotsR.width/2 : bx, fy0 = dotsR ? dotsR.top-8 : by-30;
    // record : meilleur que l'historique ET que les séries déjà validées aujourd'hui
    const prevToday = ex.sets.filter(s=>s.done);
    const bestTodayW = Math.max(0,...prevToday.map(s=>s.weight||0));
    const best1rmToday = Math.max(0,...prevToday.map(s=>estimated1RM(s.weight,s.reps)));
    const w = st.weight||0, r = st.reps||0;
    const beatsToday = w>bestTodayW || estimated1RM(w,r)>best1rmToday+0.01;
    if((w||r) && beatsToday && isNewPR(ex.exoId, w, r)){
      st.pr = true;
      S.meta.prCount = (S.meta.prCount||0)+1;
      confettiBurst(bx, by, 60);
      floatText(fx0, fy0, "Record !", "pr", "bolt");
    }
    // mieux que la même série la dernière fois : petit retour immédiat (le record a déjà le sien)
    const ref = !st.pr && S.settings.beat!==false && !isStretch(def) ? beatRef(ex.exoId, si) : null;
    const beat = !!ref && daysBetween(ref.date, todayISO())<21 && beatCmp(def, st, ref)>0;
    if(beat){ floatText(fx0, fy0, "Mieux que la dernière fois", "beat", "trendUp"); haptic(20); }
    st.done = true;
    { const fin = ex.sets.every(s=>s.done), rest = S.draft.exos.some(e=>e.sets.some(s=>!s.done));
      sfx(!rest ? "complete" : st.pr ? "pr" : fin ? "exo" : "set"); }
    if(navigator.vibrate) try{ navigator.vibrate(18); }catch(e){}
    justDone = { exi, si };
    stripBump = exi;
    if(!st.pr && !beat && !exoFinished0(ex)) floatText(fx0, fy0, `Série ${si+1}`, "", "check");
    const exoFinished = !ex.sets.some(s=>!s.done);
    const ni = nextUndone(exi);
    if(ni>=0) startRestTimer(S.draft.express ? Math.min(45, restFor(def)) : restFor(def), def.n, exoFinished ? ni : exi, exoFinished, { exi, si });
    else stopRestTimer();
    if(exoFinished){
      if(!st.pr) confettiBurst(bx, by, 36);
      if(ni>=0){ const nm = qs(".focus-card .fc-name"), r = nm && nm.getBoundingClientRect(); floatText(r ? r.left+r.width/2 : bx, r ? r.top+r.height/2 : by, "Exercice terminé !", "big", "flame"); }
      if(ni>=0){ liveFocusIdx = ni; focusAnimDir = ni>exi ? "r" : "l"; }
    }
    save();
    refreshFocusRegion();
  },

  showExoInfo(d){
    const e = EXO_MAP[d.id];
    if(!e) return;
    const region = regionOf(e);
    const opener = ()=>ACT.showExoInfo({ id:e.id });
    // le contexte se lit après l'empilement : on ouvre d'abord, puis on dessine le contenu

        ${liveIdx>=0 && ctx!=="picker" ? `<button class="chip" data-a="swapFromInfo" data-idx="${liveIdx}" data-id="${x.id}">Remplacer</button>` : infoAddButton(x.id, true)}
      </div>`).join("")}</div>` : "";
    const sheetEl = qs("#overlay .sheet");

      <div class="sheet-body">
      <div class="exo-hero r-${region}">
        <div class="exo-stage r-${region}">${exoAnimSVG(e)}</div>
        <div class="nm">${esc(e.n)}</div>
        <div class="exo-tags"><span class="rtag r-${region}">${REGIONS[region].n}</span><span class="etag">${sfIcon(EQUIP_GLYPH[cat.id]||"wrench", EQUIP_COLOR[cat.id]||"gray", "xs")} ${esc(cat.n)}</span>${e.equip.includes("bench")?`<span class="etag">+ banc</span>`:""}</div>
      </div>
      <div class="exo-muscle-chips">${e.muscles.map((m,i)=>`<span class="chip mchip ${i===0?"main":""}">${MUSCLE_MAP[m].n}${i===0?" <small>principal</small>":""}</span>`).join("")}</div>
      ${e.muscles.some(m=>m!=="cardio") ? `<div class="exo-mm">${exoMuscleMap(e)}</div>` : ""}

      ${simHTML}

  // « Ajouter » depuis une fiche : agit sur la séance d'où l'on vient (sélection de la liste,
  // séance en cours, séance proposée ou Ma séance), puis ramène à cette séance
  infoAdd(d){
    const id = d.id, def = EXO_MAP[id]; if(!def) return;
    const ctx = infoContext();
    if(ctx==="picker"){
      if(!picker.multi){ picker.onDone([id]); return; }
      const i = picker.selected.indexOf(id);
      if(i>=0) picker.selected.splice(i,1); else picker.selected.push(id);
      // retour à la liste, sélection visible et bouton « Ajouter n » à jour
      while(sheetStack.length && !sheetStack[sheetStack.length-1].isPicker) sheetStack.pop();
      sheetBack();
      toast(i>=0 ? "Retiré de la sélection" : "Ajouté à la sélection", "check");
      return;
    }
    if(ctx==="live" || ctx==="proposal"){
      if(S.draft.exos.some(x=>x.exoId===id)) return;
      S.draft.exos.push(sessionEntryFor(def));
      save(); closeSheet(); changed();
      toast(ctx==="live" ? "Ajouté à la séance en cours" : "Ajouté à la séance proposée", "check");
      return;
    }
    ACT.addToCustom({ id });
  },
  addToCustom(d){
    if(S.custom.exos.some(x=>x.exoId===d.id)) return;
    S.custom.exos.push({ exoId:d.id, sets:EXO_MAP[d.id].sets });
    freshIds.add(d.id);
    save(); closeSheet(); changed(); toast("Ajouté à Ma séance");
  },

  finishSession(){
    const all = S.draft.exos.reduce((t,e)=>t+e.sets.length,0);
    const done = S.draft.exos.reduce((t,e)=>t+e.sets.filter(s=>s.done).length,0);
    if(!done){
      confirmSheet({ title:"Aucune série validée", html:"Il n'y a rien à enregistrer. Abandonner la séance ?", ok:"Abandonner", danger:true,
        onOk:()=>{ S.draft=null; liveFocusIdx=0; stopRestTimer(); save(); renderViewAnimated("today"); } });
    } else if(done<all){
      confirmSheet({ title:"Terminer la séance ?", html:`${all-done} série${all-done>1?"s":""} non validée${all-done>1?"s":""} ne ser${all-done>1?"ont":"a"} pas enregistrée${all-done>1?"s":""}.`, ok:"Terminer", onOk:finalizeSession });
    } else finalizeSession();
  },

// ---------- corriger une série déjà validée (v4.0) ----------
// Répétitions et charge ajustables, ou validation annulée (la série redevient à faire). Le record
// de la série est recalculé avec la même règle qu'en direct.
function draftSetIsPR(ex, si){
  const st = ex.sets[si], w = st.weight||0, r = st.reps||0, prev = ex.sets.filter((s,i)=>s.done && i<si);
  const beats = w>Math.max(0,...prev.map(s=>s.weight||0)) || estimated1RM(w,r)>Math.max(0,...prev.map(s=>estimated1RM(s.weight||0,s.reps||0)))+0.01;
  return !!((w||r) && beats && isNewPR(ex.exoId, w, r));
}
function setPRFlag(ex, si){
  const st = ex.sets[si], was = !!st.pr, now = st.done && draftSetIsPR(ex, si);
  if(was!==now){ st.pr = now || undefined; if(!now) delete st.pr; S.meta.prCount = Math.max(0, (S.meta.prCount||0) + (now?1:-1)); }
}
function doneSetsBodyHTML(exi){

  const def = EXO_MAP[ex.exoId], lt = loadableTypeOf(def), unit = isTimed(def) ? "s" : "reps";
  const rows = ex.sets.map((s,si)=>!s.done ? "" : `<div class="row ds-row">
      <span class="ds-n">${si+1}</span>
      <div class="ds-f"><div class="mini-step"><button data-a="dsStep" data-exi="${exi}" data-si="${si}" data-f="reps" data-d="-1" aria-label="Moins de ${unit}">−</button><span>${s.reps||0}</span><button data-a="dsStep" data-exi="${exi}" data-si="${si}" data-f="reps" data-d="1" aria-label="Plus de ${unit}">+</button></div><small>${unit}</small></div>
      ${lt ? `<div class="ds-f"><div class="mini-step"><button data-a="dsStep" data-exi="${exi}" data-si="${si}" data-f="weight" data-d="-1" aria-label="Moins lourd">−</button><span>${lt==="bands" ? esc(bandLabel(s.weight||1)).slice(0,6) : fmtDec(s.weight||0)}</span><button data-a="dsStep" data-exi="${exi}" data-si="${si}" data-f="weight" data-d="1" aria-label="Plus lourd">+</button></div><small>${lt==="bands"?"élastique":"kg"}</small></div>` : ""}
      ${s.pr ? `<span class="ds-pr" title="Record">${ii("bolt")}</span>` : ""}
      <button class="icon-btn ds-undo" data-a="dsUndo" data-exi="${exi}" data-si="${si}" aria-label="Annuler la validation de la série ${si+1}">${icon("undo")}</button>
    </div>`).join("");
  return `<p class="hr-note" style="margin:0 20px 12px">Ajuste une série validée par erreur, ou annule sa validation : elle redeviendra la prochaine à faire.</p><div class="group">${rows || `<div class="row"><div class="grow s">Aucune série validée.</div></div>`}</div>`;

function openDoneSets(exi){

  dsStep(d){
    const exi = +d.exi, si = +d.si, ex = S.draft && S.draft.exos[exi]; if(!ex || !ex.sets[si] || !ex.sets[si].done) return;
    const st = ex.sets[si], def = EXO_MAP[ex.exoId], dir = parseInt(d.d,10);

// « 4, 6, 8 » ou « 4 6 8 » ; « 12,5 » (virgule décimale suivie d'un seul chiffre) = 12,5 kg
function parseWeightList(txt){
  const out = [];
  txt.split(/[;\s]+/).forEach(tok=>{
    if(!tok) return;
    // « 12,5 » : virgule décimale ; « 8,10 » ou « 2.5,5 » : liste
    if(/^\d+,\d$/.test(tok)) out.push(parseFloat(tok.replace(",",".")));
    else tok.split(",").forEach(x=>{ const v = parseFloat(x); if(v>0) out.push(v); });
  });
  return out.filter(x=>x>0 && x<200);
}

function monthKeyAdd(k, n){ const d = parseISO(k+"-01"); d.setMonth(d.getMonth()+n); return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0"); }
function histBuckets(r){
  return memo("histB_"+r, ()=>{
    const today = todayISO(), keys = [];
    const first = S.sessions.reduce((m,s)=>s.date<m ? s.date : m, today);
    let unit = r==="w"||r==="m" ? "day" : r==="3m"||r==="6m" ? "week" : "month";
    if(r==="all"){ const days = daysBetween(first, today); unit = days<=91 ? "week" : days<=3*366 ? "month" : "year"; }

    else if(unit==="week"){ const cur = weekKey(today), n = r==="3m" ? 13 : r==="6m" ? 26 : Math.max(2, Math.floor(daysBetween(weekKey(first), cur)/7)+1);
      for(let i=n-1;i>=0;i--) keys.push(addDaysISO(cur,-7*i)); }
    else if(unit==="month"){ const cur = today.slice(0,7); let n = 12;
      if(r==="all"){ n = 1; while(monthKeyAdd(cur, -(n)) >= first.slice(0,7)) n++; n = Math.max(n, 2); }
      for(let i=n-1;i>=0;i--) keys.push(monthKeyAdd(cur,-i)); }
    else { const y = +today.slice(0,4); for(let k=+first.slice(0,4); k<=y; k++) keys.push(String(k)); }
    const keyOf = unit==="day" ? d=>d : unit==="week" ? weekKey : unit==="month" ? d=>d.slice(0,7) : d=>d.slice(0,4);
    const out = keys.map(k=>({ k, sessions:0, volume:0, sets:0, minutes:0 })), idx = {}; keys.forEach((k,i)=>idx[k]=i);
    const start = unit==="day" ? keys[0] : unit==="week" ? keys[0] : unit==="month" ? keys[0]+"-01" : keys[0]+"-01-01";
    // même durée juste avant, pour l'écart (pas pour « Total »)
    const span = daysBetween(start, today)+1, prevStart = addDaysISO(start, -span), prev = { sessions:0, volume:0, sets:0, minutes:0 };
    S.sessions.forEach(s=>{
      const i = idx[keyOf(s.date)];
      const b = i!==undefined ? out[i] : (s.date>=prevStart && s.date<start ? prev : null);
      if(!b) return;
      b.sessions++; b.volume += sessionVolume(s); b.sets += sessionSetCount(s); b.minutes += (s.durationSec||0)/60;
    });
    return { unit, out, prev, span, start };
  });
}
function histLabel(unit, k, long){

}
function histFmt(m){ return v => m==="minutes" ? fmtDuration(v*60) : m==="volume" ? fmtKg(v) : `${fmtDec(v)} ${m==="sets"?"série":"séance"}${v>=2?"s":""}`; }

  const fmt = histFmt(m);

let histSeenIds = null;
function markFreshHistory(v){

Object.assign(ACT, {

function histSwitch(key, opts, v, el){
  if((key==="histMetric" ? histMetric : histRange)===v) return;
  if(key==="histMetric") histMetric = v; else histRange = v;
  const seg = el && el.closest(".seg");
  if(seg){ seg.dataset.cur = opts.findIndex(x=>x[0]===v); qsa("button", seg).forEach(b=>{ const on = b.dataset.v===v; b.classList.toggle("on", on); b.setAttribute("aria-selected", on); }); settleSegs(seg.parentElement); }
  const box = qs("#histChart");
  if(!box) return;
  // le graphique se transforme au lieu de repartir de zéro : chaque nouvelle barre part de la hauteur
  // qu'avait l'ancien graphique au même endroit (même colonne si leur nombre ne change pas), puis
  // glisse vers sa valeur. Avant, changer de période faisait repousser toutes les barres depuis le bas.
  const old = qsa(".cc-bar", box).map(b=>parseFloat(b.style.height)||0), k0 = qs(".hist-kpi b", box), v0 = k0 ? +k0.dataset.v : 0;
  clearTimeout(box._t); cancelAnimationFrame(box._raf); box.classList.remove("swap","morph","tween"); box.innerHTML = histChartHTML();
  const bars = qsa(".cc-bar", box);
  if(reducedMotion() || !bars[0] || !bars[0].animate) return;
  // autre période, même mesure : le total défile de l'ancienne valeur à la nouvelle
  const k1 = qs(".hist-kpi b", box), v1 = k1 ? +k1.dataset.v : 0;
  if(key==="histRange" && k1 && v0!==v1){
    box.classList.add("tween"); const fmt = histFmt(histMetric), t0 = performance.now();
    const tick = now=>{ const p = Math.min(1, (now-t0)/450), e = 1-Math.pow(1-p, 3);
      k1.textContent = fmt(p<1 ? Math.round(v0+(v1-v0)*e) : v1); if(p<1) box._raf = requestAnimationFrame(tick); };
    box._raf = requestAnimationFrame(tick);
  }
  if(!old.some(h=>h>0)){ void box.offsetWidth; box.classList.add("swap"); }
  else {
    box.classList.add("morph");
    const n = bars.length, same = old.length===n;
    bars.forEach((b,i)=>{ const h = parseFloat(b.style.height)||0; if(!h) return;
      const h0 = old[same ? i : Math.min(old.length-1, Math.floor((i+.5)/n*old.length))];
      try{ b.animate([{ transform:`scaleY(${Math.min(6, h0/h).toFixed(3)})` }, { transform:"scaleY(1)" }], { duration:480, easing:"cubic-bezier(.32,.72,0,1)", delay:Math.min(i,24)*(same ? 10 : 6), fill:"backwards" }); }catch(e){} });
  }
  box._t = setTimeout(()=>box.classList.remove("swap","morph","tween"), 1000);
}

let recap = null; // { kind:"month"|"year", key:"2026-09"|"2026" }
function recapPrevKey(kind, key){
  if(kind==="year") return String(+key-1);
  const d = parseISO(key+"-01"); d.setMonth(d.getMonth()-1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function recapNextKey(kind, key){
  if(kind==="year") return String(+key+1);
  const d = parseISO(key+"-01"); d.setMonth(d.getMonth()+1);
  return d.getFullYear()+"-"+String(d.getMonth()+1).padStart(2,"0");
}
function recapTitle(kind, key){
  if(kind==="year") return `Mon année ${key}`;
  const d = parseISO(key+"-01");
  return MOIS_LONG[d.getMonth()].replace(/^./, c=>c.toUpperCase())+" "+d.getFullYear();
}
function recapDefault(kind){
  const t = todayISO();
  const cur = kind==="year" ? t.slice(0,4) : t.slice(0,7);
  // toujours la période en cours ; la précédente seulement si celle-ci est encore vide
  // (le bilan du mois écoulé reste proposé à part, sur l'accueil, en début de mois)
  if(S.sessions.some(s=>s.date.startsWith(cur))) return cur;
  const prev = recapPrevKey(kind, cur);
  return S.sessions.some(s=>s.date.startsWith(prev)) ? prev : cur;
}
function recapStats(kind, key){
  const list = S.sessions.filter(s=>s.date.startsWith(key));
  const prevN = S.sessions.filter(s=>s.date.startsWith(recapPrevKey(kind, key))).length;
  const sets = {}, days = {};
  let volume = 0, dur = 0, nSets = 0, prs = 0;
  list.forEach(s=>{
    volume += sessionVolume(s); dur += s.durationSec||0; prs += sessionPRCount(s);
    const n = sessionSetCount(s); nSets += n; days[s.date] = (days[s.date]||0)+n;
    s.exos.forEach(ex=>{ const c = ex.sets.filter(st=>st.done).length; if(c) sets[ex.exoId] = (sets[ex.exoId]||0)+c; });
  });
  const fav = Object.keys(sets).filter(id=>EXO_MAP[id]).sort((a,b)=>sets[b]-sets[a])[0];
  // meilleure série de semaines consécutives dans la période
  const weeks = Array.from(new Set(list.map(s=>weekKey(s.date)))).sort();
  let streak = 0, run = 0, prevW = null;
  weeks.forEach(w=>{ run = prevW && addDaysISO(prevW,7)===w ? run+1 : 1; streak = Math.max(streak, run); prevW = w; });
  let medals = 0;
  Object.values(S.medals||{}).forEach(m=>Object.values(m.d||{}).forEach(iso=>{ if(iso && localISO(new Date(iso)).startsWith(key)) medals++; }));
  const targets = S.targets.filter(t=>t.doneAt && t.doneAt.startsWith(key) && EXO_MAP[t.exoId]);
  // barres : séries par jour (mois) ou séances par mois (année)
  let bars;
  if(kind==="month"){
    const d0 = parseISO(key+"-01"), nDays = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate();
    bars = Array.from({ length:nDays }, (_,i)=>({ v: days[key+"-"+String(i+1).padStart(2,"0")]||0, l: [0,7,14,21,28].includes(i) ? String(i+1) : "" }));
  } else {
    bars = Array.from({ length:12 }, (_,i)=>({ v: list.filter(s=>+s.date.slice(5,7)===i+1).length, l: "JFMAMJJASOND"[i] }));
  }
  return { n:list.length, prevN, volume, dur, nSets, prs, fav, favSets: fav ? sets[fav] : 0, activeDays:Object.keys(days).length, streak, medals, targets, bars };
}

// Dessine un glyphe (mêmes tracés que les icônes de l'app) dans le canvas, sans image
// intermédiaire : chemins, cercles, rectangles et ellipses, en trait ou en plein.
function drawGlyph(ctx, name, x, y, size, color){
  const src = GLYPHS[name] || "";
  ctx.save(); ctx.translate(x, y); ctx.scale(size/24, size/24);
  ctx.strokeStyle = ctx.fillStyle = color || "#fff"; ctx.lineCap = "round"; ctx.lineJoin = "round";
  const attr = (tag, k)=>{ const m = tag.match(new RegExp("\\s"+k+"=\"([^\"]*)\"")); return m ? m[1] : null; };
  (src.match(/<(path|circle|rect|ellipse)\b[^>]*>/g)||[]).forEach(tag=>{
    const kind = tag.match(/^<(\w+)/)[1], p = new Path2D();
    if(kind==="path") p.addPath(new Path2D(attr(tag,"d")));
    else if(kind==="circle") p.arc(+attr(tag,"cx"), +attr(tag,"cy"), +attr(tag,"r"), 0, Math.PI*2);
    else if(kind==="ellipse") p.ellipse(+attr(tag,"cx"), +attr(tag,"cy"), +attr(tag,"rx"), +attr(tag,"ry"), 0, 0, Math.PI*2);
    else { const rx = +(attr(tag,"rx")||0); if(p.roundRect) p.roundRect(+attr(tag,"x"), +attr(tag,"y"), +attr(tag,"width"), +attr(tag,"height"), rx); else p.rect(+attr(tag,"x"), +attr(tag,"y"), +attr(tag,"width"), +attr(tag,"height")); }
    const stroke = attr(tag,"stroke"), fill = attr(tag,"fill");
    if(stroke && stroke!=="none"){ ctx.lineWidth = +(attr(tag,"stroke-width")||2); ctx.stroke(p); }
    if(fill && fill!=="none") ctx.fill(p);
  });
  ctx.restore();
}
function iconTile(ctx, name, x, y, size, color){
  ctx.fillStyle = color; rrect(ctx, x, y, size, size, size*0.26); ctx.fill();
  drawGlyph(ctx, name, x+size*0.17, y+size*0.17, size*0.66, "#fff");
}
// titres en Geist (police de la marque, embarquée), chiffres en Barlow Semi Condensed ; repli système
function recapFont(w, px, display){ return `${w} ${px}px ${display ? '"Geist ASCEN",' : '"ASCEN Num",'}-apple-system,BlinkMacSystemFont,"SF Pro Display","Helvetica Neue",Arial,sans-serif`; }
function recapFit(ctx, txt, max){

function drawRecap(kind, key){

  ctx.fillStyle = bg; ctx.fillRect(0,0,W,H);

  tiles.forEach(([l,v],i)=>{
    const x = X + (i%2)*(tw2+24), y = 560 + Math.floor(i/2)*(th+24);
    ctx.fillStyle = "rgba(255,255,255,.07)"; rrect(ctx, x, y, tw2, th, 30); ctx.fill();
    ctx.fillStyle = mute; ctx.font = recapFont(600, 30); ctx.fillText(l, x+32, y+54);
    ctx.fillStyle = white; ctx.font = recapFont(800, 58); ctx.fillText(recapFit(ctx, v, tw2-64), x+32, y+122);
  });
  // barres d'activité
  const cy = 1024, ch = 96, cw = W-2*X, n = st.bars.length, gap = kind==="year" ? 16 : 6;
  const bw = (cw-gap*(n-1))/n, max = Math.max(1, ...st.bars.map(b=>b.v));
  st.bars.forEach((b,i)=>{
    const x = X + i*(bw+gap), h = b.v ? Math.max(10, b.v/max*ch) : 6;
    const g = ctx.createLinearGradient(0, cy-h, 0, cy); g.addColorStop(0,"#FFB300"); g.addColorStop(1,"#FF6A1A");
    ctx.fillStyle = b.v ? g : "rgba(255,255,255,.12)"; rrect(ctx, x, cy-h, bw, h, Math.min(bw/2, h/2, 8)); ctx.fill();
    if(b.l){ ctx.fillStyle = mute; ctx.font = recapFont(600, 24); ctx.textAlign = kind==="year" ? "center" : "left"; ctx.fillText(b.l, kind==="year" ? x+bw/2 : x, cy+38); ctx.textAlign = "left"; }
  });
  // points forts
  const hl = [];
  const short = id=>EXO_MAP[id].n.replace(/\s*\([^)]*\)/g, "");
  if(st.fav) hl.push(["dumbbell", IOS_COL.orange, `Favori : ${short(st.fav)} · ${nb(st.favSets,"série")}`]);
  if(st.targets.length) hl.push(["target", IOS_COL.red, st.targets.length>1 ? `${st.targets.length} objectifs atteints` : `Objectif atteint : ${short(st.targets[0].exoId)}, ${fmtTarget(st.targets[0].kind, st.targets[0].value)}`]);
  if(st.streak>=2) hl.push(["flame", IOS_COL.red, `${st.streak} semaines d'affilée`]);
  if(st.medals) hl.push(["medal", IOS_COL.yellow, `${nb(st.medals,"trophée")} débloqué${st.medals>=2?"s":""}`]);
  if(hl.length<3 && st.activeDays) hl.push(["calendar", IOS_COL.blue, `${nb(st.activeDays,"jour")} d'entraînement`]);
  ctx.font = recapFont(600, 34); ctx.fillStyle = white;
  hl.slice(0,3).forEach(([g, c, t],i)=>{ const y = 1128+i*54; iconTile(ctx, g, X, y-32, 40, c); ctx.fillStyle = white; ctx.font = recapFont(600, 34); ctx.fillText(recapFit(ctx, t, W-2*X-58), X+58, y); });
  // pied
  ctx.fillStyle = "rgba(255,255,255,.4)"; ctx.font = recapFont(500, 26);
  ctx.fillText("ASCEN · musculation à la maison", X, H-50);
  return cv;
}

// ================= REWIND : le bilan animé (mois / année) =================
// Diaporama plein écran façon « story » : on rembobine la période (la date défile à
// l'envers), puis chaque écran raconte un chiffre avec une animation. Toucher à droite
// pour avancer, à gauche pour revenir, maintenir pour mettre en pause, glisser vers le
// bas pour fermer. Le dernier écran propose l'image récapitulative à partager.

const RW_DUR = 5600; // durée d'un écran (ms)

// ---------- données complémentaires ----------
function rewindData(kind, key){
  const st = recapStats(kind, key);
  const list = S.sessions.filter(s=>s.date.startsWith(key));
  const sets = {}, wd = [0,0,0,0,0,0,0];
  let morning = 0, timed = 0;
  list.forEach(s=>{
    wd[parseISO(s.date).getDay()]++;
    const h = startHour(s); if(h!=null){ timed++; if(h<12) morning++; }
    s.exos.forEach(ex=>{ const c = ex.sets.filter(x=>x.done).length; if(c && EXO_MAP[ex.exoId]) sets[ex.exoId] = (sets[ex.exoId]||0)+c; });
  });
  const top = Object.keys(sets).sort((a,b)=>sets[b]-sets[a]).slice(0,3).map(id=>({ def:EXO_MAP[id], n:sets[id] }));
  // meilleurs records de la période : plus forte charge par exercice
  const prs = {};
  list.forEach(s=>s.exos.forEach(ex=>ex.sets.forEach(x=>{ if(!x.pr) return; const d = EXO_MAP[ex.exoId]; if(!d) return;
    const cur = prs[ex.exoId]; if(!cur || (x.weight||0)>(cur.weight||0) || ((x.weight||0)===(cur.weight||0) && x.reps>cur.reps)) prs[ex.exoId] = { def:d, weight:x.weight, reps:x.reps }; })));
  const bestDay = wd.indexOf(Math.max(...wd));
  const medals = [];
  Object.keys(S.medals||{}).forEach(id=>{ const m = MEDAL_MAP[id]; if(!m) return; Object.entries(S.medals[id].d||{}).forEach(([k, iso])=>{ if(iso && localISO(new Date(iso)).startsWith(key)) medals.push({ m, tier:+k }); }); });
  // un trophée n'apparaît qu'une fois, à son meilleur palier de la période
  const bestOf_ = {}; medals.forEach(x=>{ if(!bestOf_[x.m.id] || x.tier>bestOf_[x.m.id].tier) bestOf_[x.m.id] = x; });
  medals.length = 0; Object.values(bestOf_).forEach(x=>medals.push(x));
  medals.sort((a,b)=>(b.m.secret?9:b.tier)-(a.m.secret?9:a.tier));
  // jours actifs (mois) ou séances par mois (année) pour la frise
  let days = null;
  if(kind==="month"){ const d0 = parseISO(key+"-01"), n = new Date(d0.getFullYear(), d0.getMonth()+1, 0).getDate(), set = new Set(list.map(s=>+s.date.slice(8)));
    days = { first:(d0.getDay()+6)%7, n, on:set }; }
  return Object.assign(st, { list, top, prs:Object.values(prs).sort((a,b)=>(b.weight||0)-(a.weight||0)).slice(0,3), bestDay: list.length ? bestDay : -1,
    morningPct: timed ? Math.round(morning/timed*100) : null, medalList:medals.slice(0,6), days });
}
function tonnageCompare(kg){
  const refs = [[6000,"éléphant","éléphants"],[1200,"voiture","voitures"],[300,"piano à queue","pianos à queue"],[80,"machine à laver","machines à laver"]];
  const r = refs.find(([w])=>kg>=w*1.5) || refs[refs.length-1];
  const n = Math.max(1, Math.round(kg/r[0]));
  return `${n>=2 ? `${fmtNum(n)} ${r[2]}` : `un ${r[1]}`}`;
}

function sessionsPRs(list){ return list.reduce((t,s)=>t+sessionPRCount(s), 0); }

// ---------- sons (synthétisés, calés sur les animations CSS de chaque diapo) ----------
// Chaque diapo joue sur son propre bus : passer à la suivante coupe net les sons prévus de la
// précédente. Les délais reprennent ceux du CSS (.rw-cal, .rw-plates, .rw-ring…) et des compteurs.
const RW_PENTA = [523.25, 587.33, 659.25, 783.99, 880, 1046.5, 1174.7, 1318.5, 1568, 1760];
// bus d'une diapo : [sec, envoi vers la réverbération] ; couper l'envoi laisse la salle s'éteindre
// d'elle-même (pas de coupure sèche), couper le sec arrête net les notes prévues
function rwMute(){
  if(!rw || !rw.bus) return;
  const b = rw.bus; rw.bus = null;
  try{ b.forEach(n=>n.gain.setTargetAtTime(0.0001, AC.currentTime, 0.05)); setTimeout(()=>{ b.forEach(n=>{ try{ n.disconnect(); }catch(e){} }); }, 600); }catch(e){}
}
// pause (appui long) : le son baisse sans s'arrêter, et revient au relâché
function rwDuck(on){
  if(!rw || !rw.bus || !AC) return;
  try{ rw.bus.forEach(n=>n.gain.setTargetAtTime(on ? 0.25 : 1, AC.currentTime, 0.12)); }catch(e){}
}
function rwSound(fn){
  rwMute();
  if(!rw || !soundOn() || document.hidden || !audioReady()) return;
  const r = rw, run = ()=>{
    if(rw!==r) return;
    try{
      const dry = AC.createGain(), wet = AC.createGain(); dry.connect(SFX_OUT); if(SFX_WET) wet.connect(SFX_WET);
      r.bus = [dry, wet]; SFX_BUS = dry; SFX_BUS_WET = wet; fn();
    }catch(e){} finally{ SFX_BUS = SFX_BUS_WET = null; }
  };
  if(AC.state==="running") run(); else AC.resume().then(run).catch(()=>{});
}
// fond musical : un accord tenu par diapo, qui avance comme une petite histoire (do, la mineur,
// fa, sol…) ; très bas dans le mélange, il lie les sons des animations entre eux
const RW_PADS = [[130.81,164.81,196], [110,130.81,164.81], [87.31,110,130.81], [98,123.47,146.83]];
function rwPad(i, dur){ RW_PADS[i%RW_PADS.length].forEach((f,k)=>pad(f*2, 0.05+k*0.04, dur, 0.018)); }
// pincement doux (triangle court) et « tic » de compteur
function rwPluck(f, t, g){ tone(f, t, 0.32, { gain:g||0.07, type:"triangle", att:0.004, wet:1 }); tone(f*2, t, 0.12, { gain:(g||0.07)*0.3 }); }
function rwThud(t, g){ tone(150, t, 0.16, { gain:g||0.22, to:70, att:0.003 }); tok(t, 120, 0.6); }
// compteur : un tic à chaque cran, de plus en plus espacés (même courbe que le chiffre), puis une cloche
function rwCountTicks(t0, dur){
  const N = 16;
  for(let k=1;k<=N;k++){ const p = 1-Math.pow(1-k/N, 1/4); tone(520*Math.pow(2, k/N), t0+p*dur, 0.05, { gain:0.045, type:"triangle", att:0.002 }); }
  bell(NT.E6, t0+dur, 0.7, 0.09); bell(NT.A6, t0+dur+0.06, 0.6, 0.06);
}
// la bande qui se rembobine : souffle qui accélère puis ralentit, crans de lecture, puis le « clac » d'arrêt
function rwTapeSound(delay, dur){
  if(!dur){ bell(NT.C6, delay, 0.6, 0.1); return; }
  whoosh(delay, dur, 600, 3200, 0.06);
  tone(420, delay, dur, { gain:0.018, type:"sawtooth", to:180, att:0.2 });
  const N = Math.round(10+dur/90);
  for(let k=1;k<N;k++){ const e = k/N, p = e<.5 ? Math.sqrt(e/2) : 1-Math.sqrt((1-e)/2); tok(delay+p*dur, 230+e*120, 0.35); }
  const end = delay+dur;
  rwThud(end, 0.18); bell(NT.C6, end+0.05, 0.9, 0.1); bell(NT.G6, end+0.12, 0.8, 0.07);
}
function rwSlideSounds(sl, n){
  const reduce = reducedMotion();

function openRewind(kind, key){
  kind = kind||"month"; key = key||recapDefault(kind);
  closeSheet();
  const { slides } = rwSlides(kind, key);
  let el = qs("#rewind"); if(el) el.remove();
  el = document.createElement("div"); el.id = "rewind"; el.setAttribute("role","dialog"); el.setAttribute("aria-label","Rewind");
  el.innerHTML = `<div class="rw-bgs"><i></i><i></i><i></i></div>
    <div class="rw-top"><div class="rw-prog">${slides.map(()=>`<span><i></i></span>`).join("")}</div>
      <button class="rw-x" data-a="rwClose" aria-label="Fermer">${icon("close")}</button></div>
    <div class="rw-stage-wrap" id="rwStage"></div>`;
  document.body.appendChild(el);
  rw = { kind, key, slides, i:-1, t:0, last:0, paused:false, raf:0, el };
  requestAnimationFrame(()=>el.classList.add("show"));
  if(kind==="month") { S.meta.recapSeen = key; save(); }
  rwGo(0);
  rw.raf = requestAnimationFrame(rwTick);
  bindRewindGestures(el);
}
function rwGo(i){
  if(!rw) return;
  i = Math.max(0, Math.min(rw.slides.length-1, i));
  const sl = rw.slides[i], stage = qs("#rwStage", rw.el);
  // déjà sur cette diapo (toucher à la fin, double toucher) : rien à refaire
  if(i===rw.i && qs(".rw-slide:not(.out)", stage)) return;
  // toutes les diapos encore affichées s'en vont : avec des touchers rapides, la précédente n'était
  // pas toujours la première du conteneur, et les écrans finissaient par se superposer
  qsa(".rw-slide:not(.out)", stage).forEach(old=>{ old.classList.add("out", i<rw.i ? "back" : "fwd"); setTimeout(()=>old.remove(), 400); });
  const n = document.createElement("div");
  n.className = "rw-slide" + (i<rw.i ? " from-back" : "");
  n.innerHTML = `<div class="rw-in">${sl.html}</div>`;
  stage.appendChild(n);
  rw.el.dataset.bg = sl.bg;
  rw.i = i; rw.t = 0;
  qsa(".rw-prog span", rw.el).forEach((s,k)=>{ s.classList.toggle("done", k<i); s.classList.toggle("cur", k===i); qs("i", s).style.transform = `scaleX(${k<i?1:0})`; });
  requestAnimationFrame(()=>n.classList.add("in"));
  rwCounts(n);
  if(sl.intro) rwRewindDate(n);
  if(sl.outro){ const img = qs("#rwImg", n); if(img){ img.src = drawRecap(rw.kind, rw.key).toDataURL("image/png"); } confettiBurst(null, innerHeight*0.25, 90); }
  if(!sl.intro) rwSlideSounds(sl, n);
}
function rwTick(now){
  if(!rw) return;
  const dt = rw.last ? Math.min(100, now-rw.last) : 0; rw.last = now;
  const sl = rw.slides[rw.i];
  if(!rw.paused && !sl.outro){
    rw.t += dt;
    const dur = sl.intro ? 3400 : RW_DUR;
    const bar = qs(`.rw-prog span:nth-child(${rw.i+1}) i`, rw.el);
    if(bar) bar.style.transform = `scaleX(${Math.min(1, rw.t/dur).toFixed(4)})`;
    if(rw.t>=dur) rwGo(rw.i+1);
  }
  rw.raf = requestAnimationFrame(rwTick);
}
function closeRewind(){
  if(!rw) return;
  cancelAnimationFrame(rw.raf);
  rwMute();
  const el = rw.el; rw = null;
  el.classList.remove("show"); el.classList.add("closing");
  setTimeout(()=>el.remove(), 350);
}
// compteurs animés (data-to, data-dec)
function rwCounts(root){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  qsa("[data-to]", root).forEach(el=>{
    const to = parseFloat(el.dataset.to), dec = +(el.dataset.dec||0);
    const f = v=>dec ? v.toLocaleString("fr-FR",{ minimumFractionDigits:dec, maximumFractionDigits:dec }) : fmtNum(v);
    if(reduce){ el.textContent = f(to); return; }
    const t0 = performance.now()+260, dur = 1300;
    (function step(t){ const p = Math.max(0, Math.min(1, (t-t0)/dur)), e = 1-Math.pow(1-p, 4); el.textContent = f(to*e); if(p<1 && el.isConnected) requestAnimationFrame(step); })(performance.now());
  });
}
// le « rembobinage » : la date recule jour par jour jusqu'au début de la période
function rwRewindDate(root){
  const dateEl = qs("#rwDate", root), sub = qs("#rwSub", root);
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const end = rw.kind==="year" ? rw.key+"-01-01" : rw.key+"-01", start = todayISO() < end ? end : todayISO();
  const total = Math.max(1, daysBetween(end, start)), t0 = performance.now()+350, dur = reduce ? 0 : Math.min(2200, 900+total*6);
  const kind = rw.kind, key = rw.key, name = S.settings.name;
  root.classList.add("rewinding");
  rwSound(()=>{ whoosh(0, 0.5, 300, 1800, 0.08); rwTapeSound(0.35, dur/1000); });
  (function step(t){
    if(!dateEl.isConnected) return;
    const p = dur ? Math.max(0, Math.min(1, (t-t0)/dur)) : 1, e = p<.5 ? 2*p*p : 1-Math.pow(-2*p+2, 2)/2;
    dateEl.textContent = fmtDate(addDaysISO(start, -Math.round(total*e)), "long");
    if(p<1){ requestAnimationFrame(step); return; }
    root.classList.remove("rewinding"); root.classList.add("landed");
    dateEl.textContent = recapTitle(kind, key);
    if(sub) sub.textContent = name ? `${name}, voici ce que tu as accompli.` : "Voici ce que tu as accompli.";
    haptic(20);
  })(performance.now());
}
function bindRewindGestures(el){
  let down = null, holdT = 0;
  el.addEventListener("pointerdown", e=>{
    if(e.target.closest("button,a")) return;
    down = { x:e.clientX, y:e.clientY, t:performance.now() };
    holdT = setTimeout(()=>{ if(rw){ rw.paused = true; el.classList.add("paused"); rwDuck(true); } }, 220);
  });
  el.addEventListener("pointermove", e=>{
    if(!down) return;
    const dy = e.clientY-down.y;
    if(dy>12){ clearTimeout(holdT); el.style.transform = `translateY(${dy}px) scale(${1-Math.min(dy,300)/2400})`; el.style.transition = "none"; }
  });
  const up = e=>{
    if(!down || !rw) return; clearTimeout(holdT);
    const dy = e.clientY-down.y, dx = e.clientX-down.x, held = performance.now()-down.t > 220;
    el.style.transition = ""; el.style.transform = "";
    const was = rw.paused; rw.paused = false; el.classList.remove("paused"); if(was) rwDuck(false);
    down = null;
    if(dy>110){ closeRewind(); return; }
    if(held && was) return; // on relâche après une pause
    if(Math.abs(dx)>60){ rwGo(rw.i + (dx<0 ? 1 : -1)); return; }
    if(e.clientX < innerWidth*0.3) rwGo(rw.i-1); else if(!rw.slides[rw.i].outro) rwGo(rw.i+1);
  };
  el.addEventListener("pointerup", up); el.addEventListener("pointercancel", ()=>{ clearTimeout(holdT); down = null; if(rw){ if(rw.paused) rwDuck(false); rw.paused = false; el.classList.remove("paused"); } el.style.transform = ""; });
}
document.addEventListener("keydown", e=>{
  if(!rw) return;
  if(e.key==="Escape") closeRewind();
  else if(e.key==="ArrowRight") rwGo(rw.i+1);
  else if(e.key==="ArrowLeft") rwGo(rw.i-1);
});

// Stimulus par muscle : séries « pondérées » (muscle principal = 1 série, muscle secondaire = ½),
// la méthode de comptage de la méta-régression de Pelland et al. (67 études, 2 058 participants).
const VOL_GROUPS = [["pect","Pectoraux"],["dos","Dos"],["epaules","Épaules"],["biceps","Biceps"],["triceps","Triceps"],["quadriceps","Quadriceps"],["ischios","Ischios"],["fessiers","Fessiers"],["mollets","Mollets"],["abdos","Abdos"]];
// repères (Pelland et al.) : ~4 séries pondérées par semaine pour un gain de muscle mesurable ;
// au-delà le gain continue mais ralentit (pas de plafond net) ; la force plafonne vers ~3 séries
const STIM = { min:4, high:10 };
function muscleVolume(days){
  return memo("muscleVol"+days+todayISO(), ()=>{
    const cutoff = addDaysISO(todayISO(), -days), sets = {}, dset = {};
    for(let i=S.sessions.length-1;i>=0;i--){
      const s = S.sessions[i]; if(s.date<=cutoff) break;
      for(const ex of s.exos){
        const def = EXO_MAP[ex.exoId]; if(!def || isStretch(def)) continue;
        // une série facile (3 répétitions ou plus en réserve) compte ½ : loin de l'échec, elle stimule moins
        const n = ex.sets.reduce((t,st)=>t+(st.done ? (st.effort===1 ? .5 : 1) : 0), 0); if(!n) continue;
        def.muscles.forEach((m,k)=>{ sets[m] = (sets[m]||0) + (k===0 ? n : n/2); (dset[m] = dset[m]||new Set()).add(s.date); });
      }
    }
    return VOL_GROUPS.map(([id,n])=>({ id, n, sets:Math.round((sets[id]||0)*2)/2, freq:dset[id] ? dset[id].size : 0, region:REGION_OF_MUSCLE[id] }));
  });
}
function weekVolume(){ return muscleVolume(7); }
function stimZone(v){ return v>=STIM.high ? "high" : v>=STIM.min ? "ok" : v>0 ? "low" : "none"; }
function recentPRs(n){
  const out = [];
  for(let i=S.sessions.length-1;i>=0 && out.length<n;i--){
    const s = S.sessions[i];
    s.exos.forEach(ex=>ex.sets.forEach(st=>{ if(st.done && st.pr && out.length<n) out.push({ s, def:EXO_MAP[ex.exoId], st }); }));
  }
  return out.filter(x=>x.def);
}

// ---------- projection d'un exercice (réglage Motivation, 4.0) ; l'indice de force est dans strength.js ----------
function exoMetric(def, ex, kgOnly){
  let m = 0;
  for(const st of ex.sets){ if(!st.done || !(st.reps>0)) continue;
    const v = kgType(def) ? (st.weight ? (kgOnly ? st.weight : estimated1RM(st.weight, st.reps)) : 0) : st.reps;
    if(v>m) m = v; }
  return m;
}
function exoHistory(kgOnly){
  return memo("exoHist"+(kgOnly?1:0), ()=>{ const h = {};
    for(const s of S.sessions) for(const ex of s.exos){ const def = EXO_MAP[ex.exoId]; if(!def || isStretch(def)) continue;
      const v = exoMetric(def, ex, kgOnly); if(v>0) (h[ex.exoId] = h[ex.exoId] || []).push({ date:s.date, v }); }
    return h; });
}
// pente des moindres carrés (unité de y par unité de x)
function slopeOf(pts){
  const n = pts.length; if(n<2) return 0;
  const mx = pts.reduce((a,p)=>a+p[0],0)/n, my = pts.reduce((a,p)=>a+p[1],0)/n;
  const den = pts.reduce((a,p)=>a+(p[0]-mx)**2,0); return den ? pts.reduce((a,p)=>a+(p[0]-mx)*(p[1]-my),0)/den : 0;
}
// l'exercice le plus pratiqué ces 8 semaines (au moins 4 fois) et où il mène en 8 semaines au même rythme
function exoProjection(){
  return memo("exoProj"+todayISO(), ()=>{
    const since = addDaysISO(todayISO(), -56), hist = exoHistory(true);
    let best = null;
    Object.keys(hist).forEach(id=>{ const win = hist[id].filter(x=>x.date>since); if(win.length>=4 && (!best || win.length>best.win.length)) best = { id, win }; });
    if(!best) return null;
    const def = EXO_MAP[best.id], t0 = best.win[0].date, pts = best.win.map(x=>[daysBetween(t0, x.date), x.v]);
    const slope = slopeOf(pts), cur = Math.max(...best.win.slice(-2).map(x=>x.v));
    if(slope<=0) return { def, cur, flat:true };
    let proj = Math.min(cur*1.25, cur + slope*56);
    const lt = loadableTypeOf(def), owned = lt && (S.equipment.weights[lt]||[]).filter(w=>w>cur && w<=proj+0.01).sort((a,b)=>a-b);
    proj = kgType(def) ? (owned && owned.length ? owned[owned.length-1] : Math.round(proj*2)/2) : Math.round(proj);
    if(proj<=cur) return { def, cur, flat:true };
    return { def, cur, proj, date:addDaysISO(todayISO(), 56) };
  });
}

function suggestTarget(exoId, kind){
  const def = EXO_MAP[exoId], cur = bestOf(exoId, kind);
  if(kind==="kg"){
    if(!cur) return 10;
    const v = nextWeight(def, nextWeight(def, cur)) || 0;
    return v>cur ? v : round1(cur + 2*(DEFAULT_INCREMENT[kgType(def)]||2)); // au-delà des charges possédées
  }
  if(kind==="sec") return Math.max(30, Math.ceil(cur*1.25/5)*5);
  return Math.max(def.repsMin||5, Math.ceil(cur*1.3) || def.repsMax || 10);
}

// ================= INDICE DE FORCE (modèle 4.0, sourcé) =================
// Ce que fait l'app, et sur quoi elle s'appuie (détails et liens dans la feuille « Comment c'est calculé ») :
// 1. Force par exercice = 1RM estimé de la meilleure série. Moyenne des formules d'Epley et de Brzycki
//    (Brzycki est celle de Fitbod) jusqu'à 10 répétitions ; au-delà, Epley seul et une confiance moindre
//    (LeSuer 1997 ; Mayhew 2008 : précision moindre au-delà de ~10 reps). Les répétitions en réserve
//    déclarées (« 0 », « 1–2 », « 3 ou + ») sont ajoutées aux répétitions faites : échelle RIR de
//    Zourdos/Helms 2016 ; on prend la borne basse, car on sous-estime d'environ 1 rep sa marge (Halperin 2022).
// 2. Pompes : la charge réelle est un pourcentage du poids du corps mesuré au sol (Ebben 2011 : 64 % ;
//    genoux 49 % ; mains surélevées 55 % ; pieds surélevés 70 %). Avec une pesée, elles comptent en kg.
//    Sans pesée, et pour les autres exercices au poids du corps, la même formule s'applique à charge
//    constante (1RM relatif = 1 + reps/30, moyenné avec Brzycki) : la charge s'annule dans le rapport
//    actuel / départ. Passer de 10 à 20 répétitions compte donc +25 %, pas +100 %. Exercices tenus :
//    1 répétition ≈ 3 s sous tension (tempo classique), puis la même formule.
// 3. Indice = moyenne, muscle par muscle, du rapport entre la force actuelle et celle de tes 2 premières
//    séances de l'exercice (100 = ton départ). Le muscle compte, pas l'exercice : 5 curls ne pèsent
//    pas plus que les jambes (même logique que les scores par muscle de Fitbod).
// 4. Désentraînement, muscle par muscle : rien pendant 21 jours sans le travailler (Bosquet 2013 :
//    force max quasi intacte jusqu'à 28 jours ; McMaster 2013 : maintenue jusqu'à 3 semaines ;
//    Ogasawara 2013 : des pauses de 3 semaines ne coûtent rien). Ensuite −3 % par semaine
//    (McMaster 2013 : −14,5 % après 7,2 semaines ; 2 à 3 % par semaine une fois la perte lancée),
//    ×1,5 à partir de 65 ans (Bosquet 2013 : effet plus fort chez les plus âgés), 30 % au plus.
//    Une seule séance qui travaille le muscle (en principal ou en secondaire) remet le compteur à zéro : 1 séance par semaine suffit
//    à maintenir la force tant que l'intensité est là (Spiering 2021). Et la force revient vite à la
//    reprise (Staron 1991 ; Bruusgaard 2010 : les noyaux musculaires restent) : dès que tu refais
//    tes charges, la mesure réelle remplace l'estimation.
// 5. Statut d'entraînement, à la manière de Garmin : charge aiguë (7 jours) et chronique (28 jours) en
//    moyennes à pondération exponentielle (Williams 2017), en séries difficiles. Le rapport des deux
//    décrit l'évolution de ta charge ; il ne prédit pas les blessures (Impellizzeri 2020-2021).

const RIR_OF_EFFORT = { 3:0, 2:1, 1:3 };        // « à fond », « 1–2 », « 3 ou + » : borne basse
const BW_FRACTION = { pompes:.64, pompes_larges:.64, pompes_diamant:.64, pompes_genoux:.49, pompes_surelevees:.55, pompes_mur:.3, pompes_declinees:.70 };
const DETRAIN = { grace:21, perWeek:.03, senior:1.5, maxLoss:.30 };

function e1rmOf(w, reps){
  if(!w || !reps) return 0;
  if(reps<=1) return w;
  const ep = w*(1+reps/30);
  return reps<=10 ? (ep + w*36/(37-reps))/2 : ep;
}
// pesée la plus proche avant (ou, à défaut, après) une date
function bodyKgAt(iso){
  const b = S.body; if(!b || !b.length) return 0;
  let k = b[0].kg; for(const e of b){ if(e.d<=iso) k = e.kg; else break; } return k;
}
// meilleure performance d'un exercice dans une séance : { v, conf } (v en kg de 1RM estimé, ou en reps / secondes)
function sessionPerf(def, ex, date){
  let best = 0, conf = 1;
  const bwFrac = BW_FRACTION[def.id], bw = bwFrac ? bodyKgAt(date) : 0, timed = isTimed(def), kg = kgType(def);
  for(const st of ex.sets){
    if(!st.done || !(st.reps>0)) continue;
    const reps = st.reps + (timed ? 0 : (RIR_OF_EFFORT[st.effort]||0));
    let v, c = 1;
    if(kg){ if(!st.weight) continue; v = e1rmOf(st.weight, reps); c = reps>10 ? .6 : 1; }
    else if(bw){ v = e1rmOf(bw*bwFrac, reps); c = reps>10 ? .6 : 1; }
    // charge constante (poids du corps sans pesée, élastique) : 1RM relatif, la charge s'annule dans le rapport
    else { v = e1rmOf(1, timed ? reps/3 : reps); c = timed ? .8 : reps>10 ? .6 : 1; }
    if(v>best){ best = v; conf = c; }
  }
  return best ? { v:best, conf } : null;
}
// historique utile, calculé une fois par version des données
function strengthData(){
  return memo("strengthData", ()=>{
    const exos = {}, muscleDays = {};
    for(const s of S.sessions) for(const ex of s.exos){
      const def = EXO_MAP[ex.exoId]; if(!def || isStretch(def)) continue;
      // le muscle est « travaillé » ce jour-là, qu'il soit principal ou secondaire (arrête le désentraînement)
      if(ex.sets.some(st=>st.done && st.reps>0)) def.muscles.forEach(m=>{ const a = muscleDays[m] || (muscleDays[m] = []); if(a[a.length-1]!==s.date) a.push(s.date); });
      const p = sessionPerf(def, ex, s.date); if(!p) continue;
      (exos[ex.exoId] = exos[ex.exoId] || []).push({ date:s.date, v:p.v, conf:p.conf });
    }
    return { exos, muscleDays };
  });
}
// un record non retrouvé s'estompe : 2 séances en dessous ne comptent pas (jour sans, fatigue
// passagère), puis −1,5 % par séance qui ne le retrouve pas (−15 % au plus). Choix de modélisation
// (pas une mesure publiée) : lent, pour ne réagir qu'aux tendances.
function peakFade(misses){ return misses<=2 ? 1 : Math.max(.85, 1-.015*(misses-2)); }
// ---------- forme d'une séance (jour sans, fatigue) ----------
// Chaque exercice est comparé à sa forme habituelle juste avant : la médiane de ses performances des
// 6 dernières semaines (6 au plus, 3 au moins ; 1RM estimé, répétitions en réserve comprises). Assez
// stable pour que deux séances faibles d'affilée ne deviennent pas la nouvelle « normale ». Ne comptent pas : les exercices faits
// exprès plus facilement (« 3 ou + » en réserve), ceux d'une semaine allégée, les reprises après 3
// semaines, ceux qui ont moins de 3 performances. Résultat : rapport médian (1 = forme habituelle).
function sessionForm(session){
  if(!session) return null;
  const { exos } = strengthData(), out = [];
  session.exos.forEach(ex=>{
    const def = EXO_MAP[ex.exoId]; if(!def || isStretch(def) || ex.deload) return;
    const done = ex.sets.filter(st=>st.done && st.reps>0); if(!done.length || done.every(st=>st.effort===1)) return;
    const from = addDaysISO(session.date, -42), prior = (exos[ex.exoId]||[]).filter(x=>x.date<session.date && x.date>=from).slice(-6);

function bestSetOf(def, ex, date){
  let best = null;
  ex.sets.forEach(st=>{ if(!st.done || !(st.reps>0)) return; const p = sessionPerf(def, { sets:[st] }, date); if(p && (!best || p.v>best.v)) best = { v:p.v, txt:setTxt(def, st) }; });

function thenVsNow(){
  return memo("thenNow"+todayISO(), ()=>{
    const t0 = todayISO(), recent = addDaysISO(t0, -21), target = addDaysISO(t0, -90), per = {};
    S.sessions.forEach(s=>s.exos.forEach(ex=>{ const def = EXO_MAP[ex.exoId]; if(!def || isStretch(def)) return;
      const b = bestSetOf(def, ex, s.date); if(b) (per[ex.exoId] = per[ex.exoId] || []).push(Object.assign({ date:s.date }, b)); }));
    const out = [];
    Object.keys(per).forEach(id=>{
      const h = per[id]; if(h.length<3) return;
      const cur = h.filter(x=>x.date>=recent); if(!cur.length) return;
      const now = cur.reduce((a,b)=>b.v>=a.v ? b : a);
      let then = h.filter(x=>{ const d = daysBetween(x.date, t0); return d>=60 && d<=120; })
        .sort((a,b)=>Math.abs(daysBetween(a.date, target))-Math.abs(daysBetween(b.date, target)))[0], label;
      if(then) label = "Il y a 3 mois";
      else { then = h[0]; const d = daysBetween(then.date, t0); if(d<28) return;
        label = d>=50 ? `Il y a ${Math.round(d/30.4)} mois` : `Il y a ${Math.round(d/7)} semaines`; }
      const pct = Math.round((now.v/then.v-1)*100);
      if(pct>=5) out.push({ def:EXO_MAP[id], then, now, pct, label });
    });
    return out.sort((a,b)=>b.pct-a.pct);
  });
}

  T3D.tex = {
    // tranche cannelée (autour de l'axe de révolution) et fin brossage
    reed: t3dCanvasTex(T, 512, 8, (g, w, h)=>{ for(let x=0;x<w;x++){ const v = 128 + 110*Math.sin(x/w*Math.PI*2*180); g.fillStyle = `rgb(${v},${v},${v})`; g.fillRect(x, 0, 1, h); } }),
    // satiné / sablé pour les couronnes des formes extrudées
    frost: t3dCanvasTex(T, 256, 256, (g, w, h)=>noise(g, w, h, 150, 90), [3,3]),
    // guilloché en rayons (émail sur face de révolution : u = angle, v = rayon)
    rays: t3dCanvasTex(T, 1024, 32, (g, w, h)=>{ const id = g.createImageData(w, h);
      for(let y=0;y<h;y++){ const ph = Math.sin(y/h*Math.PI*6)*1.6; for(let x=0;x<w;x++){ const v = 128 + 70*Math.sin(x/w*Math.PI*2*72 + ph), i = (y*w+x)*4; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; } }
      g.putImageData(id, 0, 0); }),
    // guilloché en soleil (émail des formes extrudées, coordonnées planes)
    sun: t3dCanvasTex(T, 256, 256, (g, w, h)=>{
      const cx = w/2, cy = h/2, id = g.createImageData(w, h);
      for(let y=0;y<h;y++) for(let x=0;x<w;x++){ const dx = x-cx, dy = y-cy, a = Math.atan2(dy, dx), r = Math.hypot(dx, dy);
        const v = 128 + 60*Math.sin(a*64 + Math.sin(r*.18)*1.4) + 30*Math.sin(r*.7); const i = (y*w+x)*4; id.data[i] = id.data[i+1] = id.data[i+2] = v; id.data[i+3] = 255; }
      g.putImageData(id, 0, 0); }, [.62,.62]),
    spark: t3dCanvasTex(T, 64, 64, (g)=>{ const r = g.createRadialGradient(32,32,0,32,32,32); r.addColorStop(0,"rgba(255,255,255,1)"); r.addColorStop(.25,"rgba(255,228,160,.9)"); r.addColorStop(1,"rgba(255,180,60,0)"); g.fillStyle = r; g.fillRect(0,0,64,64); }),
    star: t3dCanvasTex(T, 64, 64, (g)=>{ g.translate(32,32); const grd = g.createRadialGradient(0,0,0,0,0,30); grd.addColorStop(0,"rgba(255,255,255,1)"); grd.addColorStop(.4,"rgba(215,240,255,.8)"); grd.addColorStop(1,"rgba(160,200,255,0)"); g.fillStyle = grd;
      g.beginPath(); for(let i=0;i<8;i++){ const a = i*Math.PI/4, rr = i%2 ? 5 : 30; g.lineTo(Math.cos(a)*rr, Math.sin(a)*rr); } g.closePath(); g.fill(); }),
  };
  T3D.tex.sun.offset.set(.5, .5); T3D.tex.frost.offset.set(.5, .5);
  return T3D.tex;
}

// ---------- matériaux ----------
function t3dMats(T, m, tier){
  const key = !tier ? 0 : m.secret ? "s" : tier, enamelBase = tier ? (IOS_COL[m.c] || IOS_COL.orange) : "#7A8089";
  const ck = key+"|"+enamelBase;
  if(T3D.mats.has(ck)) return T3D.mats.get(ck);
  const X = t3dTextures(T), M = T3D_METALS[key];
  let mats;
  if(M.diamond){
    // Diamant : un vrai cristal plutôt qu'un métal teinté. Transmission (on voit au travers),
    // indice de réfraction du diamant (2,42) et dispersion : la lumière se décompose en « feu »
    // coloré sur les arêtes des facettes. Posé sur un fond platine miroir, facetté lui aussi,
    // pour que la réfraction ait quelque chose à renvoyer, et un émail nuit qui le fait ressortir.
    const crystal = new T.MeshPhysicalMaterial({ color:"#ffffff", metalness:0, roughness:.02, transmission:1, thickness:.5, ior:2.42, dispersion:6,
      specularIntensity:1, specularColor:"#ffffff", envMapIntensity:2.4, clearcoat:1, clearcoatRoughness:0, attenuationColor:"#d4ecff", attenuationDistance:2.2,
      iridescence:.3, iridescenceIOR:1.9, iridescenceThicknessRange:[180, 520], flatShading:true });
    mats = {
      key, crystal, body:crystal, frame:crystal,
      setting: new T.MeshPhysicalMaterial({ color:"#E6ECF2", metalness:1, roughness:.1, clearcoat:1, clearcoatRoughness:.03, envMapIntensity:1.6, flatShading:true }),
      polish: new T.MeshPhysicalMaterial({ color:"#F5F8FB", metalness:1, roughness:.08, clearcoat:1, clearcoatRoughness:.03, envMapIntensity:1.7 }),
      enamelRays: new T.MeshPhysicalMaterial({ color:hexMix(enamelBase, "#0A1628", .95), metalness:.1, roughness:.35, bumpMap:X.rays, bumpScale:1.4, clearcoat:1, clearcoatRoughness:.04, envMapIntensity:.8 }),
      enamelSun: new T.MeshPhysicalMaterial({ color:hexMix(enamelBase, "#0A1628", .95), metalness:.1, roughness:.35, bumpMap:X.sun, bumpScale:1.4, clearcoat:1, clearcoatRoughness:.04, envMapIntensity:.8 }),
    };
  } else {
    const special = M.iris ? { iridescence:1, iridescenceIOR:1.6, iridescenceThicknessRange:[250, 900], envMapIntensity:1.2 } : {};
    mats = {
      key,
      body: new T.MeshPhysicalMaterial(Object.assign({ color:M.c, metalness:1, roughness:M.r, clearcoat:.3, clearcoatRoughness:.25, bumpMap:X.reed, bumpScale:.6 }, special)),
      frame: new T.MeshPhysicalMaterial(Object.assign({ color:M.c, metalness:1, roughness:M.r+.08, clearcoat:.3, clearcoatRoughness:.3, roughnessMap:X.frost }, special)),
      // symbole : métal poli, plus clair que la couronne, qui capte la lumière (pas un miroir sombre)
      polish: new T.MeshPhysicalMaterial(Object.assign({ color:hexMix(M.c, "#ffffff", tier ? .25 : .1), metalness:1, roughness:tier ? .16 : .32, clearcoat:1, clearcoatRoughness:.05, envMapIntensity:1.45 }, special)),
      // émail : couleur profonde et saturée (moins de reflets) pour que le symbole ressorte
      enamelRays: new T.MeshPhysicalMaterial({ color:hexMix(enamelBase, "#000000", .38), metalness:0, roughness:.55, bumpMap:X.rays, bumpScale:1.4, clearcoat:.9, clearcoatRoughness:.06, envMapIntensity:.55 }),
      enamelSun: new T.MeshPhysicalMaterial({ color:hexMix(enamelBase, "#000000", .38), metalness:0, roughness:.55, bumpMap:X.sun, bumpScale:1.4, clearcoat:.9, clearcoatRoughness:.06, envMapIntensity:.55 }),
    };
  }
  mats.shadow = new T.MeshStandardMaterial({ color:"#000000", transparent:true, opacity:.38, depthWrite:false, roughness:1, metalness:0 });
  mats.ck = ck;
  T3D.mats.set(ck, mats);
  return mats;
}

// ---------- symbole ----------
// Glyphe SVG de l'app (24 × 24) → géométrie : pleins extrudés et biseautés, traits en tubes
// arrondis (avec rotules aux angles et bouts ronds). « dumbbell » a son modèle dédié.
function t3dPolyCurve(T, pts, closed){
  if(!T3D.PolyCurve){
    T3D.PolyCurve = class extends T.Curve {
      constructor(p, c){ super(); this.p = c ? p.concat([p[0]]) : p; this.L = [0]; for(let i=1;i<this.p.length;i++) this.L.push(this.L[i-1] + this.p[i].distanceTo(this.p[i-1])); }
      getPoint(t, out){ out = out || new T.Vector3(); const L = this.L, d = t*L[L.length-1]; let i = 1; while(i<L.length-1 && L[i]<d) i++;
        const a = this.p[i-1], b = this.p[i], k = (d-L[i-1])/Math.max(1e-6, L[i]-L[i-1]); return out.set(a.x+(b.x-a.x)*k, a.y+(b.y-a.y)*k, 0); }
    };
  }
  return new T3D.PolyCurve(pts, closed);
}
function t3dGlyph(T, name, mats){
  const g = new T.Group();
  if(name==="dumbbell") return t3dDumbbell(T, mats.polish);
  // un attribut répété (ex. stroke-width) rend le SVG invalide pour le lecteur XML : on garde le dernier
  const src = (GLYPHS[name] || GLYPHS.medal).replace(/<(\w+)([^>]*?)(\/?)>/g, (all, tag, attrs, end)=>{
    const seen = {}; (attrs.match(/\s[\w-]+="[^"]*"/g)||[]).forEach(a=>{ seen[a.trim().split("=")[0]] = a; });
    return `<${tag}${Object.values(seen).join("")}${end}>`;
  });
  const data = new T.SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24">${src}</svg>`);
  const joint = t3dGeo("joint", ()=>new T.SphereGeometry(1, 14, 10));
  data.paths.forEach(p=>{
    const st = p.userData.style || {};
    if(st.fill && st.fill!=="none"){
      T.SVGLoader.createShapes(p).forEach(sh=>{
        const geo = new T.ExtrudeGeometry(sh, { depth:.5, bevelEnabled:true, bevelThickness:.45, bevelSize:.32, bevelSegments:3, curveSegments:10 });
        g.add(new T.Mesh(geo, mats.polish));
      });
    }
    if(st.stroke && st.stroke!=="none"){
      const r = (parseFloat(st.strokeWidth)||2)/2;
      p.subPaths.forEach(sp=>{
        const raw = sp.getPoints(10); if(raw.length<2) return;
        const pts = raw.filter((v,i)=>!i || v.distanceTo(raw[i-1])>1e-3).map(v=>new T.Vector3(v.x, v.y, 0));
        if(pts.length<2) return;
        const closed = sp.autoClose || pts[0].distanceTo(pts[pts.length-1])<1e-3;
        const curve = t3dPolyCurve(T, closed && pts[0].distanceTo(pts[pts.length-1])<1e-3 ? pts.slice(0,-1) : pts, closed);
        g.add(new T.Mesh(new T.TubeGeometry(curve, Math.min(96, Math.max(2, pts.length*3)), r, 12, closed), mats.polish));
        // rotules aux angles marqués et bouts arrondis
        pts.forEach((v,i)=>{
          let put = !closed && (i===0 || i===pts.length-1);
          if(!put && i>0 && i<pts.length-1){ const a = pts[i].clone().sub(pts[i-1]).normalize(), b = pts[i+1].clone().sub(pts[i]).normalize(); put = a.dot(b) < .9; }
          if(put){ const s = new T.Mesh(joint, mats.polish); s.position.copy(v); s.scale.setScalar(r); g.add(s); }
        });
      });
    }
  });
  // repère SVG (y vers le bas, 0–24) → repère médaille (centré, y vers le haut)
  const wrap = new T.Group(); wrap.add(g);
  g.position.set(-12, 12, 0); g.scale.set(1, -1, 1);
  return wrap;
}
function t3dTextGlyph(T, text, mats){
  // texte court (« 100 », « 7/7 ») : plaque découpée par le texte, en relief par carte de bosses
  const c = document.createElement("canvas"); c.width = 512; c.height = 256;
  const x = c.getContext("2d"); x.fillStyle = "#000"; x.fillRect(0,0,512,256);
  x.font = `800 ${text.length>2 ? 150 : 190}px -apple-system,BlinkMacSystemFont,Helvetica,Arial,sans-serif`; x.textAlign = "center"; x.textBaseline = "middle";
  x.filter = "blur(3px)"; x.fillStyle = "#fff"; x.fillText(text, 256, 136);
  const tex = new T.CanvasTexture(c);
  const mat = mats.polish.clone(); mat.alphaMap = tex; mat.bumpMap = tex; mat.bumpScale = 3; mat.alphaTest = .45; mat.transparent = false; mat.userData.own = true;
  const mesh = new T.Mesh(new T.PlaneGeometry(22, 11), mat);
  const g = new T.Group(); g.add(mesh); g.userData.flat = true;
  return g;
}
function t3dDumbbell(T, mat){
  const g = new T.Group();
  const prof = pts=>pts.map(([x,y])=>new T.Vector2(x, y));
  const plate = (r, w)=>{
    // profil parcouru dans le sens trigonométrique : faces orientées vers l'extérieur
    const p = new T.LatheGeometry(prof([[0.05,-w],[r-0.03,-w],[r,-w+0.03],[r,w-0.03],[r-0.03,w],[0.05,w]]), 64);
    const m = new T.Mesh(p, mat); m.rotation.z = Math.PI/2; return m;
  };
  const handle = new T.Mesh(new T.CylinderGeometry(0.05, 0.05, 0.66, 32), mat); handle.rotation.z = Math.PI/2; g.add(handle);
  [[-0.24, 0.23, 0.045],[-0.33, 0.17, 0.038],[0.24, 0.23, 0.045],[0.33, 0.17, 0.038]].forEach(([x, r, w])=>{ const m = plate(r, w); m.position.x = x; g.add(m); });
  [-0.395, 0.395].forEach(x=>{ const cap = new T.Mesh(new T.CylinderGeometry(0.06, 0.06, 0.03, 32), mat); cap.rotation.z = Math.PI/2; cap.position.x = x; g.add(cap); });
  const wrap = new T.Group(); wrap.add(g); g.rotation.z = -.32; g.scale.setScalar(1.25/.056); // mis à l'échelle des glyphes (unités 24)
  return wrap;
}
function t3dSymbol(T, m, tier, mats){
  const locked = !tier;
  if(m.g && typeof m.g==="object" && !(locked && m.secret)) return t3dTextGlyph(T, m.g.t, mats);
  // glyphe : construit une fois par (glyphe, matériau), puis cloné (géométries partagées)
  const name = locked && m.secret ? "lock" : (m.g || "medal"), k = name+"|"+mats.ck;
  if(!T3D.syms.has(k)){ const tpl = t3dGlyph(T, name, mats); tpl.traverse(o=>{ if(o.geometry) o.geometry.userData.keep = true; }); T3D.syms.set(k, tpl); }
  return T3D.syms.get(k).clone(true);
}

// ---------- médaille ----------
function t3dShapePoints(T, key){
  // contour de la forme (repère SVG 100 × 100) → rayon ≈ 1, y vers le haut
  if(!T3D.shapes) T3D.shapes = {};
  if(T3D.shapes[key]) return T3D.shapes[key];
  const data = new T.SVGLoader().parse(`<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100"><path d="${MEDAL_SHAPES[key]}"/></svg>`);
  const sh = T.SVGLoader.createShapes(data.paths[0])[0];
  return (T3D.shapes[key] = sh.extractPoints(32).shape.map(p=>new T.Vector2((p.x-50)/48, (50-p.y)/48)));
}
function t3dShape(T, pts, k){ return new T.Shape(pts.map(p=>new T.Vector2(p.x*k, p.y*k))); }
function t3dBuildMedal(T, m, tier){
  const mats = t3dMats(T, m, tier), medal = new T.Group();
  const shape = m.secret ? "secret" : (MEDAL_SHAPES[m.cat] ? m.cat : "regular");
  let faceZ;
  if(shape==="regular"){
    // révolution : dos et couronne (cannelée), perle polie, émail bombé guilloché
    const prof = pts=>pts.map(([x,y])=>new T.Vector2(x, y));
    const dia = T3D_METALS[mats.key].diamond;
    const face = new T.Group();
    if(dia){
      // monture platine facettée (16 pans), puis anneau de cristal taillé : table, couronne, rondiste, culasse
      face.add(new T.Mesh(t3dGeo("dia-setting", ()=>new T.LatheGeometry(prof([[0,-.22],[.96,-.22],[1.04,-.18],[1,-.13],[.84,-.11],[.8,.06],[0,.08]]), 16)), mats.setting));
      face.add(new T.Mesh(t3dGeo("dia-ring", ()=>new T.LatheGeometry(prof([[.8,-.1],[.93,-.14],[1.03,-.05],[1.03,.03],[.98,.14],[.91,.21],[.84,.17],[.8,.1],[.8,-.1]]), 16)), mats.crystal));
    } else face.add(new T.Mesh(t3dGeo("body", ()=>new T.LatheGeometry(prof([[0,-.17],[.9,-.17],[.97,-.15],[1,-.1],[1,.1],[.99,.18],[.95,.215],[.9,.2],[.87,.14],[.86,.1],[0,.1]]), 144)), mats.body));
    face.add(new T.Mesh(t3dGeo("bead", ()=>new T.LatheGeometry(prof([[.875,.13],[.862,.152],[.848,.155],[.835,.14]]), 144)), mats.polish));
    face.add(new T.Mesh(t3dGeo("enamel", ()=>new T.LatheGeometry(prof([[.84,.11],[.83,.14],[.7,.148],[.4,.152],[0,.155]]), 144)), mats.enamelRays));
    face.rotation.x = Math.PI/2;
    medal.add(face); faceZ = .155;
  } else {
    // formes extrudées : dos plein, cadre évidé biseauté (satiné) plus haut que l'émail,
    // filet poli au bord intérieur, émail guilloché en soleil posé en creux
    const pts = t3dShapePoints(T, shape);
    const dia = T3D_METALS[mats.key].diamond;
    const back = new T.Mesh(t3dGeo("back:"+shape, ()=>new T.ExtrudeGeometry(t3dShape(T, pts, .97), { depth:.1, bevelEnabled:true, bevelThickness:.04, bevelSize:.03, bevelSegments:3, curveSegments:24 })), dia ? mats.setting : mats.frame);
    back.position.z = -.16;
    const frame = new T.Mesh(t3dGeo("frame:"+shape+(dia?":d":""), ()=>{ const ring = t3dShape(T, pts, 1); ring.holes.push(new T.Path(pts.map(p=>new T.Vector2(p.x*.84, p.y*.84)).reverse()));
      return new T.ExtrudeGeometry(ring, { depth:.22, bevelEnabled:true, bevelThickness:dia ? .08 : .05, bevelSize:dia ? .07 : .045, bevelSegments:dia ? 1 : 5, curveSegments:24 }); }), mats.frame);
    frame.position.z = -.1;
    const enamel = new T.Mesh(t3dGeo("enamel:"+shape, ()=>new T.ExtrudeGeometry(t3dShape(T, pts, .86), { depth:.02, bevelEnabled:true, bevelThickness:.02, bevelSize:.015, bevelSegments:2, curveSegments:24 })), mats.enamelSun);
    enamel.position.z = .06;
    const bead = new T.Mesh(t3dGeo("bead:"+shape, ()=>new T.TubeGeometry(t3dPolyCurve(T, pts.map(p=>new T.Vector3(p.x*.83, p.y*.83, 0)), true), 160, .02, 10, true)), mats.polish);
    bead.position.z = .12;
    medal.add(back, frame, enamel, bead); faceZ = .1;
  }
  // symbole + ombre de contact (décalée vers le bas, sous le relief)
  const k = .056, yOff = shape==="force" ? .04 : shape==="secret" ? .1 : 0;
  const sym = t3dSymbol(T, m, tier, mats);
  sym.scale.set(k, k, sym.userData.flat ? k : k*.9); sym.position.set(0, yOff, faceZ + .02);
  medal.add(sym);
  if(!sym.userData.flat){
    const sh = sym.clone(true); sh.traverse(o=>{ if(o.isMesh) o.material = mats.shadow; });
    sh.position.set(.018, yOff-.03, faceZ+.004); sh.scale.set(k*1.02, k*1.02, k*.05);
    medal.add(sh);
  }
  if(shape==="regular"){ const loop = new T.Mesh(t3dGeo("loop", ()=>new T.TorusGeometry(.1, .028, 16, 48)), mats.polish); loop.position.set(0, 1.07, 0); medal.add(loop); }
  medal.userData = { mats, diamond:T3D_METALS[mats.key].diamond };
  if(medal.userData.diamond) t3dSparkles(T, medal);
  return medal;
}
function t3dDispose(obj){
  // géométries et matériaux partagés (cache) : conservés ; le reste (texte, étincelles) est libéré
  const seen = new Set();
  obj.traverse(o=>{
    if(o.geometry && !o.geometry.userData.keep && !seen.has(o.geometry)){ seen.add(o.geometry); o.geometry.dispose(); }
    if(o.material && (o.isPoints || o.material.userData.own)){ if(o.material.alphaMap && o.material.userData.own) o.material.alphaMap.dispose(); o.material.dispose(); }
  });
}

// ---------- scène (commune au rendu vivant et aux vignettes) ----------
function t3dScene(T, renderer){
  const scene = new T.Scene();
  const pmrem = new T.PMREMGenerator(renderer);
  scene.environment = pmrem.fromScene(new T.RoomEnvironment(), .035).texture; pmrem.dispose();
  const key = new T.DirectionalLight("#fff4e0", 2.3); key.position.set(-2.5, 3, 4); scene.add(key);
  const rim = new T.DirectionalLight("#ffd9a8", 1.5); rim.position.set(3, -1.5, -2); scene.add(rim);
  const fill = new T.DirectionalLight("#dfe9ff", .6); fill.position.set(2.5, 1, 3); scene.add(fill);
  scene.add(new T.AmbientLight("#ffffff", .12));
  return scene;
}
function t3dRenderer(T, canvas, keep){
  const r = new T.WebGLRenderer({ canvas, antialias:true, alpha:true, powerPreference:"low-power", preserveDrawingBuffer:!!keep });
  r.outputColorSpace = T.SRGBColorSpace; r.toneMapping = T.ACESFilmicToneMapping; r.toneMappingExposure = 1.05;
  // iOS reprend souvent la mémoire graphique quand l'app passe en arrière-plan : le contexte est
  // « perdu » et le canevas resterait vide au retour. On le note ; t3dRevive() reconstruit.
  canvas.addEventListener("webglcontextlost", e=>{ e.preventDefault(); canvas._lost = true; });
  canvas.addEventListener("webglcontextrestored", ()=>{ canvas._lost = false; t3dStart(); });
  return r;
}
// au retour dans l'app : un contexte perdu (et pas rendu) est remplacé par un neuf
function t3dRevive(){
  if(T3D.snap && T3D.snap.canvas._lost){ try{ T3D.snap.renderer.dispose(); }catch(e){} T3D.snap = null; }
  const c = T3D.ctx; if(!c || !c.canvas._lost) return;
  try{ if(c.medal) t3dDispose(c.medal); c.renderer.dispose(); }catch(e){}
  T3D.ctx = null;
  c.canvas.remove();
  const stage = qs("#t3dStage"), full = qs(".t3d-full");
  if(stage){ stage.classList.remove("live"); delete stage.dataset.mounted; }   // la médaille dessinée reprend sa place
  if(full && c.detail){ full.remove(); const card = qs(".t3d-card"); if(card) card.classList.remove("lifted"); showMedalModal(c.detail); }
  else if(stage) mountTrophy3D(stage.parentNode);
}

// ---------- vignettes (grille, listes, célébration) ----------
// Rendu hors écran, une médaille par image, file d'attente sans à-coups ; images gardées
// en mémoire (URL d'objet) pendant la session uniquement.
async function t3dSnapCtx(){
  if(T3D.snap) return T3D.snap;
  const T = await loadThree(), S_ = 256;
  const canvas = document.createElement("canvas"); canvas.width = canvas.height = S_;
  const renderer = t3dRenderer(T, canvas, true); renderer.setPixelRatio(1); renderer.setSize(S_, S_, false);
  const scene = t3dScene(T, renderer);
  const camera = new T.PerspectiveCamera(26, 1, .1, 50); camera.position.set(0, 0, 5.4);
  return (T3D.snap = { T, renderer, scene, camera, canvas });
}
function t3dSnapshot(id, tier){
  const k = id+":"+tier;
  if(T3D.cache.has(k)) return T3D.cache.get(k);
  const p = new Promise((ok, ko)=>{ T3D.queue.push({ id, tier, ok, ko }); t3dPump(); });
  T3D.cache.set(k, p);
  return p;
}
function t3dPump(){
  if(T3D.busy || !T3D.queue.length) return;
  T3D.busy = true;
  const job = T3D.queue.shift();
  const idle = window.requestIdleCallback || (f=>setTimeout(f, 16));
  idle(async ()=>{
    try{
      const s = await t3dSnapCtx(), m = MEDAL_MAP[job.id];
      const medal = t3dBuildMedal(s.T, m, job.tier);
      medal.rotation.set(-.12, .42, 0);
