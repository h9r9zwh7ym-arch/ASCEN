// ---------- rendu vivant (carte mise en avant + fiche détaillée) ----------
async function t3dContext(){
  if(T3D.ctx) return T3D.ctx;
  const T = await loadThree();
  const canvas = document.createElement("canvas"); canvas.className = "t3d-canvas";
  const renderer = t3dRenderer(T, canvas); renderer.setPixelRatio(Math.min(window.devicePixelRatio||1, 2));
  const scene = t3dScene(T, renderer);
  const glow = new T.PointLight("#ffcc66", 0, 6); glow.position.set(0, 0, 2.2); scene.add(glow);
  const camera = new T.PerspectiveCamera(28, 1, .1, 50); camera.position.set(0, 0, 5.2);
  return (T3D.ctx = { T, renderer, scene, camera, glow, canvas, medal:null, id:null, tier:0, drag:0, vel:0, unlock:null, burst:null, sparks:[], flip:0, running:false, visible:true, t0:performance.now(), last:0 });
}
function t3dSetMedal(ctx, id, tier, animate){
  if(ctx.medal && ctx.id===id && ctx.tier===tier) return;
  if(ctx.medal){ ctx.scene.remove(ctx.medal); t3dDispose(ctx.medal); }
  ctx.id = id; ctx.tier = tier;
  ctx.medal = t3dBuildMedal(ctx.T, MEDAL_MAP[id], tier);
  ctx.scene.add(ctx.medal);
  ctx.sparks = ctx.medal.userData.sparks || [];
  if(animate && !t3dReduced()) ctx.flip = performance.now();
}
// scintillements du palier diamant : étoiles posées sur la médaille, animées en direct
function t3dSparkles(T, medal){
  const X = t3dTextures(T), list = [];
  [[-.62,.58,.3,.24],[.7,.35,.28,.16],[.45,-.66,.3,.22],[-.5,-.52,.26,.12],[.05,.86,.28,.1],[-.86,.02,.27,.18]].forEach(([x,y,z,sz],i)=>{
    const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.Float32BufferAttribute([x,y,z], 3));
    const mat = new T.PointsMaterial({ size:sz, map:X.star, transparent:true, depthWrite:false, blending:T.AdditiveBlending, color:"#EAF6FF" });
    const pt = new T.Points(geo, mat); pt.userData.phase = i*1.13; medal.add(pt); list.push(pt);
  });
  medal.userData.sparks = list;
}
function t3dResize(ctx){
  const host = ctx.canvas.parentElement; if(!host) return;
  const w = host.clientWidth, h = host.clientHeight; if(!w || !h) return;
  if(ctx.w===w && ctx.h===h) return;
  ctx.w = w; ctx.h = h;
  ctx.renderer.setSize(w, h, false);
  ctx.camera.aspect = w/h;
  ctx.camera.position.z = w/h < 1 ? 5.2/(w/h)*.9 : 5.2;
  ctx.camera.updateProjectionMatrix();
}
const easeOutBack = x=>{ const c1 = 1.5, c3 = c1+1; return 1 + c3*Math.pow(x-1,3) + c1*Math.pow(x-1,2); };
const easeOutCubic = x=>1-Math.pow(1-x, 3);
function t3dBurst(ctx){
  const T = ctx.T, n = 90, pos = new Float32Array(n*3), vel = [];
  for(let i=0;i<n;i++){
    const a = Math.random()*Math.PI*2, r = .9+Math.random()*.15, sp = .9+Math.random()*1.6;
    pos[i*3] = Math.cos(a)*r; pos[i*3+1] = Math.sin(a)*r; pos[i*3+2] = (Math.random()-.5)*.3;
    vel.push([Math.cos(a)*sp, Math.sin(a)*sp+.25, (Math.random()-.2)*.8]);
  }
  const geo = new T.BufferGeometry(); geo.setAttribute("position", new T.BufferAttribute(pos, 3));
  const mat = new T.PointsMaterial({ size:.11, map:t3dTextures(T).spark, transparent:true, depthWrite:false, blending:T.AdditiveBlending, color:ctx.tier===4 ? "#DDF3FF" : "#FFD27A" });
  const pts = new T.Points(geo, mat); ctx.scene.add(pts);
  ctx.burst = { pts, vel, t:0 };
}
function t3dFrame(now){
  const ctx = T3D.ctx; if(!ctx) return;
  if(!ctx.canvas.isConnected || !ctx.visible || document.hidden || !ctx.medal || ctx.canvas._lost){ ctx.running = false; return; }
  const lively = ctx.dragging || ctx.unlock || ctx.flip || ctx.burst || Math.abs(ctx.vel)>.02;
  if(!lively && ctx.last && now-ctx.last < 30){ requestAnimationFrame(t3dFrame); return; }
  const dt = Math.min(.05, ctx.last ? (now-ctx.last)/1000 : 0); ctx.last = now;
  const t = (now-ctx.t0)/1000, reduce = t3dReduced(), M = ctx.medal;
  if(!ctx.dragging){ ctx.drag += ctx.vel*dt; ctx.vel *= Math.pow(.04, dt); ctx.drag *= Math.pow(.35, dt); }
  let ry = reduce ? .28 : Math.sin(t*.55)*.38, rx = reduce ? -.06 : Math.sin(t*.42)*.07 - .04, s = 1, lift = reduce ? 0 : Math.sin(t*1.1)*.03;
  if(ctx.flip){ const u = Math.min(1, (now-ctx.flip)/700); ry += (1-easeOutCubic(u))*Math.PI*2; if(u>=1) ctx.flip = 0; }
  if(ctx.unlock){
    const u = (now-ctx.unlock)/1000;
    if(reduce){ s = Math.min(1, u/.4); }
    else {
      s = u<.9 ? Math.max(.001, easeOutBack(Math.min(1, u/.9))) : 1;
      ry += (1-easeOutCubic(Math.min(1, u/1.9)))*Math.PI*4;
      ctx.glow.intensity = u<.5 ? u*16 : Math.max(0, 8-(u-.5)*6);
      if(u>.35 && !ctx.burstDone){ ctx.burstDone = true; t3dBurst(ctx); }
    }
    if(u>2.4){ ctx.unlock = null; ctx.glow.intensity = 0; }
  }
  M.rotation.set(rx, ry + ctx.drag, 0); M.scale.setScalar(s); M.position.y = lift;
  ctx.sparks.forEach(p=>{ const v = Math.max(0, Math.sin(t*2.2 + p.userData.phase*2.4)); p.material.size = reduce ? .12 : .02 + .26*Math.pow(v, 6); });
  if(ctx.burst){
    const b = ctx.burst; b.t += dt;
    const p = b.pts.geometry.attributes.position;
    for(let i=0;i<b.vel.length;i++){ const v = b.vel[i]; p.array[i*3] += v[0]*dt; p.array[i*3+1] += (v[1]-b.t*.9)*dt; p.array[i*3+2] += v[2]*dt; }
    p.needsUpdate = true;
    b.pts.material.opacity = Math.max(0, 1-b.t/1.5); b.pts.material.size = .11*(1-b.t/3);
    if(b.t>1.6){ ctx.scene.remove(b.pts); b.pts.geometry.dispose(); b.pts.material.dispose(); ctx.burst = null; }
  }
  t3dResize(ctx);
  ctx.renderer.render(ctx.scene, ctx.camera);
  requestAnimationFrame(t3dFrame);
}
function t3dStart(){ const c = T3D.ctx; if(c && !c.running){ c.running = true; c.last = 0; requestAnimationFrame(t3dFrame); } }
function t3dPlayUnlock(){
  const c = T3D.ctx; if(!c) return;
  c.unlock = performance.now(); c.burstDone = false; c.vel = 0; c.drag = 0;
  if(!t3dReduced()){ haptic([20,40,30]); setTimeout(()=>sfx("medal"), 250); }
  t3dStart();
}

function t3dBindDrag(el){

// ---------- Sauvegarde / restauration / installation ----------
// Tout est stocké sur l'appareil : sans sauvegarde, un effacement des données du site
// (Safari efface le stockage d'un site non installé après 7 jours sans visite) serait définitif.
function isStandalone(){ return !!(window.navigator.standalone || (window.matchMedia && matchMedia("(display-mode: standalone)").matches)); }
function backupStatusText(){
  const b = S.meta.lastBackup;
  if(!b) return S.sessions.length ? "Jamais sauvegardé — recommandé" : "Un fichier à garder dans Fichiers ou iCloud";
  const n = daysBetween(b, todayISO()), since = S.sessions.length-(S.meta.backupSessions||0);
  return `Dernière : ${n===0?"aujourd'hui":n===1?"hier":`il y a ${n} jours`}${since>0?` · ${since} séance${since>1?"s":""} depuis`:""}`;
}
function backupDue(){
  if(S.sessions.length<5) return false;
  if(S.meta.backupSnooze && daysBetween(S.meta.backupSnooze, todayISO())<14) return false;
  if(!S.meta.lastBackup) return true;
  return daysBetween(S.meta.lastBackup, todayISO())>=21 && S.sessions.length-(S.meta.backupSessions||0)>=6;
}
// fichier partagé (Fichiers, iCloud, AirDrop…) ou, à défaut, téléchargé
async function shareOrDownload(payload, name, type, title){
  try{
    const file = new File([payload], name, { type });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title }); return true; }
  }catch(e){ if(e && e.name==="AbortError") return false; }
  const url = URL.createObjectURL(new Blob([payload], { type }));
  const a = document.createElement("a"); a.href = url; a.download = name;
  document.body.appendChild(a); a.click(); a.remove();
  setTimeout(()=>URL.revokeObjectURL(url), 5000);
  return true;
}
// Historique en tableur (v4.0) : une ligne par série, séparateur « ; » et virgule décimale
// (Numbers et Excel en français l'ouvrent directement), UTF-8 avec BOM pour les accents.
function historyCSV(){
  const q = v=>{ const s = String(v==null?"":v); return /[";\n\r]/.test(s) ? `"${s.replace(/"/g,'""')}"` : s; };
  const dec = v=>v==null||v==="" ? "" : String(v).replace(".", ",");
  const lines = [["date","séance","exercice","série","répétitions","secondes","charge (kg)","élastique","record","note"].join(";")];
  S.sessions.forEach(s=>s.exos.forEach(ex=>{
    const def = EXO_MAP[ex.exoId], name = def ? def.n : ex.exoId, timed = def && isTimed(def), lt = def && loadableTypeOf(def);
    ex.sets.filter(st=>st.done!==false).forEach((st,i)=>lines.push([s.date, q(sessionTitle(s)), q(name), i+1,
      timed ? "" : (st.reps||0), timed ? (st.reps||0) : "", lt && lt!=="bands" ? dec(st.weight) : "", lt==="bands" && st.weight ? q(bandLabel(st.weight)) : "",
      st.pr ? "oui" : "", i===0 ? q(s.note||"") : ""].join(";")));
  }));
  return "\ufeff"+lines.join("\r\n");
}
async function exportCSV(){
  if(!S.sessions.length){ toast("Aucune séance à exporter pour l'instant"); return; }
  const ok = await shareOrDownload(historyCSV(), `ascen-historique-${todayISO()}.csv`, "text/csv", "Historique ASCEN");
  if(ok){ sfx("set"); toast(`Historique exporté : ${S.sessions.length} séance${S.sessions.length>1?"s":""}`, "check"); }
}
async function backupData(){
  persistNow();
  const payload = JSON.stringify({ app:"ASCEN", format:1, version:APP_VERSION, exportedAt:new Date().toISOString(), data:S });
  const name = `ascen-sauvegarde-${todayISO()}.json`;
  let shared = false;
  try{
    const file = new File([payload], name, { type:"application/json" });
    if(navigator.canShare && navigator.canShare({ files:[file] })){ await navigator.share({ files:[file], title:"Sauvegarde ASCEN" }); shared = true; }
  }catch(e){ if(e && e.name==="AbortError") return; }
  if(!shared){
    const url = URL.createObjectURL(new Blob([payload], { type:"application/json" }));
    const a = document.createElement("a"); a.href = url; a.download = name;
    document.body.appendChild(a); a.click(); a.remove();
    setTimeout(()=>URL.revokeObjectURL(url), 5000);
  }
  S.meta.lastBackup = todayISO(); S.meta.backupSessions = S.sessions.length; delete S.meta.backupSnooze;
  save(); changed(); sfx("set"); toast("Sauvegarde créée. Garde le fichier dans Fichiers ou iCloud", "check");
}
function restoreData(){
  const inp = document.createElement("input");
  inp.type = "file"; inp.accept = "application/json,.json"; inp.style.display = "none";
  document.body.appendChild(inp);
  inp.addEventListener("change", async ()=>{
    const f = inp.files && inp.files[0]; inp.remove(); if(!f) return;
    let data;
    try{ const o = JSON.parse(await f.text()); data = o && o.data ? o.data : o; }catch(e){ data = null; }
    if(!data || typeof data!=="object" || !(Array.isArray(data.sessions) || Array.isArray(data.zs))){ openModal(`<div style="font-weight:700;color:var(--red)">Fichier non reconnu</div><div class="hr-note" style="margin-top:8px">Choisis un fichier de sauvegarde créé par ASCEN (ascen-sauvegarde-….json) ou par Forge.</div><button class="btn secondary" style="margin-top:14px" data-a="closesheet">OK</button>`); return; }
    const n = (Array.isArray(data.sessions) && data.sessions.length ? data.sessions : data.zs || []).length, t = Array.isArray(data.templates) ? data.templates.length : 0;
    confirmSheet({ title:"Restaurer cette sauvegarde ?", html:`${n} séance${n>1?"s":""} et ${t} séance${t>1?"s":""} enregistrée${t>1?"s":""}. Les données actuelles de cet appareil seront remplacées (une copie de secours est gardée).`, ok:"Restaurer", danger:true, onOk:()=>{
      try{ localStorage.setItem(STORAGE_KEY+".avant-restauration", JSON.stringify(S)); }catch(e){}
      let st; try{ st = normalizeState(data); }catch(e){ ERR_LOG.push({ at:new Date().toISOString(), where:"restauration", msg:String(e && e.message || e).slice(0,200) }); toast("Sauvegarde illisible : rien n'a été changé", "warn"); return; }
      if(S.draft) stopRestTimer();
      S = st;
      S.meta.lastBackup = S.meta.lastBackup || todayISO();
      save(); persistNow(); applyTheme(); checkMedals(true);
      renderViewAnimated(currentTab); toast(`Sauvegarde restaurée : ${n} séance${n>1?"s":""}`);
    }});
  });
  inp.click();
}

function exoPrefRow(e, missing){

function exoPrefsBodyHTML(){

  const unavail = [];
  const cats = EXO_CATS.map(c=>{

// Le poids varie de 1 à 2 kg d'un jour à l'autre (eau, glycogène, repas) : on montre la

}
function bodyTrend(){
  // moyenne des pesées des 14 derniers jours comparée à celle des 14 jours précédant il y a 30 jours
  const t = todayISO(), avg = (from, to)=>{ const l = S.body.filter(e=>e.d>from && e.d<=to); return l.length ? l.reduce((a,e)=>a+e.kg,0)/l.length : null; };
  const now = avg(addDaysISO(t,-14), t), before = avg(addDaysISO(t,-44), addDaysISO(t,-30));
  return now!=null && before!=null ? round1(now-before) : null;
}

function fmtBytes(n){ return n<1024*1024 ? `${Math.max(1, Math.round(n/1024))} Ko` : `${fmtDec(n/1024/1024)} Mo`; }
function storageRowText(){ const u = storageUsage(); return `${fmtBytes(u)} utilisés sur ~5 Mo · ${Math.max(1, Math.round(u/STORAGE_QUOTA*100))} %`; }
function storageYearsLeft(){
  // place moyenne d'une séance et rythme des 12 derniers mois
  const n = S.sessions.length; if(n<5) return null;
  const per = JSON.stringify(S.sessions.map(packSession)).length*2/n;
  const since = addDaysISO(todayISO(), -365), perYear = Math.max(52, S.sessions.filter(s=>s.date>=since).length);
  return Math.floor((STORAGE_QUOTA*0.9 - storageUsage())/(per*perYear));
}

// d'après l'élément fixe et opaque collé au bord haut de l'écran, à défaut d'après le fond de la
// page (et seulement s'il est écrit en style direct). Avant, l'écran de lancement (noir) et la
// bulle des graphiques (couleur du texte, en haut à gauche même invisible) lui donnaient du noir.
// On lui fournit donc un bandeau fixe (#sbar) toujours à la bonne couleur : le fond de l'app en
// haut de page, la barre de navigation (translucide, composée sur le fond) dès qu'on a défilé,
// assombri comme la page quand une feuille est ouverte. theme-color reste écrit pour les iOS
// plus anciens et Android.
let statusDim = false;
function syncStatusBar(dim){
  if(dim!==undefined) statusDim = dim;
  try{
    const bg = getComputedStyle(document.documentElement).getPropertyValue("--bg").trim();
    let rgb = hexRGB(bg);
    if(!rgb){ const c = getComputedStyle(document.body).backgroundColor.match(/[\d.]+/g); if(!c || (c.length>3 && +c[3]===0)) return; rgb = c.slice(0,3).map(Number); }
    const base = "#"+rgb.map(x=>Math.round(x).toString(16).padStart(2,"0")).join("");
    // fond de page en style direct (seul lu en direct par Safari 26)
    if(document.body.style.backgroundColor!==base){ document.body.style.backgroundColor = base; document.documentElement.style.backgroundColor = base; }
    const v = typeof currentTab!=="undefined" && document.getElementById("v-"+currentTab);
    if(v && v.classList.contains("scrolled")){
      const b = getComputedStyle(document.documentElement).getPropertyValue("--bar").match(/[\d.]+/g);
      if(b && b.length>=4) rgb = rgb.map((x,i)=>+b[i]*+b[3] + x*(1-+b[3]));
    }
    const k = statusDim ? .6 : 1, hex = "#"+rgb.map(x=>Math.round(x*k).toString(16).padStart(2,"0")).join("");
    let bar = document.getElementById("sbar");
    if(!bar){ bar = document.createElement("div"); bar.id = "sbar"; bar.setAttribute("aria-hidden","true"); document.body.appendChild(bar); }
    if(bar.style.backgroundColor!==hex) bar.style.backgroundColor = hex;
    let m = document.querySelector('meta[name="theme-color"]:not([media])');
    if(!m){ document.querySelectorAll('meta[name="theme-color"]').forEach(x=>x.remove()); m = document.createElement("meta"); m.name = "theme-color"; document.head.appendChild(m); }
    if(m.content!==hex) m.content = hex;
  }catch(e){}
}
function hexRGB(h){ const m = /^#([0-9a-f]{6})$/i.exec(h||""); return m ? [0,2,4].map(i=>parseInt(m[1].slice(i,i+2),16)) : null; }
if(window.matchMedia) try{ matchMedia("(prefers-color-scheme: dark)").addEventListener("change", ()=>syncStatusBar()); }catch(e){}

// ---------- animation de lancement ----------
// Le mot ASCEN apparaît en balayage, puis la barre du A monte de mi-hauteur à sa place :
// on « relève la barre ». Les animations portent sur des <div>, jamais sur des éléments
// internes aux SVG : piège Safari documenté dans Zeste.
function splashTagline(){
  const why = whyReminder(); if(why) return `« ${why} »`;
  const t = plannedTemplate();
  if(t && !sessionsToday().some(s=>s.tplId===t.id)) return `Aujourd'hui : ${t.n}`;
  const streak = currentStreakWeeks();
  if(streak>=2) return `${streak} semaines d'affilée — on continue`;
  if(sessionsToday().length) return "Séance du jour déjà faite, bravo";
  return "Un cran plus haut, à chaque séance";
}
function showSplash(){
  const reduce = window.matchMedia && matchMedia("(prefers-reduced-motion: reduce)").matches;
  const sp = document.createElement("div");
  sp.id = "splash";
  sp.className = reduce ? "splash reduce" : "splash";
  sp.innerHTML = `<div class="sp-logo">
      <div class="sp-letters">${ascenMark("", false)}</div>
      <div class="sp-bar"><svg class="ascen-mark" viewBox="0 5 206 56" stroke-width="6.5" stroke-linecap="round" aria-hidden="true"><path class="bar" d="${ASCEN_BAR}"/></svg></div>
    </div>
    <div class="sp-tag">${esc(splashTagline())}</div>`;
  document.body.appendChild(sp);
  let gone = false;
  const leave = ()=>{
    if(gone) return; gone = true;
    sp.classList.add("out");
    if(typeof needsOnboarding==="function" && needsOnboarding()) openOnboarding();
    setTimeout(()=>{ sp.remove(); syncStatusBar(); }, 450);
  };
  sp.addEventListener("click", leave);
  setTimeout(leave, reduce ? 600 : 1500);
}

function init(){
  buildShell();
  applyTheme();
  applyPlannedSession(); // la séance prévue aujourd'hui s'affiche directement
  switchTab("today");
  showSplash();
  // médailles déjà méritées (ex. après une mise à jour) : attribuées sans célébration, au calme
  // (une quarantaine de statistiques sur tout l'historique : pas pendant le démarrage)
  (window.requestIdleCallback || (f=>setTimeout(f, 1600)))(()=>{ const v = DATA_VER; checkMedals(true); if(DATA_VER!==v && !(S.draft && S.draft.startedAt)) renderView(currentTab); }, { timeout:2500 });
  // préchauffage au calme (v4.0) : les pictogrammes de tous les exercices sont calculés par petits
  // lots pendant les temps morts, pour que le choix d'exercices s'ouvre sans à-coup ; le test
  // WebGL des trophées 3D (≈ 40 ms la première fois) est fait au même moment
  const idle = window.requestIdleCallback || (f=>setTimeout(()=>f({ timeRemaining:()=>8 }), 200));
  const warm = EXOS.slice(); let warmedGL = false;
  (function step(dl){
    while(warm.length && (!dl || dl.timeRemaining()>3)){ const d = warm.shift(); try{ exoIcon(d); exoIcon(d, "sm"); }catch(e){} }
    if(!warmedGL && (!dl || dl.timeRemaining()>12)){ warmedGL = true; try{ if(typeof t3dWebGL==="function") t3dWebGL(); }catch(e){} }
    if(warm.length || !warmedGL) idle(step, { timeout:4000 });
  })();
  // manifeste d'installation : seulement servi par un vrai serveur (en fichier local, WebKit refuse de le lire)
  if(/^https?:$/.test(location.protocol) && !document.querySelector('link[rel="manifest"]')){ const l = document.createElement("link"); l.rel = "manifest"; l.href = "manifest.webmanifest"; document.head.appendChild(l); }
  // hors ligne : service worker (uniquement servi en https, pas en fichier local ni en aperçu)
  try{ if("serviceWorker" in navigator && (location.protocol==="https:" || location.hostname==="localhost") && !/claude\.ai|claudeusercontent/.test(location.hostname)) navigator.serviceWorker.register("sw.js").catch(()=>{}); }catch(e){}
  // une nouvelle version a été téléchargée en arrière-plan : elle servira au prochain lancement
  try{ if("serviceWorker" in navigator) navigator.serviceWorker.addEventListener("message", e=>{ if(e.data && e.data.type==="forge-updated") toast("Mise à jour prête : elle s'appliquera au prochain lancement"); }); }catch(e){}
  idbRecover(); // copie de secours IndexedDB (voir core.js)
  if(LOAD_SKIPPED) setTimeout(()=>toast(`${LOAD_SKIPPED} séance${LOAD_SKIPPED>1?"s":""} illisible${LOAD_SKIPPED>1?"s":""} mise${LOAD_SKIPPED>1?"s":""} de côté, le reste de l'historique est intact`), 1800);
  cleanupStorage();
  // demander un stockage persistant (le navigateur ne l'effacera pas pour libérer de la place)
  try{ if(navigator.storage && navigator.storage.persist) navigator.storage.persisted().then(p=>{ if(!p) navigator.storage.persist(); }).catch(()=>{}); }catch(e){}

  const fi = qs("#fileImport");
  if(fi){
    fi.addEventListener("change", async (e)=>{
      const file = e.target.files[0];
      if(!file) return;
      const text = await file.text();
      const res = importProgramJSON(text);
      fi.value = "";
      if(res.ok){
        toast(`Programme importé : ${res.count} séance(s)`);
        changed();
        if(res.warnings && res.warnings.length){
          setTimeout(()=>openModal(`<div style="font-weight:700">Avertissements</div>
            <div class="hr-note" style="margin-top:8px;text-align:left">${res.warnings.map(esc).join("<br>")}</div>
            <button class="btn secondary" style="margin-top:14px" data-a="closesheet">OK</button>`), 380);
        }
      } else {
        openModal(`<div style="font-weight:700;color:var(--red)">Import impossible</div>
          <div class="hr-note" style="margin-top:8px">${esc(res.error)}</div>
          <button class="btn secondary" style="margin-top:14px" data-a="closesheet">OK</button>`);
      }
    });
  }
}

init();

// ---------- mise en arrière-plan et retour dans l'app ----------
// iOS garde l'app en mémoire : on la retrouve telle qu'on l'a laissée, parfois le lendemain.
// À la sortie, les gestes en cours sont annulés (feuille, carte, graphique, médaille) ; au
// retour, si le jour a changé, l'écran du jour, le planning et la séance proposée se remettent
// à jour (une séance commencée reste intacte). Son et trophées 3D ont leur propre reprise
// (sfx.js, trophy3d.js).
// état repris d'un autre onglet (voir core.js) : minuteur, thème et écran à jour
function onExternalState(){
  if(!(S.draft && S.draft.startedAt) && typeof stopRestTimer==="function") stopRestTimer();
  applyTheme();
  if(qs("#overlay").classList.contains("open")) dirtyOnClose = true; else renderView(currentTab);
  toast("Données mises à jour depuis un autre onglet");
}
// Taille du texte réglée sur l'iPhone (Réglages › Luminosité et affichage › Taille du texte) :
// Safari expose la taille « corps de texte » via la police système -apple-system-body. Toute
// l'échelle typographique est en rem : elle suit, bornée à 17–21 px pour garder la mise en page.
function applyTextSize(){
  try{
    const p = document.createElement("div"); p.style.font = "-apple-system-body";
    if(!p.style.font) return; // hors Safari : taille par défaut
    p.style.position = "absolute"; p.style.visibility = "hidden"; document.body.appendChild(p);
    const px = parseFloat(getComputedStyle(p).fontSize); p.remove();
    if(px) document.documentElement.style.fontSize = Math.min(21, Math.max(17, Math.round(px)))+"px";
  }catch(e){}
}
applyTextSize();
document.addEventListener("visibilitychange", ()=>{ if(!document.hidden) applyTextSize(); });
let appDay = todayISO(), appAway = false;
function appSuspend(){
  document.dispatchEvent(new Event("ascen:suspend"));
  if(document.hidden || !document.hasFocus()) appAway = true;
}
function appResume(){
  if(!appAway) return;
  appAway = false;
  const day = todayISO();
  if(day===appDay) return;
  appDay = day;
  const live = S.draft && S.draft.startedAt;
  if(!live) applyPlannedSession();
  // l'onglet affiché se redessine (les autres le seront en y allant : voir switchTab)
  if(!(live && currentTab==="today")) renderView(currentTab);
}
document.addEventListener("visibilitychange", ()=>{ if(document.hidden) appSuspend(); else appResume(); });
window.addEventListener("pagehide", appSuspend);
window.addEventListener("blur", appSuspend);
window.addEventListener("pageshow", e=>{ if(e.persisted){ appAway = true; appResume(); } });
window.addEventListener("focus", appResume);
</script></body></html>
